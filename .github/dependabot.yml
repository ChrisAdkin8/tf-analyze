# Keep GitHub Actions current. Every `uses:` (workflows and action.yml) is
# pinned to a full commit SHA with a `# vX.Y.Z` comment: a tag can be moved
# to other code, a SHA cannot. Dependabot reads the comment and opens
# weekly PRs that bump the SHA and the comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
