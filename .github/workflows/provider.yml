name: provider

# The Terraform provider (Go) had no CI and could rot uncompiled. Build,
# vet and test it on any change under terraform-provider/. Path-filtered so
# it doesn't run on unrelated PRs.
on:
  push:
    paths:
      - "terraform-provider/**"
      - ".github/workflows/provider.yml"
  pull_request:
    paths:
      - "terraform-provider/**"
      - ".github/workflows/provider.yml"

permissions:
  contents: read

jobs:
  go:
    name: provider (go build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: terraform-provider/go.mod
          cache-dependency-path: terraform-provider/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
