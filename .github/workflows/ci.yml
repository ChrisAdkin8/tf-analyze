name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test (catalogue ↔ fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # stub-status.py needs git history for ages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest pytest-xdist --quiet
      - name: Run pytest (unit + clean fixtures)
        run: pytest tests/test_detection_core.py tests/test_attack_graph.py tests/test_clean_fixtures.py --tb=short -q --junitxml=test-results-unit.xml
      - name: Run fixture self-test
        run: python3 scripts/self_test.py
      - name: Run schema validator regression
        run: python3 scripts/test_schema.py
      - name: Catalogue strict-load (fail on any malformed YAML)
        # Pointing --target at the repo itself works because there are
        # no .tf files at the root — detect.py is happy with an empty
        # corpus, so this just exercises the strict-catalog path.
        run: python3 scripts/detect.py --target . --strict-catalog --list-rules > /dev/null
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: test-results-unit.xml
          retention-days: 14

  cli-docs:
    name: docs/cli.md is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/gen-cli-docs.py --check

  rule-docs:
    name: docs/rules/ is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The per-rule docs site (https://chrisadkin8.github.io/tf-analyze/rules/)
      # is generated from catalog/*.yaml. Drift is a public contract bug —
      # SARIF helpUri, compliance panel links, IDE hover all 404 if the
      # site is missing a page. Fail the build when the docs are stale
      # so the catalogue PR also touches the docs.
      - run: python3 scripts/gen_rule_docs.py --check

  stubs:
    name: no stubs older than 180 days
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Non-zero exit if any stub is older than 180 days. The threshold
      # is deliberately generous — half a year is enough time to either
      # promote a sketched-out rule to active or formally deprecate it.
      - run: python3 scripts/stub-status.py --age 180d

  terragoat:
    name: demo corpus produces expected finding count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lock the count down. If a rule is added or removed, the totals
      # must be updated as part of the same PR — drift signals an
      # unintended change in detection behaviour. We check per-cloud
      # totals separately so a regression in one cloud's coverage
      # can't be hidden by an offsetting change in another.
      - name: Count findings per cloud
        run: |
          set -euo pipefail
          for c in gcp aws azure; do
            N=$(
              python3 scripts/detect.py --target "examples/terragoat/$c" --format json \
                | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["findings"]))'
            )
            echo "$c: $N findings"
            case "$c" in
              # Per-cloud expected counts. Tolerance is roughly ±20%
              # because the catalogue evolves and this corpus is the
              # canvas. Tighten once the catalogue stabilises.
              gcp)   test "$N" -ge 48 -a "$N" -le 60 ;;
              aws)   test "$N" -ge 8  -a "$N" -le 16 ;;
              azure) test "$N" -ge 4  -a "$N" -le 10 ;;
            esac
          done
          TOTAL=$(
            python3 scripts/detect.py --target examples/terragoat --format json \
              | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["findings"]))'
          )
          echo "total: $TOTAL findings"
          test "$TOTAL" -ge 65 -a "$TOTAL" -le 80
