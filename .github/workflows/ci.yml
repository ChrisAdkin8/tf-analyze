name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: pytest (full suite, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `pyproject.toml` advertises `python_requires >= 3.10`, so every
        # supported minor must actually be exercised. Previously this job
        # ran on 3.12 only — a regression that needed a `match` statement
        # or `tomllib` quirk to surface would have slipped through.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # stub-status.py needs git history for ages
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest + hypothesis + pytest-timeout + pyyaml
        # hypothesis enables the property-based tests added for
        # `_blast_radius` cycle handling. pytest-timeout caps any
        # single test at 300s (audit follow-up #17) so a hung
        # subprocess can't stall the whole matrix slot. pyyaml is
        # required by test_compliance_owasp_iac.py and
        # test_readme_drift.py (both `import yaml` directly, not via
        # `pytest.importorskip`, so a missing dep halts collection).
        # jsonschema validates SARIF output (test_sarif_schema.py).
        run: pip install pytest pytest-xdist pytest-timeout hypothesis pyyaml jsonschema --quiet
      - name: Run full pytest suite
        # Audit item 31 — previously this step ran three named files,
        # leaving 43 test modules unexercised in CI. The full suite is
        # the single highest-ROI guard in the repo.
        #
        # `--timeout=300 --timeout-method=thread` (audit follow-up #17)
        # bounds any individual test at 5 minutes. `thread` instead of
        # `signal` is required because some tests spawn subprocesses;
        # signal-based timeouts can't interrupt a thread blocked in a
        # syscall.
        run: pytest tests/ --tb=short -q --timeout=300 --timeout-method=thread --junitxml=test-results-py${{ matrix.python-version }}.xml
      - name: Run fixture self-test
        run: python3 scripts/self_test.py
      - name: Run schema validator regression
        run: python3 scripts/test_schema.py
      - name: Catalogue strict-load (fail on any malformed YAML)
        run: python3 scripts/detect.py --target . --strict-catalog --list-rules > /dev/null
      - name: ATT&CK drift check (catalogue ↔ scripts/_mitre.py)
        run: python3 scripts/check_attack_drift.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results-py${{ matrix.python-version }}.xml
          retention-days: 14

  extension-tests:
    # Audit item 32 — `vscode-extension/` has its own `node:test` suite
    # (61 cases as of v0.1.44) that previously never ran in CI. The
    # blast-radius regression that shipped in v0.1.42-43 would have
    # been caught here; without this job, the next regression of the
    # same shape ships too.
    name: vscode-extension (npm test + bundle smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install extension deps
        working-directory: vscode-extension
        run: npm ci
      - name: Bundle engine (smoke-tests strict catalog + sibling imports)
        # Audit item 37 — the bundle script's smoke test only ran at
        # release. Running it on every push catches "added a new
        # `scripts/_foo.py` import but forgot to add it to
        # ENGINE_SIBLING_FILES" before it ships in a .vsix.
        working-directory: vscode-extension
        run: npm run bundle-engine
      - name: Run node:test
        working-directory: vscode-extension
        run: npm test

  cli-docs:
    name: docs/cli.md is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/gen-cli-docs.py --check

  rule-docs:
    name: docs/rules/ is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/gen_rule_docs.py --check

  stubs:
    name: no stubs older than 180 days
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/stub-status.py --age 180d

  terragoat:
    name: demo corpus matches checked-in snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Audit item 38 — the hand-coded bounds (gcp 60-110, aws 90-150,
      # azure 70-120, total 230-360) drift every ~10 rules. Replace
      # with a checked-in snapshot regenerated on each release. CI
      # asserts current counts match the snapshot; bumping the
      # snapshot is the deliberate "I added rules" gate.
      - name: Compare against snapshot
        run: python3 scripts/check_terragoat_snapshot.py

  fallback-path:
    # Parser migration §4.7: every rule must still work on a file
    # python-hcl2 can't parse. TF_ANALYZE_TEST_FORCE_FALLBACK=1 makes every
    # file take the regex fallback, so the whole fixture suite exercises it.
    name: pytest + self-test on the regex fallback path
    runs-on: ubuntu-latest
    env:
      TF_ANALYZE_TEST_FORCE_FALLBACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-xdist pytest-timeout hypothesis pyyaml jsonschema --quiet
      # Serial, like the unit-tests job: tests/test_perf.py times a corpus
      # scan against a wall-clock budget, and under `-n auto` it competes
      # with the rest of the suite on a 2-4 core runner (7.1s vs a 5s
      # budget on #39, while the same scan takes ~1.2s on its own).
      - run: pytest tests/ --tb=short -q --timeout=300 --timeout-method=thread
      - run: python3 scripts/self_test.py

  service-tests:
    # The Run Task, badge and MCP services' tests importorskip their
    # dependencies, which the other jobs don't install, so they never ran
    # in CI — and an unpinned `mcp` built an MCP image that crashed on
    # start unnoticed. Install each service's pinned requirements and run
    # its tests.
    name: service tests (run-task, badge, mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet pytest pyyaml httpx \
            -r integrations/run-task/requirements.txt \
            -r integrations/badge-service/requirements.txt \
            -r integrations/mcp-server/requirements.txt
      - run: >-
          pytest --tb=short -q
          tests/test_run_task_hardening.py tests/test_badge_service.py
          tests/test_mcp_server.py tests/test_mcp_server_hardening.py

  docker-images:
    # docker.yml only builds the root image, and only on push to main /
    # tags, so nothing gated a PR that broke an image: the root image went
    # 20+ builds broken (R31.7) and the MCP-server / Run Task images
    # shipped a detect.py-only COPY that couldn't import the engine. Each
    # Dockerfile runs its own build-time smoke test, so a plain build is
    # the check.
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: root
            dockerfile: Dockerfile
          - image: mcp-server
            dockerfile: integrations/mcp-server/Dockerfile
          - image: run-task
            dockerfile: integrations/run-task/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image (runs the in-build smoke test)
        run: docker build --file ${{ matrix.dockerfile }} --tag tf-analyze-${{ matrix.image }}:ci .
