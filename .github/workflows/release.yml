name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set version
        id: ver
        # Later steps paste these outputs into their scripts; the trigger
        # glob `v*.*.*` would match a tag like `v1.2.3$(cmd)`, so accept
        # only a plain version.
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release: tag '$VERSION' is not vX.Y.Z[-pre]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version-bare=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Tag matches the engine version
        # scripts/_meta.py is the single source of the version (package
        # metadata, --version, SARIF, LSP). A tag that disagrees would ship
        # artefacts labelled with two different versions.
        run: |
          ENGINE=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from _meta import __version__; print(__version__)")
          if [ "$ENGINE" != "${{ steps.ver.outputs.version-bare }}" ]; then
            echo "::error::tag ${{ steps.ver.outputs.version }} does not match scripts/_meta.py __version__ = $ENGINE"
            exit 1
          fi

      - name: Verify per-rule docs are in sync with catalogue
        # Tag-time gate: if the catalogue and docs/rules/ have drifted,
        # fail the release rather than publish a half-broken docs site.
        run: python3 scripts/gen_rule_docs.py --check

      - name: Build VS Code extension VSIX
        id: build-vsix
        continue-on-error: true
        run: |
          cd vscode-extension
          if [ -f package.json ]; then
            npm ci
            # Bump the extension's package.json version to match the tag
            # so the VSIX filename embeds the right version.
            npm version "${{ steps.ver.outputs.version-bare }}" --no-git-tag-version --allow-same-version
            npm run bundle-engine
            npm run compile
            npx vsce package --out "../tf-analyze-${{ steps.ver.outputs.version-bare }}.vsix"
            echo "vsix=tf-analyze-${{ steps.ver.outputs.version-bare }}.vsix" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Pull the section between this version's heading and the next `---` divider.
          # CHANGELOG.md uses `## VS Code extension v...` and `## Round NN — DATE`
          # headings; tag-driven releases pin to a Round heading or a top section
          # that mentions the tag explicitly.
          python3 - <<PY > release-notes.md
          import re, sys
          tag = "$VERSION"
          text = open("CHANGELOG.md").read()
          # Look for a heading that includes the tag (e.g. "v0.1.0") OR
          # fall back to the first '## ' section.
          m = re.search(rf"(^## .*{re.escape(tag.lstrip('v'))}.*?\n)(.*?)(?=^## |\Z)",
                        text, re.MULTILINE | re.DOTALL)
          if not m:
              m = re.search(r"^## (.+?)\n(.*?)(?=^## |\Z)", text, re.MULTILINE | re.DOTALL)
          if m:
              header = m.group(1).rstrip()
              body = m.group(2).strip()
              print(f"# {header}\n\n{body}\n")
          else:
              print(f"# {tag}\n\nSee [CHANGELOG.md](CHANGELOG.md) for details.\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: tf-analyze ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            tf-analyze-*.vsix
          generate_release_notes: false
