name: dogfood

# Run tf-analyze against its own example fixtures on every PR + push to main.
# This is the action's only end-to-end test in CI — pytest covers detect.py,
# but the action's bash + embedded JS/Python is otherwise unexercised.

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'examples/**'
      - '.github/workflows/dogfood.yml'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  attack-graph-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Test this checkout's engine, not the last image `main` published:
      # the action uses a locally present image as is (no pull).
      - name: Build the engine image from this checkout
        run: docker build -t tf-analyze:dogfood .
      - name: Run tf-analyze on attack-graph-demo
        id: scan
        uses: ./
        # The demo is vulnerable on purpose, with two CRITICALs: SSH open to
        # the world on the web security group (SEC-AWS-SG-001, escalated)
        # and the hard-coded database password (SEC-SECRETS-001 on
        # aws_db_instance.appdb). The gate must fail on them; the next step
        # checks that it did, and on exactly those findings. (Until Round
        # 51, --attack-graph wrongly demoted the first to HIGH; until the
        # gate-hardening fix it demoted the second, as appdb is unreachable.)
        continue-on-error: true
        with:
          target: examples/attack-graph-demo
          image: tf-analyze:dogfood
          fail-on: CRITICAL
          attack-graph: 'true'
          # Pin to static: mode=auto resolves to "diff" on PR events, which
          # scans only the files the PR changed. The demo rarely changes, so
          # a diff scan would find nothing and the next step's check on its
          # known CRITICALs would fail. (The image does ship `git`.)
          mode: static
      - name: Expect exactly the demo's known CRITICAL
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          # The action writes its reports under $RUNNER_TEMP, not the workspace.
          TFA_JSON_REPORT: ${{ steps.scan.outputs.json-report-path }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          with open(os.environ["TFA_JSON_REPORT"]) as f:
              findings = json.load(f)["findings"]
          critical = sorted(
              (f["id"], f.get("resource", "")) for f in findings if f.get("urgency") == "CRITICAL"
          )
          expected = [
              ("SEC-AWS-SG-001", "aws_security_group.web"),
              ("SEC-SECRETS-001", "aws_db_instance.appdb"),
          ]
          outcome = os.environ["SCAN_OUTCOME"]
          print(f"scan outcome: {outcome}; CRITICAL findings: {critical}")
          if outcome != "failure":
              sys.exit(f"::error::fail-on CRITICAL should have failed the scan (outcome: {outcome})")
          if critical != expected:
              sys.exit(f"::error::expected CRITICAL {expected}, got {critical}")
          PY
