name: dogfood

# Run tf-analyze against its own example fixtures on every PR + push to main.
# This is the action's only end-to-end test in CI — pytest covers detect.py,
# but the action's bash + embedded JS/Python is otherwise unexercised.

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'examples/**'
      - '.github/workflows/dogfood.yml'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  attack-graph-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Test this checkout's engine, not the last image `main` published:
      # the action uses a locally present image as is (no pull).
      - name: Build the engine image from this checkout
        run: docker build -t tf-analyze:dogfood .
      - name: Run tf-analyze on attack-graph-demo
        id: scan
        uses: ./
        # The demo is vulnerable on purpose: SSH open to the world on the
        # web security group is one CRITICAL (SEC-AWS-SG-001, escalated).
        # The gate must fail on it; the next step checks that it did, and
        # on exactly that finding. (Until Round 51, --attack-graph wrongly
        # demoted it to HIGH and this step passed.)
        continue-on-error: true
        with:
          target: examples/attack-graph-demo
          image: tf-analyze:dogfood
          fail-on: CRITICAL
          attack-graph: 'true'
          # Pin to static: mode=auto resolves to "diff" on PR events, but the
          # bundled image doesn't ship `git`, so diff mode currently errors
          # with FileNotFoundError. Tracked as a separate bug (Dockerfile
          # needs `apt-get install -y git`).
          mode: static
      - name: Expect exactly the demo's known CRITICAL
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          with open(os.path.join(os.environ["GITHUB_WORKSPACE"], "tf-analyze-findings.json")) as f:
              findings = json.load(f)["findings"]
          critical = sorted(
              (f["id"], f.get("resource", "")) for f in findings if f.get("urgency") == "CRITICAL"
          )
          expected = [("SEC-AWS-SG-001", "aws_security_group.web")]
          outcome = os.environ["SCAN_OUTCOME"]
          print(f"scan outcome: {outcome}; CRITICAL findings: {critical}")
          if outcome != "failure":
              sys.exit(f"::error::fail-on CRITICAL should have failed the scan (outcome: {outcome})")
          if critical != expected:
              sys.exit(f"::error::expected CRITICAL {expected}, got {critical}")
          PY
