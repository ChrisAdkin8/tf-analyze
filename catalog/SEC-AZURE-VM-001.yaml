id: SEC-AZURE-VM-001
title: "Linux VM allows SSH password authentication"
section: security
default_urgency: HIGH
blast_radius: single-resource
status: active
cis:
  - "7.3"
patterns:
  - kind: resource_arg
    resource: azurerm_linux_virtual_machine
    arg: disable_password_authentication
    regex: '^false$'
    description: |
      `azurerm_linux_virtual_machine` sets
      `disable_password_authentication = false`, turning on password SSH
      logins: brute-force and leaked-credential reuse against port 22 are
      constant on Azure public IPs. The argument defaults to `true`, so a
      VM that omits it (and authenticates with `admin_ssh_key`) is fine;
      the rule used to fire on every such VM.
recommendation: |
  Disable password authentication and supply an SSH public key:

      resource "azurerm_linux_virtual_machine" "app" {
        # ...
        disable_password_authentication = true

        admin_ssh_key {
          username   = "azureuser"
          public_key = data.azurerm_key_vault_secret.ssh_pubkey.value
        }
      }

  Store SSH public keys in Key Vault (`data.azurerm_key_vault_secret`)
  rather than hardcoding them in source or tfvars. Enforce across all VMs
  via Azure Policy: `"Audit Linux machines that allow remote connections
  from accounts without passwords"` (built-in policy definition).
verification: |
  `az vm show -g <rg> -n <name> \
    --query osProfile.linuxConfiguration.disablePasswordAuthentication`
  must return `true`.
pci_dss:
  - "Req-8.2"
mitre:
  - "T1110.001"
cwe:
  - "CWE-521"
  - "CWE-307"
d3fend:
  - "D3-AL"
  - "D3-MFA"
nist_csf:
  - "PR.AC-7"
nist_800_53:
  - "IA-5"
  - "AC-7"
csa_ccm:
  - "IAM-12"
fix_hcl: |
  resource "azurerm_linux_virtual_machine" "example" {
    # ... other arguments ...
    disable_password_authentication = true
    admin_ssh_key {
      username   = "adminuser"
      public_key = file("~/.ssh/id_rsa.pub")
    }
  }
fix_disruption: plan_required
fixtures:
  - azure_linux_vm_password_auth
