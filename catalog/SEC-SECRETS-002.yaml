id: SEC-SECRETS-002
title: "aws_ssm_parameter stores a sensitive value as plain `String` (not `SecureString`)"
section: security
default_urgency: HIGH
blast_radius: single-resource
status: active
mitre:
  - "T1552.001"
cwe:
  - "CWE-256"
  - "CWE-312"
nist_csf:
  - "PR.DS-1"
  - "PR.DS-5"
nist_800_53:
  - "SC-28"
  - "SC-28(1)"
  - "IA-5(1)"
csa_ccm:
  - "DSI-04"
  - "EKM-04"
owasp:
  - "A02"
patterns:
  - kind: resource_arg
    resource: aws_ssm_parameter
    arg: type
    not_regex: '^SecureString$'
    fire_if_absent: true
    description: |
      `aws_ssm_parameter` with `type = "String"` (the default) stores
      its value unencrypted at rest. Anyone with
      `ssm:GetParameter` reads it verbatim. `SecureString` keys it
      against a KMS CMK and locks it behind `kms:Decrypt`.
recommendation: |
  resource "aws_ssm_parameter" "db_password" {
    name   = "/prod/db/password"
    type   = "SecureString"
    key_id = aws_kms_key.params.arn   # CMK; avoid the default alias
    value  = var.db_password
  }

  CWE-256 (Plaintext Storage of a Password) and NIST SC-28(1)
  (Cryptographic Protection of Information at Rest) both flag the
  plain-String path.
verification: |
  `aws ssm describe-parameters --query 'Parameters[?Type==`String`]'`
  Cross-check against your inventory of sensitive parameter names;
  any name containing `password|secret|token|key` should be `SecureString`.
fix_disruption: plan_required
fixtures:
  - aws_ssm_parameter_plain_string
