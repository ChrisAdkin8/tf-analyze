id: ROB-VERSION-002
title: "Submodule directory has no required_version"
section: robustness
default_urgency: LOW
blast_radius: module
status: active
patterns:
  - kind: submodule_version_missing
    description: A submodule directory (.tf present) has no required_version constraint anywhere
owasp_iac:
  - "Develop and Distribute / Version Control Discipline"
mitre:
  - "T1195.002"
cwe:
  - "CWE-1357"
d3fend:
  - "D3-SCA"
nist_csf:
  - "ID.SC-2"
  - "PR.IP-1"
nist_800_53:
  - "CM-2"
  - "SR-3"
csa_ccm:
  - "STA-04"
  - "CCC-05"
slsa:
  - "L1"
  - "source"
recommendation: |
  Submodules inherit the root's Terraform version *implicitly*. That hides
  feature-level assumptions: a submodule using `optional()` object attrs or
  `moved {}` blocks will silently break if the root drops to pre-1.3 /
  pre-1.1. Declare:

  ```hcl
  terraform {
    required_version = ">= 1.6"
  }
  ```

  in each submodule so `terraform get` fails fast on unsupported versions.
verification: |
  Run `terraform init` inside the submodule directory (if it is callable
  in isolation) — it should enforce the new constraint.
fix_hcl: |
  terraform {
    required_version = ">= 1.6, < 2.0"
  }
fix_disruption: none
fixtures:
  - submodule_no_version
