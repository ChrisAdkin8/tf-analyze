id: SEC-AWS-ECR-001
title: "ECR repository missing scan-on-push"
section: security
default_urgency: HIGH
blast_radius: single-resource
status: active
patterns:
  - kind: resource_missing_arg
    resource: aws_ecr_repository
    nested_path: image_scanning_configuration.scan_on_push
  - kind: hcl_attr
    resource: aws_ecr_repository
    path: image_scanning_configuration.scan_on_push
    not_equal: true
recommendation: |
  Enable scan-on-push to catch known CVEs in base images at push time:

      resource "aws_ecr_repository" "app" {
        name = "app"

        image_scanning_configuration {
          scan_on_push = true
        }
      }

  Without scanning, supply-chain CVEs in base images are not surfaced
  until a separate scanner runs (if one is configured at all). Scan-on-push
  is free and adds no latency to pull operations.
verification: |
  `aws ecr describe-repositories --repository-names <name> \
    --query 'repositories[0].imageScanningConfiguration.scanOnPush'`
  must return `true`.
fix_hcl: |
  resource "aws_ecr_repository" "example" {
    name = "example"
    image_scanning_configuration {
      scan_on_push = true
    }
  }
fix_disruption: none
fixtures:
  - ecr_no_scan_on_push
