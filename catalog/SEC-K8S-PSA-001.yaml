id: SEC-K8S-PSA-001
title: "kubernetes_namespace missing PSA label OR helm_release turns off runAsNonRoot / readOnlyRootFilesystem / capabilities.drop"
section: security
default_urgency: MEDIUM
blast_radius: environment
status: active
cis:
  - "5.2.1"
  - "5.7.3"
pci_dss:
  - "Req-2.2"
soc2_cc:
  - "CC6.6"
mitre:
  - "T1611"
cwe:
  - "CWE-269"
  - "CWE-250"
nist_csf:
  - "PR.PT-3"
nist_800_53:
  - "AC-6"
csa_ccm:
  - "IAM-09"
owasp:
  - "K01"
  - "K04"
# Absorbs the NIST 800-190 (Application Container Security)
# `STK-K8S-RUNTIME-001` requirement: pods must run with
# `runAsNonRoot=true`, `readOnlyRootFilesystem=true`, and
# `capabilities.drop=[ALL]`. The helm_set_value patterns below catch a
# helm_release `set` that explicitly turns one of these off; a release
# that leaves a value at the chart default is not reported (the default
# lives in the chart, which is not scanned).
patterns:
  - kind: resource_missing_arg
    resource: kubernetes_namespace
    nested_path: metadata.labels
    description: |
      `kubernetes_namespace` block has no `metadata.labels` (or labels
      without `pod-security.kubernetes.io/enforce`). Without a Pod
      Security Admission level, the namespace defaults to no enforcement
      — privileged pods, hostPath mounts, and host-network pods are all
      permitted. PSA replaced the deprecated PodSecurityPolicy in 1.25.
  - kind: helm_set_value
    resource: helm_release
    name: securityContext.runAsNonRoot
    regex: '(?i)^\s*false\s*$'
    description: |
      R30.5 / NIST 800-190 — helm_release sets
      `securityContext.runAsNonRoot = false`; it must be `true`.
      Containers running as uid 0 inside the pod expose the host to
      capability escalations. (`helm_set_value` fires on the value the
      release sets, so the regex names the bad value, not the good one.)
  - kind: helm_set_value
    resource: helm_release
    name: securityContext.readOnlyRootFilesystem
    regex: '(?i)^\s*false\s*$'
    description: |
      R30.5 / NIST 800-190 — helm_release sets
      `securityContext.readOnlyRootFilesystem = false`; it must be
      `true`. A writable rootfs lets attackers persist tooling across
      pod restarts.
  - kind: helm_set_value
    resource: helm_release
    name: securityContext.capabilities.drop
    regex: '^(?!\$\{|(?:var|local|module|data|each)\.)(?!.*\bALL\b)'
    description: |
      R30.5 / NIST 800-190 — helm_release overrides
      `securityContext.capabilities.drop` with a list that leaves out
      `ALL` (a reference such as `var.x` is unknown here and is not
      reported). Drop ALL kernel capabilities and add back only what
      the app needs. Default Linux capabilities (CAP_NET_RAW etc.) give
      a compromised pod meaningful escalation surface.
recommendation: |
  Add the PSA enforcement label to every namespace, scoped to the
  least-privileged level the workload tolerates:

      resource "kubernetes_namespace" "app" {
        metadata {
          name = "app"
          labels = {
            "pod-security.kubernetes.io/enforce"         = "restricted"
            "pod-security.kubernetes.io/enforce-version" = "latest"
          }
        }
      }

  Use `baseline` for legacy workloads that still need privileged
  capabilities; `restricted` is the right default for new workloads.
verification: |
  `kubectl get ns -o jsonpath='{.items[*].metadata.labels.pod-security\.kubernetes\.io/enforce}'`
  must list a level for every non-system namespace.
fix_hcl: |
  resource "kubernetes_namespace" "example" {
    metadata {
      name = "example"
      labels = {
        "pod-security.kubernetes.io/enforce"         = "restricted"
        "pod-security.kubernetes.io/enforce-version" = "latest"
      }
    }
  }
fix_disruption: plan_required
fix_disruption_note: "Tightening PSA on a running namespace can reject pending pods that violate the level. Roll out in audit mode first."
fixtures:
  - k8s_namespace_no_psa
  - k8s_helm_psa_disabled
