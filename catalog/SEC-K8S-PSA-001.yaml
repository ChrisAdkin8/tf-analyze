id: SEC-K8S-PSA-001
title: "kubernetes_namespace missing PSA label OR helm_release omits runAsNonRoot / readOnlyRootFilesystem / capabilities.drop"
section: security
default_urgency: HIGH
blast_radius: environment
status: active
cis:
  - "5.2.1"
  - "5.7.3"
pci_dss:
  - "Req-2.2"
soc2_cc:
  - "CC6.6"
mitre:
  - "T1611"
cwe:
  - "CWE-269"
  - "CWE-250"
nist_csf:
  - "PR.AC-4"
  - "PR.IP-1"
nist_800_53:
  - "AC-6"
  - "CM-7"
  - "SI-7"
csa_ccm:
  - "IAM-15"
  - "TVM-04"
owasp:
  - "K01"
  - "K04"
# Absorbs the NIST 800-190 (Application Container Security)
# `STK-K8S-RUNTIME-001` requirement: pods must run with
# `runAsNonRoot=true`, `readOnlyRootFilesystem=true`, and
# `capabilities.drop=[ALL]`. The helm_set_value pattern below catches
# the most common helm-chart values that fail to set these.
patterns:
  - kind: resource_missing_arg
    resource: kubernetes_namespace
    nested_path: metadata.labels
    description: |
      `kubernetes_namespace` block has no `metadata.labels` (or labels
      without `pod-security.kubernetes.io/enforce`). Without a Pod
      Security Admission level, the namespace defaults to no enforcement
      — privileged pods, hostPath mounts, and host-network pods are all
      permitted. PSA replaced the deprecated PodSecurityPolicy in 1.25.
  - kind: helm_set_value
    resource: helm_release
    name: securityContext.runAsNonRoot
    expected: 'true'
    description: |
      R30.5 / NIST 800-190 — helm_release must set
      `securityContext.runAsNonRoot = true`. Containers running as
      uid 0 inside the pod expose the host to capability escalations.
  - kind: helm_set_value
    resource: helm_release
    name: securityContext.readOnlyRootFilesystem
    expected: 'true'
    description: |
      R30.5 / NIST 800-190 — helm_release must set
      `securityContext.readOnlyRootFilesystem = true`. A writable
      rootfs lets attackers persist tooling across pod restarts.
  - kind: helm_set_value
    resource: helm_release
    name: securityContext.capabilities.drop
    expected: 'ALL'
    description: |
      R30.5 / NIST 800-190 — drop ALL kernel capabilities and add back
      only what the app needs. Default Linux capabilities (CAP_NET_RAW
      etc.) give a compromised pod meaningful escalation surface.
recommendation: |
  Add the PSA enforcement label to every namespace, scoped to the
  least-privileged level the workload tolerates:

      resource "kubernetes_namespace" "app" {
        metadata {
          name = "app"
          labels = {
            "pod-security.kubernetes.io/enforce"         = "restricted"
            "pod-security.kubernetes.io/enforce-version" = "latest"
          }
        }
      }

  Use `baseline` for legacy workloads that still need privileged
  capabilities; `restricted` is the right default for new workloads.
verification: |
  `kubectl get ns -o jsonpath='{.items[*].metadata.labels.pod-security\.kubernetes\.io/enforce}'`
  must list a level for every non-system namespace.
fix_hcl: |
  resource "kubernetes_namespace" "example" {
    metadata {
      name = "example"
      labels = {
        "pod-security.kubernetes.io/enforce"         = "restricted"
        "pod-security.kubernetes.io/enforce-version" = "latest"
      }
    }
  }
fix_disruption: plan_required
fix_disruption_note: "Tightening PSA on a running namespace can reject pending pods that violate the level. Roll out in audit mode first."
fixtures:
  - k8s_namespace_no_psa
