id: SEC-AZURE-STORAGE-002
title: "Azure storage account allows public blob access"
section: security
default_urgency: HIGH
blast_radius: single-resource
cis:
  - "3.7"
mitre:
  - "T1530"
cwe:
  - "CWE-732"
  - "CWE-284"
nist_csf:
  - "PR.AC-3"
  - "PR.AC-4"
nist_800_53:
  - "AC-3"
  - "SC-7"
csa_ccm:
  - "IAM-09"
  - "IVS-04"
status: active
patterns:
  - kind: resource_arg
    resource: azurerm_storage_account
    arg: allow_blob_public_access
    regex: '^true$'
  - kind: resource_arg
    resource: azurerm_storage_account
    arg: allow_nested_items_to_be_public
    regex: '^true$'
recommendation: |
  Set `allow_nested_items_to_be_public = false` (provider v3+). Public blob
  access allows anonymous reads of any blob in any container with public access
  — the most common cause of cloud data breaches.

      resource "azurerm_storage_account" "example" {
        # ...
        allow_nested_items_to_be_public = false
      }
verification: |
  After applying, confirm with:

      az storage account show --name <name> --query allowBlobPublicAccess

  The command should return `false`.
fix_hcl: |
  resource "azurerm_storage_account" "example" {
    # ... other arguments ...
    allow_nested_items_to_be_public = false
  }
fix_disruption: plan_required
fixtures:
  - azure_storage_public_blob
