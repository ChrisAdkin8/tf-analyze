id: SEC-AWS-S3-001
title: "S3 bucket missing server-side encryption configuration"
section: security
default_urgency: HIGH
blast_radius: single-resource
cis:
  - "2.1.1"
status: active
patterns:
  - kind: resource_missing_arg
    resource: aws_s3_bucket_server_side_encryption_configuration
    arg: rule
    description: S3 bucket without encryption configuration resource
  - kind: resource_missing_arg
    resource: aws_s3_bucket
    nested_path: server_side_encryption_configuration.rule
    description: S3 bucket with legacy inline encryption block missing (pre-v4 provider)
recommendation: |
  Create an `aws_s3_bucket_server_side_encryption_configuration` resource
  for every S3 bucket, or use the legacy inline block for provider < 4.0.
  At minimum, use `AES256` (SSE-S3). For sensitive data, use `aws:kms`
  with a customer-managed KMS key.
verification: |
  Run `aws s3api get-bucket-encryption --bucket <name>` and confirm
  encryption is enabled.
fixtures:
  - attack_graph_demo
  - aws_s3_insecure
test_template: |
  run "s3_encryption_enabled_{rule_id}" {
    command = plan
    assert {
      condition     = length(aws_s3_bucket_server_side_encryption_configuration.{resource}) > 0
      error_message = "{resource} must have server-side encryption configured (SEC-AWS-S3-001)."
    }
  }
fix_hcl: |
  resource "aws_s3_bucket_server_side_encryption_configuration" "example" {
    bucket = aws_s3_bucket.example.id
    rule {
      apply_server_side_encryption_by_default {
        sse_algorithm = "aws:kms"
      }
    }
  }
