id: SEC-PROVIDER-001
title: "Provider version constraint missing upper bound"
section: security
default_urgency: MEDIUM
blast_radius: infrastructure-wide
status: active
nist_csf:
  - "PR.DS-5"
nist_800_53:
  - "SC-28"
csa_ccm:
  - "CEK-09"
patterns:
  - kind: grep
    text_scan: "Terraform structure outside resource attributes (module source, version constraints, lifecycle, data / provisioner blocks) - no structured kind for it yet"
    code_only: true  # ignore comments and heredoc text
    file_glob: "**/versions.tf"
    # The whole constraint is a lower bound: no `<`, `<=` or `~>` part
    # (">= 5.0, < 6.0" is bounded and must not fire).
    regex: '(?<![_a-zA-Z])version\s*=\s*">=\s*[0-9][^"<~]*"'
  - kind: grep
    text_scan: "Terraform structure outside resource attributes (module source, version constraints, lifecycle, data / provisioner blocks) - no structured kind for it yet"
    code_only: true  # ignore comments and heredoc text
    file_glob: "**/*.tf"
    regex: 'required_providers\s*\{[^}]*(?<![_a-zA-Z])version\s*=\s*">=\s*[0-9][^"<~]*"'
recommendation: |
  Replace `>= X.Y` constraints with `~> X.Y` to bound the major version.
  For production stability, prefer `~> X.Y` (minor pin) over `~> X` (major
  pin). The 2026-04-11 finding history shows 70% of provider-related plan
  failures came from automatic major version upgrades.
verification: |
  After updating the constraint, run `terraform init -upgrade` and confirm
  the locked provider version in `.terraform.lock.hcl` is within the new
  range.
fix_hcl: |
  terraform {
    required_providers {
      aws = {
        source  = "hashicorp/aws"
        version = ">= 5.0, < 6.0"
      }
    }
  }
fix_disruption: none
fixtures:
  - attack_graph_demo
  - wide_provider_constraint
