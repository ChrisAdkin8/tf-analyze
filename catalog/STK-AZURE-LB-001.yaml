id: STK-AZURE-LB-001
title: "Azure Load Balancer missing diagnostic settings"
section: stack
default_urgency: MEDIUM
blast_radius: single-resource
status: active
pci_dss:
  - "Req-10.2"
soc2_cc:
  - "CC7.2"
mitre:
  - "T1562.008"
cwe:
  - "CWE-778"
d3fend:
  - "D3-IAA"
nist_csf:
  - "DE.CM-1"
nist_800_53:
  - "AU-2"
patterns:
  - kind: resource_absent
    resource: azurerm_monitor_diagnostic_setting
    when_present: azurerm_lb
    description: |
      `azurerm_lb` is declared but no `azurerm_monitor_diagnostic_setting`
      is bound. Health probe results, load distribution events, and
      backend pool failures are not logged.
recommendation: |
  Ship LB metrics + logs to Log Analytics:

      resource "azurerm_monitor_diagnostic_setting" "lb" {
        name                       = "lb-diag"
        target_resource_id         = azurerm_lb.main.id
        log_analytics_workspace_id = azurerm_log_analytics_workspace.main.id
        enabled_log { category = "LoadBalancerHealthEvent" }
        metric { category = "AllMetrics" enabled = true }
      }
verification: |
  `az monitor diagnostic-settings list --resource <lb-id>` must return
  at least one configuration.
fix_hcl: |
  resource "azurerm_monitor_diagnostic_setting" "lb" {
    name                       = "lb-diag"
    target_resource_id         = azurerm_lb.example.id
    log_analytics_workspace_id = azurerm_log_analytics_workspace.example.id
    enabled_log {
      category = "LoadBalancerHealthEvent"
    }
  }
fix_disruption: none
fixtures:
  - azure_lb_no_diag
