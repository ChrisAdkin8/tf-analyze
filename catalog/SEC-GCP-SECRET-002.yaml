id: SEC-GCP-SECRET-002
title: "GCP Secret Manager secret without CMEK on user-managed replication"
section: security
default_urgency: MEDIUM
blast_radius: single-resource
status: active
pci_dss:
  - "Req-3.4"
soc2_cc:
  - "CC6.7"
mitre:
  - "T1552.001"
cwe:
  - "CWE-311"
d3fend:
  - "D3-EAR"
nist_csf:
  - "PR.DS-1"
nist_800_53:
  - "SC-12"
  - "SC-13"
csa_ccm:
  - "CEK-03"
patterns:
  - kind: resource_has_block
    resource: google_secret_manager_secret
    path: replication.auto
    empty: true
    description: |
      `google_secret_manager_secret` uses an empty `replication.auto {}`,
      which is encrypted with a Google-managed key. CMEK requires
      `customer_managed_encryption.kms_key_name` inside `auto`, or
      explicit `replication.user_managed` with one per replica.
  - kind: resource_arg
    resource: google_secret_manager_secret
    arg: replication.automatic
    regex: '^true$'
    description: |
      Same, in the pre-v5 provider form `replication { automatic = true }`
      — always a Google-managed key.
recommendation: |
  Switch to user-managed replication with CMEK:

      resource "google_secret_manager_secret" "db_pw" {
        secret_id = "db-pw"
        replication {
          user_managed {
            replicas {
              location = "us-central1"
              customer_managed_encryption {
                kms_key_name = google_kms_crypto_key.secrets.id
              }
            }
          }
        }
      }
verification: |
  `gcloud secrets describe <name> --format=json | jq '.replication.userManaged.replicas[].customerManagedEncryption.kmsKeyName'`
  must return non-null KMS key names for every replica.
fix_hcl: |
  resource "google_secret_manager_secret" "example" {
    secret_id = "example"
    replication {
      user_managed {
        replicas {
          location = "us-central1"
          customer_managed_encryption {
            kms_key_name = "projects/example/locations/us-central1/keyRings/r/cryptoKeys/k"
          }
        }
      }
    }
  }
fix_disruption: forces_replacement
fixtures:
  - gcp_secret_no_cmek
