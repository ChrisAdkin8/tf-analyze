id: SEC-AWS-IAM-POLICY-005
title: "IAM policy grants both `actions = [\"*\"]` and `resources = [\"*\"]`"
section: security
default_urgency: CRITICAL
blast_radius: infrastructure-wide
status: active
cis:
  - "1.16"
pci_dss:
  - "Req-7.2.2"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1078.004"
  - "T1098.001"
patterns:
  - kind: iam_policy_analysis
    check: wildcard_action_and_resource
    description: |
      Single statement grants `actions = ["*"]` *and* `resources = ["*"]`
      with effect Allow. This is the canonical "AdministratorAccess"
      shape — equivalent to attaching the AWS-managed Administrator
      policy by hand-rolled means and bypassing org-level guardrails
      that detect the named policy.
owasp_iac:
  - "Develop and Distribute / Resource Permission Minimization"
cwe:
  - "CWE-269"
  - "CWE-732"
nist_csf:
  - "PR.AC-4"
nist_800_53:
  - "AC-3"
  - "AC-6"
csa_ccm:
  - "IAM-09"
recommendation: |
  Replace the wildcard with the explicit minimum action and resource set
  the workload needs. Attaching the AWS-managed `AdministratorAccess`
  policy instead is not a fix: it grants exactly the same access. If a
  principal truly needs full administrator access, keep it to a
  break-glass role behind MFA and an SCP guardrail, and record why.
verification: |
  No policy statement should combine `Action: "*"` and `Resource: "*"`.
  CloudTrail data events on this principal should narrow to a small
  set of services after the fix.
fix_hcl: |
  data "aws_iam_policy_document" "example" {
    statement {
      effect    = "Allow"
      actions   = ["s3:GetObject", "s3:PutObject"]
      resources = ["arn:aws:s3:::my-bucket/*"]
    }
  }
fix_disruption: plan_required
fixtures:
  - aws_iam_policy_full_admin
