id: SEC-AZURE-KV-001
title: "Azure Key Vault missing purge protection or soft delete"
section: security
default_urgency: HIGH
blast_radius: module
cis:
  - "8.4"
mitre:
  - "T1530"
cwe:
  - "CWE-311"
d3fend:
  - "D3-EAR"
status: active
patterns:
  - kind: resource_arg
    resource: azurerm_key_vault
    arg: purge_protection_enabled
    regex: '^false$'
  - kind: resource_missing_arg
    resource: azurerm_key_vault
    arg: purge_protection_enabled
  - kind: resource_arg
    resource: azurerm_key_vault
    arg: soft_delete_retention_days
    regex: '^[0-6]$'
recommendation: |
  Set `purge_protection_enabled = true` and `soft_delete_retention_days = 90`.
  Without purge protection, an attacker (or accident) that deletes the Key Vault
  bypasses the soft-delete window by purging — secrets, keys, and certificates
  are gone permanently.

      resource "azurerm_key_vault" "example" {
        # ...
        purge_protection_enabled    = true
        soft_delete_retention_days  = 90
      }
verification: |
  After applying, confirm with:

      az keyvault show --name <name> \
        --query '{purgeProtection:properties.enablePurgeProtection,softDelete:properties.enableSoftDelete}'

  Both values should return `true`.
fix_hcl: |
  resource "azurerm_key_vault" "example" {
    # ... other arguments ...
    purge_protection_enabled    = true
    soft_delete_retention_days  = 90
  }
fix_disruption: plan_required
fixtures:
  - azure_kv_no_purge
