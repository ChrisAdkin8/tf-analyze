id: SEC-AZURE-LOGGING-001
title: "Azure Key Vault missing diagnostic settings"
section: security
default_urgency: HIGH
blast_radius: single-resource
cis:
  - "8.7"
status: active
patterns:
  - kind: resource_absent
    resource: azurerm_monitor_diagnostic_setting
    when_present: azurerm_key_vault
recommendation: |
  Add `azurerm_monitor_diagnostic_setting` targeting the Key Vault with
  `AuditEvent` logs enabled and at minimum a `log_analytics_workspace_id`
  destination. Without this, secret access and modification events are
  unlogged.

      resource "azurerm_monitor_diagnostic_setting" "kv" {
        name                       = "kv-diagnostics"
        target_resource_id         = azurerm_key_vault.example.id
        log_analytics_workspace_id = azurerm_log_analytics_workspace.example.id

        enabled_log {
          category = "AuditEvent"
        }

        metric {
          category = "AllMetrics"
          enabled  = true
        }
      }
verification: |
  After applying, confirm with:

      az monitor diagnostic-settings list --resource <kv-id>

  The response should be a non-empty list with `AuditEvent` enabled.
pci_dss:
  - "Req-10.2"
soc2_cc:
  - "CC7.2"
fix_hcl: |
  resource "azurerm_monitor_diagnostic_setting" "kv" {
    name                       = "kv-diagnostics"
    target_resource_id         = azurerm_key_vault.example.id
    log_analytics_workspace_id = azurerm_log_analytics_workspace.example.id
    enabled_log { category = "AuditEvent" }
    metric {
      category = "AllMetrics"
      enabled  = true
    }
  }
fix_disruption: none
fixtures:
  - azure_kv_no_diagnostics
