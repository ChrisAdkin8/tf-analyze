id: SEC-AZURE-COSMOS-002
title: "Azure Cosmos DB account not using customer-managed key"
section: security
default_urgency: MEDIUM
blast_radius: single-resource
status: active
pci_dss:
  - "Req-3.4"
soc2_cc:
  - "CC6.7"
mitre:
  - "T1530"
cwe:
  - "CWE-311"
d3fend:
  - "D3-EAR"
nist_csf:
  - "PR.DS-1"
nist_800_53:
  - "SC-13"
  - "SC-28"
csa_ccm:
  - "CEK-03"
patterns:
  - kind: resource_missing_arg
    resource: azurerm_cosmosdb_account
    arg: key_vault_key_id
    description: |
      `azurerm_cosmosdb_account` has no `key_vault_key_id`. Without a CMK,
      Cosmos DB data is encrypted with a Microsoft-managed key that cannot
      be revoked, audited independently, or rotated on a custom schedule.
recommendation: |
  Bind a Key Vault key to the Cosmos account:

      resource "azurerm_cosmosdb_account" "main" {
        # ...
        key_vault_key_id = azurerm_key_vault_key.cosmos.versionless_id
        identity { type = "SystemAssigned" }
      }

  Note: CMK can only be enabled at account creation; existing accounts
  cannot be migrated in place.
verification: |
  `az cosmosdb show --name <name> --resource-group <rg> \
    --query keyVaultKeyUri` must return a non-null Key Vault URI.
fix_hcl: |
  resource "azurerm_cosmosdb_account" "example" {
    name                = "example"
    location            = azurerm_resource_group.example.location
    resource_group_name = azurerm_resource_group.example.name
    offer_type          = "Standard"
    kind                = "GlobalDocumentDB"
    key_vault_key_id    = azurerm_key_vault_key.example.versionless_id
    identity { type = "SystemAssigned" }
    consistency_policy { consistency_level = "Session" }
    geo_location {
      location          = azurerm_resource_group.example.location
      failover_priority = 0
    }
  }
fix_disruption: forces_replacement
fix_disruption_note: "CMK on Cosmos cannot be enabled in place; replacing the account requires data migration."
fixtures:
  - azure_cosmos_no_cmk
