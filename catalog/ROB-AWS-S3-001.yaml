id: ROB-AWS-S3-001
title: "S3 bucket versioning disabled or suspended"
section: robustness
default_urgency: MEDIUM
blast_radius: single-resource
cis:
  - "2.1.2"
status: active
patterns:
  - kind: resource_arg
    resource: aws_s3_bucket_versioning
    arg: versioning_configuration.status
    regex: "^(Disabled|Suspended)$"
    description: S3 bucket versioning disabled or suspended
  - kind: resource_missing_arg
    resource: aws_s3_bucket
    arg: versioning
    description: S3 bucket missing versioning block (pre-v4 provider inline block)
recommendation: |
  Set `versioning_configuration { status = "Enabled" }` on the
  `aws_s3_bucket_versioning` resource associated with every S3 bucket
  that holds important data. Versioning protects against accidental
  overwrites and deletions by retaining prior object versions. Add a
  lifecycle rule expiring non-current versions after 90 days to control
  storage costs:

    noncurrent_version_expiration {
      noncurrent_days = 90
    }
verification: |
  Run `aws s3api get-bucket-versioning --bucket <name>` and confirm
  `Status` is `Enabled`. Run `terraform plan` and verify no diff shows
  `status = "Suspended"` or `status = "Disabled"`.
fix_hcl: |
  resource "aws_s3_bucket_versioning" "example" {
    bucket = aws_s3_bucket.example.id
    versioning_configuration {
      status = "Enabled"
    }
  }
fix_disruption: none
fixtures:
  - attack_graph_demo
  - aws_s3_no_versioning
