id: STK-AZURE-LOGIC-APP-001
title: "Azure Logic App missing diagnostic settings"
section: stack
default_urgency: MEDIUM
blast_radius: single-resource
status: active
pci_dss:
  - "Req-10.2"
soc2_cc:
  - "CC7.2"
mitre:
  - "T1562.008"
cwe:
  - "CWE-778"
nist_csf:
  - "DE.CM-1"
nist_800_53:
  - "AU-2"
patterns:
  - kind: resource_absent
    resource: azurerm_monitor_diagnostic_setting
    when_present: azurerm_logic_app_workflow
    description: |
      `azurerm_logic_app_workflow` exists but no
      `azurerm_monitor_diagnostic_setting` is bound to it. Workflow
      runs, failed actions, and trigger fires are not shipped to
      Log Analytics.
recommendation: |
  Attach a diagnostic setting to the Logic App that ships
  WorkflowRuntime to Log Analytics:

      resource "azurerm_monitor_diagnostic_setting" "logic" {
        name                       = "logic-diag"
        target_resource_id         = azurerm_logic_app_workflow.main.id
        log_analytics_workspace_id = azurerm_log_analytics_workspace.main.id
        enabled_log { category = "WorkflowRuntime" }
      }
verification: |
  `az monitor diagnostic-settings list --resource <logic-app-id>` must
  return at least one configuration.
fix_hcl: |
  resource "azurerm_monitor_diagnostic_setting" "logic" {
    name                       = "logic-diag"
    target_resource_id         = azurerm_logic_app_workflow.example.id
    log_analytics_workspace_id = azurerm_log_analytics_workspace.example.id
    enabled_log {
      category = "WorkflowRuntime"
    }
  }
fix_disruption: none
fixtures:
  - azure_logic_app_no_diag
