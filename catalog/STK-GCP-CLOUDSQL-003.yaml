id: STK-GCP-CLOUDSQL-003
title: "Cloud SQL instance missing deletion protection"
section: stack
default_urgency: HIGH
blast_radius: single-resource
status: active
cis:
  - "6.6"
patterns:
  - kind: resource_missing_arg
    resource: google_sql_database_instance
    arg: deletion_protection
  - kind: hcl_attr
    resource: google_sql_database_instance
    path: deletion_protection
    not_equal: true
recommendation: |
  Set `deletion_protection = true` on every Cloud SQL instance. This is
  the only safety net against `terraform destroy` removing a database
  with all of its data.
verification: |
  `gcloud sql instances describe <name> --format='value(settings.deletionProtectionEnabled)'`
  must return `True`.
escalation:
  - condition: "is_production_environment"
    new_urgency: CRITICAL
fix_hcl: |
  resource "google_sql_database_instance" "example" {
    name             = "example"
    database_version = "POSTGRES_15"
    deletion_protection = true
    settings {
      tier = "db-f1-micro"
    }
  }
fix_disruption: none
fixtures:
  - cloudsql_no_deletion_protection
