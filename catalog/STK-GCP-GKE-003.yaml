id: STK-GCP-GKE-003
title: "GKE cluster has application-layer secrets encryption turned off"
section: stack
default_urgency: HIGH
blast_radius: environment
status: active
cis:
  - "8.5.5"
mitre:
  - "T1552.001"
cwe:
  - "CWE-522"
nist_csf:
  - "PR.AC-1"
patterns:
  - kind: resource_arg
    resource: google_container_cluster
    nested_path: database_encryption.state
    regex: '^DECRYPTED$'
    description: |
      `database_encryption` is present but `state = "DECRYPTED"`, so
      Secrets in etcd are not encrypted with the customer-managed key. A
      cluster with no `database_encryption` block at all is
      SEC-GCP-GKE-DBENC-001 (this rule used to repeat it).
recommendation: |
  Add a `database_encryption { state = "ENCRYPTED" key_name = <kms-key> }`
  block. Without this, etcd-stored Kubernetes Secrets are encrypted only
  at the Google-managed disk level — not at the application layer.

      database_encryption {
        state    = "ENCRYPTED"
        key_name = google_kms_crypto_key.k8s_secrets.id
      }
verification: |
  `gcloud container clusters describe <name> --format='value(databaseEncryption.state)'`
  must return `ENCRYPTED`.
fix_hcl: |
  resource "google_container_cluster" "example" {
    name     = "example"
    location = "us-central1"
    database_encryption {
      state    = "ENCRYPTED"
      key_name = google_kms_crypto_key.gke.id
    }
  }
fix_disruption: plan_required
fixtures:
  - gke_no_secrets_encryption
