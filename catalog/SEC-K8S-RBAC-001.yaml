id: SEC-K8S-RBAC-001
title: "ClusterRoleBinding grants cluster-admin OR uses wildcard verbs / system:authenticated"
section: security
default_urgency: CRITICAL
blast_radius: infrastructure-wide
status: active
cis:
  - "5.1.1"
  - "5.1.3"
pci_dss:
  - "Req-7.2.2"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1078.004"
  - "T1098.001"
cwe:
  - "CWE-269"
  - "CWE-732"
nist_csf:
  - "PR.AC-4"
nist_800_53:
  - "AC-6"
  - "AC-6(1)"
  - "AC-6(7)"
csa_ccm:
  - "IAM-09"
  - "IAM-15"
owasp:
  - "K03"
patterns:
  - kind: resource_body_contains
    resource: kubernetes_cluster_role_binding
    regex: 'name\s*=\s*"cluster-admin"'
    description: |
      `kubernetes_cluster_role_binding` references the built-in
      `cluster-admin` ClusterRole. Any subject bound to this binding
      (ServiceAccount, User, Group) has full unrestricted access to
      every API across every namespace — equivalent to root on every
      node. Compromise of any pod or token bound through this binding
      yields full cluster takeover.
  - kind: resource_body_contains
    resource: kubernetes_role
    regex: 'verbs\s*=\s*\[[^\]]*"\*"'
    description: |
      R30.5 extension — wildcard verbs (`verbs = ["*"]`). Same risk
      as cluster-admin at the namespace scope. NIST AC-6(7) +
      OWASP K03.
  - kind: resource_body_contains
    resource: kubernetes_cluster_role
    regex: 'verbs\s*=\s*\[[^\]]*"\*"'
    description: cluster-wide wildcard verbs
  - kind: resource_body_contains
    resource: kubernetes_role
    regex: 'verbs\s*=\s*\[[^\]]*"(?:bind|escalate|impersonate)"'
    description: |
      R30.5 extension — `bind` / `escalate` / `impersonate` verbs
      allow privilege escalation outside the role's normal scope.
  - kind: resource_body_contains
    resource: kubernetes_cluster_role_binding
    regex: 'name\s*=\s*"system:authenticated"'
    description: |
      R30.5 extension — binding to `system:authenticated` includes
      every pod with a service-account token, which is effectively
      every pod in the cluster. Same effect as binding to "everyone".
recommendation: |
  Replace the cluster-admin reference with a scoped ClusterRole or a
  namespaced RoleBinding. If absolute-power access is genuinely
  required (rare; usually only for cluster operators), keep the
  binding short-lived and attach it to a specific User identity, not
  a long-lived ServiceAccount.

      resource "kubernetes_role_binding" "app" {
        metadata {
          name      = "app"
          namespace = "app"
        }
        role_ref {
          api_group = "rbac.authorization.k8s.io"
          kind      = "ClusterRole"
          name      = "view"   # scoped, read-only
        }
        subject {
          kind      = "ServiceAccount"
          name      = "app"
          namespace = "app"
        }
      }
verification: |
  `kubectl get clusterrolebindings -o jsonpath='{.items[?(@.roleRef.name=="cluster-admin")].subjects[*].name}'`
  should not include any ServiceAccount in a workload namespace.
fix_hcl: |
  resource "kubernetes_role_binding" "scoped" {
    metadata {
      name      = "app-scoped"
      namespace = "app"
    }
    role_ref {
      api_group = "rbac.authorization.k8s.io"
      kind      = "ClusterRole"
      name      = "view"
    }
    subject {
      kind      = "ServiceAccount"
      name      = "app"
      namespace = "app"
    }
  }
fix_disruption: forces_replacement
fix_disruption_note: "Replacing the binding is destructive — pods using the previous role will lose access until rebound. Stage the new binding alongside, migrate workloads, then delete the old one."
fixtures:
  - k8s_cluster_admin_binding
