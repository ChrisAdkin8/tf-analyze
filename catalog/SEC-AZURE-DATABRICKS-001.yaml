id: SEC-AZURE-DATABRICKS-001
title: "Azure Databricks workspace publicly accessible (no_public_ip = false)"
section: security
default_urgency: HIGH
blast_radius: module
status: active
cis:
  - "3.5"
pci_dss:
  - "Req-1.3"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1190"
cwe:
  - "CWE-284"
d3fend:
  - "D3-NTA"
nist_csf:
  - "PR.AC-5"
nist_800_53:
  - "SC-7"
patterns:
  - kind: resource_body_contains
    resource: azurerm_databricks_workspace
    regex: 'no_public_ip\s*=\s*false'
    description: |
      `azurerm_databricks_workspace.custom_parameters.no_public_ip = false`
      assigns Databricks worker nodes public IPs. The workspace control
      plane is reachable from the public internet.
  - kind: resource_arg
    resource: azurerm_databricks_workspace
    arg: public_network_access_enabled
    regex: '^true$'
    description: Databricks workspace public_network_access_enabled = true
recommendation: |
  Provision the workspace with no_public_ip and disable public
  network access:

      resource "azurerm_databricks_workspace" "main" {
        # ...
        public_network_access_enabled = false
        custom_parameters {
          no_public_ip = true
          virtual_network_id = azurerm_virtual_network.main.id
          public_subnet_name = azurerm_subnet.public.name
          private_subnet_name = azurerm_subnet.private.name
        }
      }
verification: |
  `az databricks workspace show -g <rg> -n <name> --query 'publicNetworkAccess'`
  must return `Disabled`.
fix_hcl: |
  resource "azurerm_databricks_workspace" "example" {
    name                          = "example"
    resource_group_name           = azurerm_resource_group.example.name
    location                      = azurerm_resource_group.example.location
    sku                           = "premium"
    public_network_access_enabled = false
    custom_parameters {
      no_public_ip        = true
      virtual_network_id  = azurerm_virtual_network.example.id
      public_subnet_name  = azurerm_subnet.public.name
      private_subnet_name = azurerm_subnet.private.name
    }
  }
fix_disruption: forces_replacement
fixtures:
  - azure_databricks_public
