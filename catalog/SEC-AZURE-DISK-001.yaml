id: SEC-AZURE-DISK-001
title: "Azure managed disk not encrypted with customer-managed key"
section: security
default_urgency: MEDIUM
blast_radius: single-resource
status: active
cis:
  - "8.1"
pci_dss:
  - "Req-3.4"
soc2_cc:
  - "CC6.7"
mitre:
  - "T1530"
cwe:
  - "CWE-311"
d3fend:
  - "D3-EAR"
nist_csf:
  - "PR.DS-1"
nist_800_53:
  - "SC-13"
  - "SC-28"
csa_ccm:
  - "CEK-03"
patterns:
  - kind: resource_missing_arg
    resource: azurerm_managed_disk
    arg: disk_encryption_set_id
    description: |
      `azurerm_managed_disk` has no `disk_encryption_set_id`. Without a CMK,
      the disk is encrypted with a platform-managed key that cannot be
      revoked, audited independently, or rotated on a custom schedule.
recommendation: |
  Attach a customer-managed key via a disk encryption set:

      resource "azurerm_disk_encryption_set" "main" {
        name                = "des-main"
        location            = azurerm_resource_group.main.location
        resource_group_name = azurerm_resource_group.main.name
        key_vault_key_id    = azurerm_key_vault_key.des.id
        identity { type = "SystemAssigned" }
      }

      resource "azurerm_managed_disk" "main" {
        # ...
        disk_encryption_set_id = azurerm_disk_encryption_set.main.id
      }
verification: |
  `az disk show --name <name> --resource-group <rg> --query encryption.type`
  must return `"EncryptionAtRestWithCustomerKey"`.
fix_hcl: |
  resource "azurerm_managed_disk" "example" {
    name                   = "example"
    location               = azurerm_resource_group.example.location
    resource_group_name    = azurerm_resource_group.example.name
    storage_account_type   = "Standard_LRS"
    create_option          = "Empty"
    disk_size_gb           = 32
    disk_encryption_set_id = azurerm_disk_encryption_set.example.id
  }
fix_disruption: plan_required
fix_disruption_note: "Attaching a disk encryption set re-encrypts existing data in place; no downtime, but requires the disk to be detached or the VM stopped on some SKUs."
fixtures:
  - azure_disk_no_cmk
