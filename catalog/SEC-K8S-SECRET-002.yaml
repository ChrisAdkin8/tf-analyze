id: SEC-K8S-SECRET-002
title: "kubernetes_secret of type `kubernetes.io/dockerconfigjson` carries literal data (image-pull credentials in state)"
section: security
default_urgency: CRITICAL
blast_radius: infrastructure-wide
status: active
cis:
  - "5.4.1"
pci_dss:
  - "Req-3.5.1"
  - "Req-8.3.1"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1552.001"
  - "T1525"
  - "T1195.002"
cwe:
  - "CWE-798"
  - "CWE-312"
nist_csf:
  - "PR.DS-1"
  - "ID.SC-3"
nist_800_53:
  - "IA-5"
  - "SR-3"
csa_ccm:
  - "EKM-04"
  - "TVM-09"
owasp:
  - "K08"
owasp_iac:
  - "Develop and Distribute / Secrets Detection"
# Complements SEC-K8S-SECRET-001 (which fires on ANY literal data
# in a kubernetes_secret). This rule's narrower target — image-pull
# credentials specifically — is a CRITICAL finding because the blast
# radius is supply-chain: an attacker who reads Terraform state gets
# the keys to pull every image from the private registry, which
# usually contains the full container fleet's binaries (and often
# build-time secrets baked into the image layers).
patterns:
  - kind: resource_body_contains
    resource: kubernetes_secret
    regex: '(?ms)type\s*=\s*"kubernetes\.io/dockerconfigjson".*?\.dockerconfigjson"?\s*='
    description: |
      `kubernetes_secret` declares `type = "kubernetes.io/dockerconfigjson"`
      and carries a literal `.dockerconfigjson` payload in `data`. The
      payload is the base64-encoded contents of `~/.docker/config.json` —
      i.e. registry username + password (or OAuth token) for every
      registry the workload pulls from. The 2024 Sisense breach and
      the 2023 CircleCI compromise both exfiltrated registry credentials
      from artefacts that operators thought were "encoded".
  - kind: resource_body_contains
    resource: kubernetes_secret_v1
    regex: '(?ms)type\s*=\s*"kubernetes\.io/dockerconfigjson".*?\.dockerconfigjson"?\s*='
    description: API-versioned alias — same anti-pattern.
recommendation: |
  Replace the literal `.dockerconfigjson` with a cloud-native
  workload-identity flow that gives pods short-lived credentials
  to the registry, with no Kubernetes Secret in the path:

  - **GKE:** Workload Identity + Artifact Registry Reader IAM. Pods
    pull via the node's identity; no docker-config secret exists.
  - **EKS:** IRSA + ECR Read IAM. Same shape.
  - **AKS:** Workload Identity + AcrPull role.

  Where workload identity is genuinely unavailable (e.g. air-gapped
  installs), use an External Secrets Operator ExternalSecret pulling
  from Vault / Cloud Secret Manager so the literal credential never
  lives in source or state:

      resource "kubernetes_manifest" "pull_creds" {
        manifest = {
          apiVersion = "external-secrets.io/v1beta1"
          kind       = "ExternalSecret"
          metadata = { name = "pull-creds", namespace = "app" }
          spec = {
            secretStoreRef = { name = "vault", kind = "ClusterSecretStore" }
            target         = { name = "pull-creds", template = { type = "kubernetes.io/dockerconfigjson" } }
            data = [{
              secretKey = ".dockerconfigjson"
              remoteRef = { key = "kv/data/registry", property = "dockerconfigjson" }
            }]
          }
        }
      }
verification: |
  `terraform state list | grep '^kubernetes_secret\.' | xargs -I {} terraform state show {} | awk '/type *= "kubernetes.io\\/dockerconfigjson"/{found=1} found && /\\.dockerconfigjson *=/{print FILENAME; found=0}'`
  should return empty. Better: run `terraform state pull | grep -c dockerconfigjson` and expect 0.
fix_hcl: |
  resource "kubernetes_manifest" "image_pull_secret" {
    manifest = {
      apiVersion = "external-secrets.io/v1beta1"
      kind       = "ExternalSecret"
      metadata = {
        name      = "pull-creds"
        namespace = "app"
      }
      spec = {
        secretStoreRef = {
          name = "vault"
          kind = "ClusterSecretStore"
        }
        target = {
          name           = "pull-creds"
          creationPolicy = "Owner"
          template = {
            type = "kubernetes.io/dockerconfigjson"
          }
        }
        data = [{
          secretKey = ".dockerconfigjson"
          remoteRef = {
            key      = "kv/data/registry"
            property = "dockerconfigjson"
          }
        }]
      }
    }
  }
fix_disruption: forces_replacement
fix_disruption_note: "Replacing the in-state dockerconfigjson with an ExternalSecret means pods will momentarily fail to pull until ESO reconciles. Rotate the registry credential *after* the migration — the in-state copy must be assumed leaked."
fixtures:
  - k8s_secret_dockerconfig
