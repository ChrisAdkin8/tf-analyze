id: SEC-AWS-IAM-001
title: "IAM policy with wildcard resource"
section: security
default_urgency: HIGH
blast_radius: infrastructure-wide
cis:
  - "1.16"
status: active
patterns:
  - kind: grep
    file_glob: "**/*.tf"
    regex: '"Resource"\s*:\s*"\*"'
    description: IAM policy document with Resource = "*"
  - kind: grep
    file_glob: "**/*.tf"
    regex: 'resources\s*=\s*\["\*"\]'
    description: aws_iam_policy_document statement with resources = ["*"]
owasp_iac:
  - "Develop and Distribute / Resource Permission Minimization"
recommendation: |
  Narrow the `Resource` field to the specific ARN(s) the policy needs.
  Wildcard resources grant the actions to every resource in the account,
  violating least-privilege. Use `arn:aws:s3:::my-bucket/*` instead of
  `*` for S3 access, `arn:aws:dynamodb:*:*:table/my-table` for DynamoDB,
  etc.
verification: |
  Run `terraform plan` and verify the policy document in the plan output
  has no `"Resource": "*"` statements.
fixtures:
  - attack_graph_demo
  - aws_iam_wildcard
test_template: |
  run "iam_no_wildcard_resource_{rule_id}" {
    command = plan
    assert {
      condition     = !can(regex("\\*", data.aws_iam_policy_document.{resource}.json))
      error_message = "{resource} IAM policy must not use wildcard Resource (SEC-AWS-IAM-001)."
    }
  }
pci_dss:
  - "Req-7.1"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1078.004"
cwe:
  - "CWE-269"
  - "CWE-732"
d3fend:
  - "D3-PA"
  - "D3-MFA"
nist_csf:
  - "PR.AC-1"
  - "PR.AC-4"
nist_800_53:
  - "AC-3"
  - "AC-6"
csa_ccm:
  - "IAM-09"
fix_hcl: |
  statement {
    actions   = ["s3:GetObject", "s3:PutObject"]
    resources = ["arn:aws:s3:::my-bucket/*"]
  }
fix_disruption: plan_required
fix_disruption_note: "Narrowing the resource ARN is an in-place policy update; no replacement is required but IAM propagation may take up to 60 seconds."
