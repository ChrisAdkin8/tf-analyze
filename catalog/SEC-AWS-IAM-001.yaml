id: SEC-AWS-IAM-001
title: "Inline IAM policy JSON grants wildcard `Resource: \"*\"`"
section: security
default_urgency: HIGH
blast_radius: infrastructure-wide
cis:
  - "1.16"
status: active
patterns:
  - kind: iam_json_policy_analysis
    check: wildcard_resource
    description: |
      An Allow statement in a `policy` (`jsonencode`, heredoc or JSON
      string) on aws_iam_policy / aws_iam_role_policy / aws_iam_user_policy
      / aws_iam_group_policy or an aws_iam_role `inline_policy` has
      `Resource: "*"`. Deny statements and read-only Describe* / List*
      actions (often not resource-scopable) do not count. The
      `aws_iam_policy_document` form is SEC-AWS-IAM-POLICY-003.
owasp_iac:
  - "Develop and Distribute / Resource Permission Minimization"
recommendation: |
  Narrow the `Resource` field to the specific ARN(s) the policy needs.
  Wildcard resources grant the actions to every resource in the account,
  violating least-privilege. Use `arn:aws:s3:::my-bucket/*` instead of
  `*` for S3 access, `arn:aws:dynamodb:*:*:table/my-table` for DynamoDB,
  etc.
verification: |
  Run `terraform plan` and verify the policy document in the plan output
  has no `"Resource": "*"` statements.
fixtures:
  - aws_iam_wildcard
test_template: |
  run "iam_no_wildcard_resource_{rule_id}" {
    command = plan
    assert {
      condition     = !strcontains({resource}.policy, "\"Resource\":\"*\"")
      error_message = "{resource} IAM policy must not use wildcard Resource (SEC-AWS-IAM-001)."
    }
  }
pci_dss:
  - "Req-7.1"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1078.004"
cwe:
  - "CWE-269"
  - "CWE-732"
d3fend:
  - "D3-PA"
  - "D3-MFA"
nist_csf:
  - "PR.AC-1"
  - "PR.AC-4"
nist_800_53:
  - "AC-3"
  - "AC-6"
csa_ccm:
  - "IAM-09"
fix_hcl: |
  resource "aws_iam_policy" "app" {
    name = "app"
    policy = jsonencode({
      Version = "2012-10-17"
      Statement = [{
        Effect   = "Allow"
        Action   = ["s3:GetObject", "s3:PutObject"]
        Resource = "arn:aws:s3:::my-bucket/*"
      }]
    })
  }
fix_disruption: plan_required
fix_disruption_note: "Narrowing the resource ARN is an in-place policy update; no replacement is required but IAM propagation may take up to 60 seconds."
