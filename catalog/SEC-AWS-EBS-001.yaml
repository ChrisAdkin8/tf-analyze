id: SEC-AWS-EBS-001
title: "EBS volume not encrypted"
section: security
default_urgency: HIGH
blast_radius: single-resource
cis:
  - "2.2.1"
status: active
patterns:
  - kind: resource_arg
    resource: aws_ebs_volume
    arg: encrypted
    regex: "^false$"
    # Default encryption encrypts every new volume, whatever `encrypted` says.
    unless_repo_has: aws_ebs_encryption_by_default
    description: EBS volume with encrypted = false
  - kind: resource_missing_arg
    resource: aws_ebs_volume
    arg: encrypted
    unless_repo_has: aws_ebs_encryption_by_default
    description: EBS volume missing encrypted argument (defaults to false)
recommendation: |
  Set `encrypted = true` and supply a `kms_key_id` for every `aws_ebs_volume`.
  Unencrypted EBS volumes expose data if a snapshot is accidentally shared
  or if physical media is decommissioned. The account-level
  `aws_ebs_encryption_by_default` encrypts every new volume in the region;
  when it is in the scanned code this rule does not fire, but set
  `encrypted = true` anyway so the intent is visible in the module itself.
pci_dss:
  - "Req-3.4"
soc2_cc:
  - "CC6.7"
mitre:
  - "T1530"
cwe:
  - "CWE-311"
d3fend:
  - "D3-EAR"
nist_csf:
  - "PR.DS-1"
nist_800_53:
  - "SC-13"
  - "SC-28"
csa_ccm:
  - "CEK-03"
verification: |
  Run `aws ec2 describe-volumes --volume-ids <id>` and confirm
  `Encrypted` is `true`. Run `terraform plan` and verify no diff shows
  `encrypted = false` or a missing encrypted argument.
fix_hcl: |
  resource "aws_ebs_volume" "example" {
    availability_zone = "us-east-1a"
    size              = 20
    encrypted         = true
    kms_key_id        = aws_kms_key.ebs.arn
  }
fix_disruption: forces_replacement
fix_disruption_note: "EBS encryption cannot be enabled on an existing volume — requires snapshot + restore to a new encrypted volume."
fixtures:
  - aws_ebs_unencrypted
