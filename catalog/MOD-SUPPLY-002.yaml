id: MOD-SUPPLY-002
title: "Module uses raw git source instead of registry"
section: module
default_urgency: LOW
blast_radius: module
status: active
patterns:
  - kind: grep
    file_glob: "**/*.tf"
    regex: 'source\s*=\s*"git::'
    description: Module sourced from raw git URL rather than Terraform Registry
owasp_iac:
  - "Develop and Distribute / Open Source Dependency Scanning"
recommendation: |
  Prefer Terraform Registry sources (`namespace/module/provider`) over raw
  git URLs. Registry modules are integrity-hashed in `.terraform.lock.hcl`;
  raw git sources bypass the digest check.
verification: |
  Replace `git::` sources with registry equivalents where available.
soc2_cc:
  - "CC9.2"
mitre:
  - "T1195.002"
cwe:
  - "CWE-1357"
d3fend:
  - "D3-SCA"
nist_csf:
  - "ID.SC-2"
nist_800_53:
  - "SR-3"
csa_ccm:
  - "STA-04"
slsa:
  - "L2"
  - "deps"
fix_hcl: |
  # Before: module sourced from raw git
  # source = "git::https://github.com/example/terraform-aws-vpc.git"

  # After: registry source with version pin
  module "vpc" {
    source  = "terraform-aws-modules/vpc/aws"
    version = "~> 5.0"
  }
fix_disruption: none
fixtures:
  - mod_supply_git_source
