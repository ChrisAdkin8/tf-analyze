id: SEC-GCP-IAM-002
title: "Public IAM binding (allUsers / allAuthenticatedUsers)"
section: security
default_urgency: CRITICAL
blast_radius: infrastructure-wide
status: active
cis:
  - "5.1"
  - "7.1"
patterns:
  - kind: resource_arg
    resource: google_storage_bucket_iam_member
    arg: member
    regex: "^(allUsers|allAuthenticatedUsers)$"
  - kind: resource_arg
    resource: google_project_iam_member
    arg: member
    regex: "^(allUsers|allAuthenticatedUsers)$"
  - kind: resource_arg
    resource: google_bigquery_dataset_iam_member
    arg: member
    regex: "^(allUsers|allAuthenticatedUsers)$"
owasp_iac:
  - "Develop and Distribute / Resource Permission Minimization"
recommendation: |
  Public IAM grants must be removed unless the resource is intentionally
  a public website or public dataset. If public access is intentional,
  document it in CLAUDE.md and add a `# tf-analyze:ignore SEC-IAM-002`
  comment on the binding line.
verification: |
  After applying the fix, attempt to access the resource without
  credentials and confirm the request is denied. Re-run tf-analyze in
  mode:verify-fixed.
pci_dss:
  - "Req-6.4"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1078.004"
cwe:
  - "CWE-284"
  - "CWE-732"
d3fend:
  - "D3-PA"
nist_csf:
  - "PR.AC-4"
nist_800_53:
  - "AC-3"
  - "AC-6"
csa_ccm:
  - "IAM-09"
fix_hcl: |
  resource "google_storage_bucket_iam_member" "example" {
    bucket = google_storage_bucket.example.name
    role   = "roles/storage.objectViewer"
    member = "serviceAccount:${google_service_account.example.email}"
  }
fix_disruption: none
fixtures:
  - public_bucket
