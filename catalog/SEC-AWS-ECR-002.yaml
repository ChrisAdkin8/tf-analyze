id: SEC-AWS-ECR-002
title: "ECR repository missing image lifecycle policy"
section: security
default_urgency: MEDIUM
blast_radius: single-resource
status: active
patterns:
  - kind: resource_absent
    resource: aws_ecr_lifecycle_policy
    when_present: aws_ecr_repository
    scope: repo
recommendation: |
  Add an `aws_ecr_lifecycle_policy` resource to expire old images:

      resource "aws_ecr_lifecycle_policy" "main" {
        repository = aws_ecr_repository.main.name

        policy = jsonencode({
          rules = [{
            rulePriority = 1
            description  = "Expire untagged images older than 30 days"
            selection = {
              tagStatus   = "untagged"
              countType   = "sinceImagePushed"
              countUnit   = "days"
              countNumber = 30
            }
            action = { type = "expire" }
          }]
        })
      }

  Without a lifecycle policy, ECR accumulates every pushed image indefinitely.
  This increases storage cost and keeps stale (potentially vulnerable) images
  in scope for scanners and attackers who reach the registry.
verification: |
  `aws ecr describe-lifecycle-policy --repository-name <name>` must return
  a non-empty policy. Re-run tf-analyze in mode:verify-fixed.
fixtures:
  - aws_ecr_no_lifecycle
