id: SEC-AWS-IAM-POLICY-006
title: "IAM Allow statement uses NotAction / NotResource"
section: security
default_urgency: MEDIUM
blast_radius: infrastructure-wide
status: active
cis:
  - "1.16"
pci_dss:
  - "Req-7.2.2"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1078.004"
patterns:
  - kind: iam_policy_analysis
    check: not_action_or_not_resource
    description: |
      Statement uses `not_actions` or `not_resources` to express
      "everything except X". Negative-form grants are notoriously
      error-prone: any new AWS API or resource type added in future
      is implicitly allowed. AWS itself recommends against negative
      form for Allow statements.
  - kind: iam_json_policy_analysis
    check: not_action_or_not_resource
    description: |
      The same negative-form grant written as JSON: an Allow statement
      with `NotAction` or `NotResource` in a `policy` (jsonencode,
      heredoc or JSON string) on `aws_iam_policy`, `aws_iam_role_policy`,
      `aws_iam_user_policy`, `aws_iam_group_policy`, or an
      `aws_iam_role` `inline_policy` block. `Action: "*"` with
      `NotResource` is admin-equivalent and is reported once, as
      SEC-AWS-IAM-JSON-003 / SEC-AWS-IAM-POLICY-005, not by this rule.
owasp_iac:
  - "Develop and Distribute / Resource Permission Minimization"
cwe:
  - "CWE-269"
nist_csf:
  - "PR.AC-4"
nist_800_53:
  - "AC-6"
csa_ccm:
  - "IAM-09"
recommendation: |
  Rewrite the statement using `actions` and `resources` to enumerate
  the explicit allow set. Reserve `not_actions` / `not_resources` for
  Deny statements (a defensive deny is safe to phrase negatively).
verification: |
  Policy statements with `Effect: Allow` should not contain `NotAction`
  or `NotResource`.
fix_hcl: |
  data "aws_iam_policy_document" "example" {
    statement {
      effect    = "Allow"
      actions   = ["s3:GetObject", "s3:PutObject"]
      resources = ["arn:aws:s3:::my-bucket/*"]
    }
  }
fix_disruption: plan_required
fixtures:
  - aws_iam_policy_not_action
  - aws_iam_json_not_action
