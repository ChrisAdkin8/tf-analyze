id: SEC-GCP-STORAGE-IAM-001
title: "GCS bucket bound to allUsers or allAuthenticatedUsers"
section: security
default_urgency: CRITICAL
blast_radius: single-resource
status: active
cis:
  - "5.1"
pci_dss:
  - "Req-7.1"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1530"
cwe:
  - "CWE-284"
d3fend:
  - "D3-UAC"
nist_csf:
  - "PR.AC-3"
nist_800_53:
  - "AC-3"
csa_ccm:
  - "IAM-09"
patterns:
  - kind: resource_body_contains
    resource: google_storage_bucket_iam_member
    regex: 'member\s*=\s*"all(Users|AuthenticatedUsers)"'
    description: |
      `google_storage_bucket_iam_member` binds the bucket to `allUsers`
      or `allAuthenticatedUsers`. Bucket contents become world-readable
      (or writable, depending on the role). The equivalent of
      `SEC-AWS-S3-PUBLIC-BLOCK-001`.
  - kind: resource_body_contains
    resource: google_storage_bucket_iam_binding
    regex: 'members\s*=\s*\[[^\]]*"all(Users|AuthenticatedUsers)"'
    description: GCS bucket IAM binding includes allUsers / allAuthenticatedUsers
recommendation: |
  Replace the public principal with an authenticated identity:

      resource "google_storage_bucket_iam_member" "viewer" {
        bucket = google_storage_bucket.main.name
        role   = "roles/storage.objectViewer"
        member = "group:viewers@example.com"
      }

  If genuinely public data is required, prefer `public_access_prevention = "inherited"`
  combined with documented Cloud CDN distribution.
verification: |
  `gsutil iam get gs://<bucket>` must not list `allUsers` or
  `allAuthenticatedUsers` for any role.
fix_hcl: |
  resource "google_storage_bucket_iam_member" "example" {
    bucket = google_storage_bucket.example.name
    role   = "roles/storage.objectViewer"
    member = "group:viewers@example.com"
  }
fix_disruption: plan_required
fixtures:
  - gcp_storage_public_iam
