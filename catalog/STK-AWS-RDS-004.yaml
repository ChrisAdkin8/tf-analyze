id: STK-AWS-RDS-004
title: "RDS instance uses end-of-life database engine version"
section: stack
default_urgency: HIGH
blast_radius: single-resource
status: active
patterns:
  - kind: resource_arg
    resource: aws_db_instance
    arg: engine_version
    regex: '^(?:9\.|1[0-3](?:\.|$))'
    # PostgreSQL 9.x-13: RDS standard support ended (13 on 2026-02-28). Skipped when `engine` is a different known engine; an
    # unresolved engine still fires (fail closed).
    suppress_if:
      arg: engine
      regex: '^(?:mysql|mariadb|oracle.*|sqlserver.*|aurora.*|db2.*)$'
  - kind: resource_arg
    resource: aws_db_instance
    arg: engine_version
    regex: '^(?:5\.|8\.0(?:\.|$))'
    # MySQL 5.x and 8.0: RDS standard support ended (8.0 on 2026-07-31). Skipped when `engine` is a different known engine; an
    # unresolved engine still fires (fail closed).
    suppress_if:
      arg: engine
      regex: '^(?:postgres|mariadb|oracle.*|sqlserver.*|aurora.*|db2.*)$'
  - kind: resource_arg
    resource: aws_db_instance
    arg: engine_version
    regex: '^10\.[0-5](?:\.|$)'
    # MariaDB 10.0-10.5: RDS standard support ended (10.5 on 2026-08-31). Skipped when `engine` is a different known engine; an
    # unresolved engine still fires (fail closed).
    suppress_if:
      arg: engine
      regex: '^(?:postgres|mysql|oracle.*|sqlserver.*|aurora.*|db2.*)$'
recommendation: |
  Upgrade to a supported engine version. AWS maintains a support calendar
  at https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MySQL.Concepts.VersionMgmt.html

  Common upgrades:
  - MySQL 5.6 → MySQL 8.0 (major version upgrade, test thoroughly)
  - PostgreSQL 9.6 → PostgreSQL 16 (multiple hops: 9.6→11→14→16)
  - PostgreSQL 10/11/12 → PostgreSQL 16

  Use `aws rds describe-db-engine-versions` to enumerate supported
  versions for your region and instance class.
verification: |
  `aws rds describe-db-instances --db-instance-identifier <id> \
    --query 'DBInstances[0].EngineVersion'`
  must return a currently supported version string.
fix_hcl: |
  resource "aws_db_instance" "example" {
    engine         = "postgres"
    engine_version = "16.2"
    instance_class = "db.t3.medium"
    username       = "admin"
    password       = var.db_password
  }
fix_disruption: plan_required
fixtures:
  - aws_rds_eol_version
