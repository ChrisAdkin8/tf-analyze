id: SEC-GCP-COMPUTE-CONFCOMP-001
title: "GCP Compute instance not using Confidential Computing (TDX/SEV)"
section: security
default_urgency: LOW
blast_radius: single-resource
status: active
pci_dss:
  - "Req-3.4"
soc2_cc:
  - "CC6.7"
mitre:
  - "T1542"
cwe:
  - "CWE-311"
d3fend:
  - "D3-EAR"
nist_csf:
  - "PR.DS-1"
  - "PR.DS-5"
nist_800_53:
  - "SC-12"
  - "SC-28"
csa_ccm:
  - "CEK-08"
patterns:
  - kind: resource_missing_arg
    resource: google_compute_instance
    arg: confidential_instance_config
    description: |
      `google_compute_instance` has no `confidential_instance_config`.
      Memory in use is not encrypted at the hardware level (AMD SEV,
      Intel TDX). Confidential Computing is required for some PCI-DSS
      and FedRAMP-High workloads where in-use data confidentiality
      against host-level adversaries matters.
recommendation: |
  Enable confidential computing on workloads handling sensitive data
  in memory (PII, secrets, model weights):

      resource "google_compute_instance" "main" {
        # ...
        machine_type = "n2d-standard-2"   # SEV-capable family
        confidential_instance_config {
          enable_confidential_compute = true
        }
        scheduling { on_host_maintenance = "TERMINATE" }
      }
verification: |
  `gcloud compute instances describe <name> --zone <zone> \
    --format='value(confidentialInstanceConfig.enableConfidentialCompute)'`
  must return `True`.
fix_hcl: |
  resource "google_compute_instance" "example" {
    name         = "example"
    machine_type = "n2d-standard-2"
    zone         = "us-central1-a"
    boot_disk { initialize_params { image = "debian-cloud/debian-12" } }
    network_interface { network = "default" }
    confidential_instance_config {
      enable_confidential_compute = true
    }
    scheduling { on_host_maintenance = "TERMINATE" }
  }
fix_disruption: forces_replacement
fixtures:
  - gcp_compute_no_confcompute
