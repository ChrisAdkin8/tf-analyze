id: ROB-AZURE-SQL-002
title: "Azure SQL database missing long-term retention policy"
section: robustness
default_urgency: MEDIUM
blast_radius: single-resource
status: active
cis:
  - "4.4"
pci_dss:
  - "Req-3.1"
soc2_cc:
  - "A1.2"
mitre:
  - "T1485"
  - "T1490"
cwe:
  - "CWE-779"
d3fend:
  - "D3-DENCR"
nist_csf:
  - "PR.IP-4"
nist_800_53:
  - "CP-9"
  - "CP-10"
csa_ccm:
  - "BCR-08"
patterns:
  - kind: resource_missing_arg
    resource: azurerm_mssql_database
    arg: long_term_retention_policy
    description: |
      `azurerm_mssql_database` has no `long_term_retention_policy` block.
      Short-term retention (PITR) covers 1–35 days; LTR is required for
      regulatory retention (SOC2 1-year, HIPAA 6-year, PCI-DSS 1-year)
      and for protection against an attacker who waits out the PITR
      window before triggering destructive action.
recommendation: |
  Configure LTR with weekly/monthly/yearly retention matching your
  compliance policy:

      resource "azurerm_mssql_database" "main" {
        # ...
        long_term_retention_policy {
          weekly_retention  = "P4W"
          monthly_retention = "P12M"
          yearly_retention  = "P7Y"
          week_of_year      = 1
        }
      }
verification: |
  `az sql db ltr-policy show --name <db> --server <srv> --resource-group <rg>`
  must return non-zero `weeklyRetention`/`monthlyRetention`/`yearlyRetention`.
fix_hcl: |
  resource "azurerm_mssql_database" "example" {
    name      = "example"
    server_id = azurerm_mssql_server.example.id

    long_term_retention_policy {
      weekly_retention  = "P4W"
      monthly_retention = "P12M"
      yearly_retention  = "P7Y"
      week_of_year      = 1
    }
  }
fix_disruption: none
fixtures:
  - azure_sql_no_ltr
