id: SEC-AZURE-STORAGE-001
title: "Azure storage account allows non-HTTPS traffic"
section: security
default_urgency: HIGH
blast_radius: single-resource
cis:
  - "3.1"
mitre:
  - "T1071.001"
cwe:
  - "CWE-319"
d3fend:
  - "D3-EI"
nist_csf:
  - "PR.DS-2"
nist_800_53:
  - "SC-8"
  - "SC-8(1)"
csa_ccm:
  - "CEK-06"
status: active
patterns:
  - kind: resource_arg
    resource: azurerm_storage_account
    arg: enable_https_traffic_only
    regex: '^false$'
  - kind: resource_arg
    resource: azurerm_storage_account
    arg: https_only
    regex: '^false$'
  - kind: resource_arg
    resource: azurerm_storage_account
    arg: min_tls_version
    regex: '^(TLS1_0|TLS1_1)$'
recommendation: |
  Set `https_only = true` (provider v3+) or `enable_https_traffic_only = true`
  (provider v2). Also set `min_tls_version = "TLS1_2"`. Allowing HTTP exposes
  storage account keys and SAS tokens in transit.

      resource "azurerm_storage_account" "example" {
        # ...
        https_only       = true
        min_tls_version  = "TLS1_2"
      }
verification: |
  After applying, confirm with:

      az storage account show --name <name> --query 'enableHttpsTrafficOnly'

  The command should return `true`.
fix_hcl: |
  resource "azurerm_storage_account" "example" {
    # ... other arguments ...
    https_traffic_only_enabled = true
    min_tls_version            = "TLS1_2"
  }
fix_disruption: plan_required
fixtures:
  - azure_storage_http
