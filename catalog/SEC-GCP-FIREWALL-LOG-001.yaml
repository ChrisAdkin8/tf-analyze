id: SEC-GCP-FIREWALL-LOG-001
title: "GCP firewall rule missing log_config (denied traffic invisible)"
section: security
default_urgency: MEDIUM
blast_radius: single-resource
status: active
cis:
  - "3.7"
pci_dss:
  - "Req-10.2"
soc2_cc:
  - "CC7.2"
mitre:
  - "T1562.008"
cwe:
  - "CWE-778"
d3fend:
  - "D3-IAA"
nist_csf:
  - "DE.CM-1"
nist_800_53:
  - "AU-2"
csa_ccm:
  - "LOG-08"
patterns:
  - kind: resource_missing_arg
    resource: google_compute_firewall
    arg: log_config
    description: |
      `google_compute_firewall` has no `log_config` block. Denied and
      allowed traffic on this rule is not logged to Cloud Logging,
      blinding incident response and DDoS forensics.
recommendation: |
  Enable firewall logging on rules guarding sensitive services:

      resource "google_compute_firewall" "main" {
        # ...
        log_config {
          metadata = "INCLUDE_ALL_METADATA"
        }
      }

  For very high-throughput rules consider `EXCLUDE_ALL_METADATA` to keep
  log volume manageable.
verification: |
  `gcloud compute firewall-rules describe <name> --format='value(logConfig.enable)'`
  must return `True`.
fix_hcl: |
  resource "google_compute_firewall" "example" {
    name    = "allow-ssh"
    network = google_compute_network.main.name
    allow {
      protocol = "tcp"
      ports    = ["22"]
    }
    source_ranges = ["10.0.0.0/8"]
    log_config {
      metadata = "INCLUDE_ALL_METADATA"
    }
  }
fix_disruption: none
fixtures:
  - gcp_firewall_no_log
