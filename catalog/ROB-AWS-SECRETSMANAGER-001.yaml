id: ROB-AWS-SECRETSMANAGER-001
title: "Secrets Manager secret has no automatic rotation configured"
section: robustness
default_urgency: MEDIUM
blast_radius: single-resource
status: active
pci_dss:
  - "Req-8.6"
soc2_cc:
  - "CC6.1"
patterns:
  - kind: resource_absent
    resource: aws_secretsmanager_secret_rotation
    when_present: aws_secretsmanager_secret
    description: |
      An `aws_secretsmanager_secret` exists but no `aws_secretsmanager_secret_rotation`
      resource is defined. Without automatic rotation, long-lived credentials accumulate
      blast radius over time. A leaked credential that is never rotated provides
      indefinite access.
recommendation: |
  Define a rotation configuration for every secret that supports it:

      resource "aws_secretsmanager_secret_rotation" "db" {
        secret_id           = aws_secretsmanager_secret.db.id
        rotation_lambda_arn = aws_lambda_function.rotate_secret.arn

        rotation_rules {
          automatically_after_days = 30
        }
      }

  Use AWS-provided rotation Lambdas for RDS, Redshift, and DocumentDB secrets.
  For custom secrets, implement the standard rotation Lambda contract.
verification: |
  `aws secretsmanager describe-secret --secret-id <name> \
    --query 'RotationEnabled'`
  must return `true`.
fix_hcl: |
  resource "aws_secretsmanager_secret_rotation" "example" {
    secret_id           = aws_secretsmanager_secret.example.id
    rotation_lambda_arn = aws_lambda_function.rotate_secret.arn
    rotation_rules {
      automatically_after_days = 30
    }
  }
fix_disruption: none
fixtures:
  - aws_secretsmanager_no_rotation
