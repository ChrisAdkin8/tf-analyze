id: SEC-AZURE-FRONTDOOR-002
title: "Azure Front Door custom domain accepts TLS < 1.2"
section: security
default_urgency: HIGH
blast_radius: single-resource
status: active
cis:
  - "5.1"
pci_dss:
  - "Req-4.1"
soc2_cc:
  - "CC6.7"
mitre:
  - "T1040"
  - "T1557"
cwe:
  - "CWE-326"
d3fend:
  - "D3-ET"
nist_csf:
  - "PR.DS-2"
nist_800_53:
  - "SC-8"
patterns:
  - kind: resource_body_contains
    resource: azurerm_cdn_frontdoor_custom_domain
    regex: 'minimum_tls_version\s*=\s*"TLS10"'
    description: |
      `azurerm_cdn_frontdoor_custom_domain.tls.minimum_tls_version = "TLS10"`.
      TLS 1.0 is deprecated by the IETF and forbidden by PCI-DSS v4.0.
  - kind: resource_body_contains
    resource: azurerm_frontdoor
    regex: 'minimum_tls_version\s*=\s*"1\.0"'
    description: Classic Front Door frontend_endpoint uses TLS 1.0
recommendation: |
  Pin TLS 1.2 (Front Door does not yet support TLS 1.3 for custom
  domains — `TLS12` is the strongest available):

      resource "azurerm_cdn_frontdoor_custom_domain" "main" {
        # ...
        tls {
          minimum_tls_version = "TLS12"
        }
      }
verification: |
  `az afd custom-domain show -g <rg> --profile-name <p> --custom-domain-name <d> \
    --query 'tlsSettings.minimumTlsVersion'` must return `TLS12`.
fix_hcl: |
  resource "azurerm_cdn_frontdoor_custom_domain" "example" {
    name                     = "example"
    cdn_frontdoor_profile_id = azurerm_cdn_frontdoor_profile.example.id
    host_name                = "example.com"
    tls {
      minimum_tls_version = "TLS12"
    }
  }
fix_disruption: plan_required
fixtures:
  - azure_frontdoor_weak_tls
