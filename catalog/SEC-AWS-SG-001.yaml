id: SEC-AWS-SG-001
title: "Security group allows ingress from 0.0.0.0/0"
section: security
default_urgency: HIGH
blast_radius: environment
cis:
  - "5.2"
  - "5.3"
status: active
escalation:
  - condition: "port 22 or 3389"
    urgency: CRITICAL
patterns:
  - kind: grep
    file_glob: "**/*.tf"
    regex: 'cidr_blocks\s*=\s*\["0\.0\.0\.0/0"\]'
    description: security group ingress rule open to all IPv4
  - kind: grep
    file_glob: "**/*.tf"
    regex: 'ipv6_cidr_blocks\s*=\s*\["::/0"\]'
    description: security group ingress rule open to all IPv6
recommendation: |
  Restrict `cidr_blocks` to the specific IP ranges that need access.
  For SSH/RDP, use a bastion host or AWS Systems Manager Session Manager
  instead of opening ports to the internet. For web traffic, place an
  ALB/NLB in front with a restrictive security group.
verification: |
  Run `aws ec2 describe-security-groups --group-ids <sg-id>` and confirm
  no ingress rules have `0.0.0.0/0` or `::/0` as source.
fixtures:
  - attack_graph_demo
  - aws_sg_open
test_template: |
  run "sg_no_open_ingress_{rule_id}" {
    command = plan
    assert {
      condition     = !contains([for rule in aws_security_group.{resource}.ingress : rule.cidr_blocks], ["0.0.0.0/0"])
      error_message = "{resource} must not allow ingress from 0.0.0.0/0 (SEC-AWS-SG-001)."
    }
  }
fix_hcl: |
  # Replace 0.0.0.0/0 with a specific CIDR range:
  ingress {
    from_port   = 443
    to_port     = 443
    protocol    = "tcp"
    cidr_blocks = ["10.0.0.0/8"]
  }
fix_disruption: plan_required
fix_disruption_note: "Restricting CIDR blocks updates the security group in-place; existing connections are not interrupted but new connections are blocked."
