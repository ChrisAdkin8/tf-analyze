id: STK-AZURE-AKS-004
title: "AKS public API server has no authorized IP ranges"
section: stack
default_urgency: HIGH
blast_radius: environment
status: active
mitre:
  - "T1190"
cwe:
  - "CWE-284"
d3fend:
  - "D3-IAA"
nist_csf:
  - "PR.AC-3"
nist_800_53:
  - "SC-7"
csa_ccm:
  - "IVS-04"
patterns:
  # Used to repeat SEC-AZURE-AKS-PRIVATE-001 exactly (missing / false
  # private_cluster_enabled). Now the layer under it: a cluster that is
  # public should at least restrict who can reach the API server.
  - kind: resource_missing_arg
    resource: azurerm_kubernetes_cluster
    nested_path: api_server_access_profile.authorized_ip_ranges
    suppress_if:
      arg: private_cluster_enabled
      equals: true
    description: |
      `azurerm_kubernetes_cluster` with a public API server (no
      `private_cluster_enabled = true`) and no
      `api_server_access_profile { authorized_ip_ranges = [...] }`: the
      API server accepts connections from the whole internet, so a
      leaked kubeconfig or an API server CVE is exploitable from
      anywhere. SEC-AZURE-AKS-PRIVATE-001 reports the cluster not being
      private; this reports the missing allow-list.
recommendation: |
  Prefer a private cluster (SEC-AZURE-AKS-PRIVATE-001). If the API server
  must stay public, restrict it to known networks:

      resource "azurerm_kubernetes_cluster" "app" {
        api_server_access_profile {
          authorized_ip_ranges = ["203.0.113.0/24"]
        }
      }
verification: |
  `az aks show --name <cluster> --resource-group <rg> \
    --query 'apiServerAccessProfile.authorizedIpRanges'`
  must list the expected ranges (or the cluster must be private).
fix_hcl: |
  resource "azurerm_kubernetes_cluster" "example" {
    name                = "example"
    resource_group_name = azurerm_resource_group.example.name
    location            = azurerm_resource_group.example.location
    dns_prefix          = "example"
    api_server_access_profile {
      authorized_ip_ranges = ["203.0.113.0/24"]
    }
    default_node_pool {
      name       = "default"
      node_count = 1
      vm_size    = "Standard_D2_v2"
    }
    identity { type = "SystemAssigned" }
  }
fix_disruption: none
fixtures:
  - azure_aks_not_private
