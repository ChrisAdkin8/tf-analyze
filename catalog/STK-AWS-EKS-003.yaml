id: STK-AWS-EKS-003
title: "EKS cluster Kubernetes Secrets not encrypted with KMS"
section: stack
default_urgency: HIGH
blast_radius: environment
cis:
  - "5.3.1"
status: active
applies_when:
  # The `encryption_config` block on aws_eks_cluster was added in AWS
  # provider 3.0. Pre-3.0 had no way to configure envelope encryption,
  # so the rule cannot be evaluated and would emit false positives.
  min_provider:
    aws: "3.0"
patterns:
  - kind: resource_missing_arg
    resource: aws_eks_cluster
    nested_path: encryption_config.provider.key_arn
    description: |
      `aws_eks_cluster` without an `encryption_config { provider { key_arn } }`
      block. Kubernetes Secrets — including service account tokens, TLS
      certificates, and application credentials — are stored in etcd
      encrypted only at the EBS volume level (AWS-managed key). Without
      envelope encryption at the application layer, anyone who can read the
      EBS snapshot or the etcd backup can access every Secret in the cluster.
recommendation: |
  Add an `encryption_config` block pointing to a customer-managed KMS key:

      resource "aws_eks_cluster" "app" {
        encryption_config {
          resources = ["secrets"]
          provider {
            key_arn = aws_kms_key.eks.arn
          }
        }
      }

      resource "aws_kms_key" "eks" {
        description             = "EKS secrets encryption"
        enable_key_rotation     = true
        deletion_window_in_days = 30
      }

  Equivalent to GKE `database_encryption { state = "ENCRYPTED" }`.
verification: |
  `aws eks describe-cluster --name <name> \
    --query 'cluster.encryptionConfig'`
  must return a non-empty list with `resources: ["secrets"]`.
fix_hcl: |
  resource "aws_eks_cluster" "example" {
    name     = "example"
    role_arn = aws_iam_role.eks.arn
    encryption_config {
      provider { key_arn = aws_kms_key.eks.arn }
      resources = ["secrets"]
    }
    vpc_config { subnet_ids = var.subnet_ids }
  }
fix_disruption: plan_required
fixtures:
  - aws_eks_no_secrets_encrypt
