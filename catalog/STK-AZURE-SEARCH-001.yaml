id: STK-AZURE-SEARCH-001
title: "Azure Cognitive Search service missing identity (no CMK)"
section: stack
default_urgency: MEDIUM
blast_radius: single-resource
status: active
pci_dss:
  - "Req-3.4"
soc2_cc:
  - "CC6.7"
mitre:
  - "T1530"
cwe:
  - "CWE-311"
d3fend:
  - "D3-EAR"
nist_csf:
  - "PR.DS-1"
nist_800_53:
  - "SC-13"
csa_ccm:
  - "CEK-03"
patterns:
  - kind: resource_missing_arg
    resource: azurerm_search_service
    arg: identity
    description: |
      `azurerm_search_service` has no `identity` block. Without a
      managed identity, the service cannot encrypt indexes with a
      customer-managed key — only Microsoft-managed keys are available.
recommendation: |
  Bind a system-assigned identity and configure
  `encryption_key_vault_credentials`:

      resource "azurerm_search_service" "main" {
        # ...
        identity { type = "SystemAssigned" }
        encryption_key {
          key_vault_key_id          = azurerm_key_vault_key.search.id
          identity_client_id        = azurerm_user_assigned_identity.search.client_id
        }
      }
verification: |
  `az search service show -g <rg> -n <name> --query 'identity.type'`
  must return `SystemAssigned`.
fix_hcl: |
  resource "azurerm_search_service" "example" {
    name                = "example"
    resource_group_name = azurerm_resource_group.example.name
    location            = azurerm_resource_group.example.location
    sku                 = "standard"
    identity { type = "SystemAssigned" }
  }
fix_disruption: plan_required
fixtures:
  - azure_search_no_identity
