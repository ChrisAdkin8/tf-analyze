id: MOD-PIN-001
title: "Git module source not pinned to a ref"
section: module
default_urgency: HIGH
blast_radius: module
status: active
patterns:
  - kind: grep
    text_scan: "Terraform structure outside resource attributes (module source, version constraints, lifecycle, data / provisioner blocks) - no structured kind for it yet"
    code_only: true  # ignore comments and heredoc text
    file_glob: "**/*.tf"
    regex: 'source\s*=\s*"git::(?![^"]*[?&]ref=)[^"]*"\s*$'
    description: git source without ?ref= pin
  - kind: grep
    text_scan: "Terraform structure outside resource attributes (module source, version constraints, lifecycle, data / provisioner blocks) - no structured kind for it yet"
    code_only: true  # ignore comments and heredoc text
    file_glob: "**/*.tf"
    regex: 'source\s*=\s*"github\.com/(?![^"]*[?&]ref=)[^"]*"\s*$'
    description: github.com source without ?ref= pin
  - kind: grep
    text_scan: "Terraform structure outside resource attributes (module source, version constraints, lifecycle, data / provisioner blocks) - no structured kind for it yet"
    code_only: true  # ignore comments and heredoc text
    file_glob: "**/*.tf"
    regex: 'source\s*=\s*"bitbucket\.org/(?![^"]*[?&]ref=)[^"]*"\s*$'
    description: bitbucket.org source without ?ref= pin
owasp_iac:
  - "Develop and Distribute / Open Source Dependency Scanning"
mitre:
  - "T1195.002"
cwe:
  - "CWE-1357"
d3fend:
  - "D3-SCA"
nist_csf:
  - "ID.SC-2"
  - "PR.IP-1"
nist_800_53:
  - "SR-3"
  - "CM-2"
csa_ccm:
  - "STA-04"
  - "CCC-05"
slsa:
  - "L2"
  - "deps"
recommendation: |
  Pin every git-hosted module (git::, github.com/, bitbucket.org/) by
  adding `?ref=v1.2.3` or `?ref=<commit-sha>` to the source URL. Registry
  modules without `version` are MOD-SUPPLY-003; a ref naming a branch is
  SEC-SUPPLY-001. Local paths (`./modules/foo`) need no pin.
verification: |
  Run `terraform get -update` and confirm the same version resolves on
  every machine. Commit `.terraform.lock.hcl`.
fix_hcl: |
  module "example" {
    source = "git::https://github.com/hashicorp/example.git?ref=v1.2.3"
  }
fix_disruption: none
fixtures:
  - unpinned_module
