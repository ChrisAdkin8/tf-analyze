id: STK-COMPUTE-001
title: "Compute instance uses default service account"
section: stack
default_urgency: HIGH
blast_radius: single-resource
status: stub
cis:
  - "4.1"
  - "4.2"
patterns:
  - kind: resource_missing_arg
    resource: google_compute_instance
    nested_path: service_account.email
recommendation: |
  Set `service_account { email = <dedicated-sa-email> scopes = ["cloud-platform"] }`.
  Default service accounts have project-level Editor by default — far
  more permission than any specific workload should hold.
verification: |
  `gcloud compute instances describe <name> --format='value(serviceAccounts[0].email)'`
  must NOT match `*-compute@developer.gserviceaccount.com`.
