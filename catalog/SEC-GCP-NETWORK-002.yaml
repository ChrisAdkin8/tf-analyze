id: SEC-GCP-NETWORK-002
title: "RDP (tcp:3389) exposed to 0.0.0.0/0"
section: security
default_urgency: CRITICAL
blast_radius: infrastructure-wide
status: active
cis:
  - "3.7"
mitre:
  - "T1190"
  - "T1133"
cwe:
  - "CWE-284"
  - "CWE-1327"
d3fend:
  - "D3-IAA"
nist_csf:
  - "PR.AC-3"
nist_800_53:
  - "SC-7"
  - "SC-7(3)"
csa_ccm:
  - "IVS-04"
  - "IVS-06"
patterns:
  - kind: firewall_open_port
    ports:
      - "3389"
    description: |
      `google_compute_firewall` with `source_ranges = ["0.0.0.0/0"]`
      and an `allow {}` block containing port 3389. World-open RDP is
      exploited by ransomware operators within minutes of exposure.
recommendation: |
  Restrict `source_ranges` to corporate CIDRs or use IAP TCP forwarding
  for RDP access. Never expose tcp:3389 to the public internet.

      resource "google_compute_firewall" "iap_rdp" {
        name    = "iap-rdp"
        network = google_compute_network.vpc.id

        source_ranges = ["35.235.240.0/20"]

        allow {
          protocol = "tcp"
          ports    = ["3389"]
        }

        target_tags = ["iap-rdp"]
      }
verification: |
  `gcloud compute firewall-rules list --filter='allowed.ports:3389 AND sourceRanges:0.0.0.0/0'`
  should return zero rows.
related:
  - SEC-GCP-NETWORK-001
fix_hcl: |
  resource "google_compute_firewall" "iap_rdp" {
    name          = "iap-rdp"
    network       = google_compute_network.vpc.id
    direction     = "INGRESS"
    source_ranges = ["35.235.240.0/20"]
    allow {
      protocol = "tcp"
      ports    = ["3389"]
    }
    target_tags = ["iap-rdp"]
  }
fix_disruption: none
fixtures:
  - firewall_open_rdp
