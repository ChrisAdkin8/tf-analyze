id: SEC-AZURE-DDOS-001
title: "Azure Virtual Network missing DDoS protection plan"
section: security
default_urgency: MEDIUM
blast_radius: environment
status: active
cis:
  - "6.5"
pci_dss:
  - "Req-1.3"
mitre:
  - "T1498"
cwe:
  - "CWE-770"
d3fend:
  - "D3-NTA"
nist_csf:
  - "PR.PT-4"
nist_800_53:
  - "SC-5"
patterns:
  - kind: resource_missing_arg
    resource: azurerm_virtual_network
    arg: ddos_protection_plan
    description: |
      `azurerm_virtual_network` has no `ddos_protection_plan` block.
      Public IPs in this VNet are protected only by Azure's basic DDoS
      coverage (volumetric only). Standard tier adds adaptive tuning,
      attack analytics, and cost protection.
recommendation: |
  Provision a DDoS plan and attach the VNet (note: a single plan can
  be shared across many VNets to amortize cost):

      resource "azurerm_network_ddos_protection_plan" "main" {
        name                = "ddos-plan"
        location            = azurerm_resource_group.main.location
        resource_group_name = azurerm_resource_group.main.name
      }

      resource "azurerm_virtual_network" "main" {
        # ...
        ddos_protection_plan {
          id     = azurerm_network_ddos_protection_plan.main.id
          enable = true
        }
      }
verification: |
  `az network vnet show -g <rg> -n <name> --query 'enableDdosProtection'`
  must return `true`.
fix_hcl: |
  resource "azurerm_virtual_network" "example" {
    name                = "example"
    location            = azurerm_resource_group.example.location
    resource_group_name = azurerm_resource_group.example.name
    address_space       = ["10.0.0.0/16"]
    ddos_protection_plan {
      id     = azurerm_network_ddos_protection_plan.example.id
      enable = true
    }
  }
fix_disruption: plan_required
fixtures:
  - azure_vnet_no_ddos
