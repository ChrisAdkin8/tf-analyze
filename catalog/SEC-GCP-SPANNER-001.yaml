id: SEC-GCP-SPANNER-001
title: "GCP Spanner instance not encrypted with customer-managed key"
section: security
default_urgency: MEDIUM
blast_radius: single-resource
status: active
pci_dss:
  - "Req-3.4"
soc2_cc:
  - "CC6.7"
mitre:
  - "T1530"
cwe:
  - "CWE-311"
d3fend:
  - "D3-EAR"
nist_csf:
  - "PR.DS-1"
nist_800_53:
  - "SC-12"
  - "SC-13"
csa_ccm:
  - "CEK-03"
patterns:
  - kind: resource_missing_arg
    resource: google_spanner_database
    arg: encryption_config
    description: |
      `google_spanner_database` has no `encryption_config`. The database
      is encrypted with a Google-managed key — customer-controlled key
      revocation is impossible. PCI-DSS Req-3.4 and FedRAMP-High require
      CMEK.
recommendation: |
  Pin a Cloud KMS key on the database:

      resource "google_spanner_database" "main" {
        # ...
        encryption_config {
          kms_key_name = google_kms_crypto_key.spanner.id
        }
      }
verification: |
  `gcloud spanner databases describe <db> --instance=<inst> \
    --format='value(encryptionConfig.kmsKeyName)'` must return a
  non-null Cloud KMS key URI.
fix_hcl: |
  resource "google_spanner_database" "example" {
    instance = google_spanner_instance.example.name
    name     = "example"
    encryption_config {
      kms_key_name = "projects/example/locations/us-central1/keyRings/r/cryptoKeys/k"
    }
  }
fix_disruption: forces_replacement
fixtures:
  - gcp_spanner_no_cmek
