id: SEC-AWS-IAM-JSON-003
title: "Inline IAM policy JSON grants `Action: \"*\"` AND `Resource: \"*\"`"
section: security
default_urgency: CRITICAL
blast_radius: infrastructure-wide
status: active
cis:
  - "1.16"
pci_dss:
  - "Req-7.2.2"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1078.004"
  - "T1098.001"
patterns:
  - kind: iam_json_policy_analysis
    check: wildcard_action_and_resource
    description: |
      Inline JSON policy contains a single Allow statement granting
      both `Action: "*"` and `Resource: "*"` — the canonical
      AdministratorAccess shape, hand-rolled inline rather than via
      the named AWS-managed policy. Bypasses org-level controls and
      audit tools that recognise `AdministratorAccess`.
owasp_iac:
  - "Develop and Distribute / Resource Permission Minimization"
cwe:
  - "CWE-269"
  - "CWE-732"
nist_csf:
  - "PR.AC-4"
nist_800_53:
  - "AC-3"
  - "AC-6"
csa_ccm:
  - "IAM-09"
recommendation: |
  Replace the wildcard with the explicit minimum action and resource set
  the workload needs. Attaching the AWS-managed `AdministratorAccess`
  policy instead is not a fix: it grants exactly the same access. If a
  principal truly needs full administrator access, keep it to a
  break-glass role behind MFA and an SCP guardrail, and record why.
verification: |
  No statement in the rendered policy may combine `Action: "*"` and
  `Resource: "*"`. CloudTrail data events on this principal should
  narrow to a small set of services after the fix.
fix_hcl: |
  resource "aws_iam_policy" "example" {
    name   = "example"
    policy = jsonencode({
      Version = "2012-10-17",
      Statement = [
        {
          Effect   = "Allow",
          Action   = ["s3:GetObject", "s3:PutObject"],
          Resource = "arn:aws:s3:::my-bucket/*"
        }
      ]
    })
  }
fix_disruption: plan_required
fixtures:
  - aws_iam_json_full_admin
