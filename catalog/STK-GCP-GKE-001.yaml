id: STK-GCP-GKE-001
title: "GKE cluster missing private nodes"
section: stack
default_urgency: HIGH
blast_radius: environment
status: active
cis:
  - "8.5.3"
patterns:
  - kind: resource_missing_arg
    resource: google_container_cluster
    nested_path: private_cluster_config.enable_private_nodes
recommendation: |
  Add a `private_cluster_config { enable_private_nodes = true ... }` block.
  Public node IPs widen the attack surface and prevent VPC Service Controls
  from constraining outbound traffic.

      private_cluster_config {
        enable_private_nodes    = true
        enable_private_endpoint = false
        master_ipv4_cidr_block  = "172.16.0.0/28"
      }
verification: |
  `gcloud container clusters describe <name> --format='value(privateClusterConfig.enablePrivateNodes)'`
  must return `True`.
fix_hcl: |
  resource "google_container_cluster" "example" {
    name     = "example"
    location = "us-central1"
    private_cluster_config {
      enable_private_nodes    = true
      enable_private_endpoint = false
      master_ipv4_cidr_block  = "172.16.0.0/28"
    }
    ip_allocation_policy {}
  }
fix_disruption: forces_replacement
fixtures:
  - gke_no_private_nodes
