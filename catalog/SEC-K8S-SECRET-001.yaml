id: SEC-K8S-SECRET-001
title: "kubernetes_secret carries literal `data` (vs ExternalSecret / Vault Secrets Operator)"
section: security
default_urgency: HIGH
blast_radius: environment
status: active
cis:
  - "5.4.1"
pci_dss:
  - "Req-3.5.1"
  - "Req-8.3.1"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1552.001"
  - "T1078"
cwe:
  - "CWE-798"
  - "CWE-312"
nist_csf:
  - "PR.DS-1"
  - "PR.DS-5"
nist_800_53:
  - "IA-5"
  - "SC-28"
csa_ccm:
  - "EKM-04"
  - "DSI-03"
owasp:
  - "K08"
owasp_iac:
  - "Develop and Distribute / Secrets Detection"
# kubernetes_secret stored under Terraform with a literal `data`
# (or `data_string`) block places the secret value in:
#   1. The .tf source tree (often checked into git)
#   2. The terraform state file (often in remote state, possibly
#      world-readable via misconfigured backend permissions)
#   3. Every CI worker that ran a plan or apply
# The correct shape is to reference a Secrets Operator (Vault Secrets
# Operator, External Secrets Operator, AWS Secrets Manager CSI) that
# pulls the value at runtime — Terraform only declares the *reference*.
# Patterns name `kubernetes_secret`; the loader applies each to
# `kubernetes_secret_v1` as well (_catalog.kubernetes_type_aliases).
# The three alternatives in each regex are mutually exclusive (plain
# character / "${...}" string / other quoted string): overlapping ones
# backtracked exponentially on a crafted file (ReDoS in CI).
patterns:
  - kind: resource_body_contains
    resource: kubernetes_secret
    regex: '(?ms)^\s*data\s*=\s*\{(?:[^}"]|"\$\{[^"]*"|"(?!\$\{)[^"]*"(?=\s*[=,)]))*?=\s*"(?!\$\{)'
    description: |
      `kubernetes_secret` / `kubernetes_secret_v1` has a `data = { ... }`
      map with a literal string value. The value is base64-encoded but
      not encrypted — it sits verbatim in the .tf source and the
      Terraform state file. A value taken from a variable or data source
      (`var.db_password`) is not reported here: the source tree no longer
      holds it (it is still in state).
  - kind: resource_body_contains
    resource: kubernetes_secret
    regex: '(?ms)^\s*data\s*\{(?:[^}"]|"\$\{[^"]*"|"(?!\$\{)[^"]*"(?=\s*[=,)]))*?=\s*"(?!\$\{)'
    description: |
      Same as above for the block form (`data { foo = "..." }`). Quoted
      keys (`".dockerconfigjson" = "..."`) and quoted function
      arguments are stepped over, so they do not hide a literal value.
recommendation: |
  Replace the literal `data` with a Kubernetes Secrets Operator
  reference. Two common patterns:

  External Secrets Operator (ESO) — Terraform declares the
  ExternalSecret CRD; ESO pulls the value from Vault / Secrets
  Manager / GCP Secret Manager at runtime:

      resource "kubernetes_manifest" "db_password" {
        manifest = {
          apiVersion = "external-secrets.io/v1beta1"
          kind       = "ExternalSecret"
          metadata = { name = "db-password", namespace = "app" }
          spec = {
            secretStoreRef = { name = "vault", kind = "ClusterSecretStore" }
            target         = { name = "db-password" }
            data = [{
              secretKey = "password"
              remoteRef = { key = "kv/data/app", property = "db_password" }
            }]
          }
        }
      }

  Vault Secrets Operator (VSO) — same shape, vault-native:

      resource "kubernetes_manifest" "vso" {
        manifest = {
          apiVersion = "secrets.hashicorp.com/v1beta1"
          kind       = "VaultStaticSecret"
          metadata = { name = "db", namespace = "app" }
          spec = {
            mount     = "kv"
            type      = "kv-v2"
            path      = "app/db"
            destination = { create = true, name = "db" }
          }
        }
      }
verification: |
  `terraform state list | grep kubernetes_secret$ | while read r; do terraform state show "$r" | grep -A2 '"data"'; done`
  should not show literal values — only references via env vars or
  external secrets-operator CRDs.
fix_hcl: |
  resource "kubernetes_manifest" "external_secret" {
    manifest = {
      apiVersion = "external-secrets.io/v1beta1"
      kind       = "ExternalSecret"
      metadata = {
        name      = "app-secret"
        namespace = "app"
      }
      spec = {
        secretStoreRef = {
          name = "vault"
          kind = "ClusterSecretStore"
        }
        target = {
          name           = "app-secret"
          creationPolicy = "Owner"
        }
        data = [{
          secretKey = "password"
          remoteRef = {
            key      = "kv/data/app"
            property = "password"
          }
        }]
      }
    }
  }
fix_disruption: forces_replacement
fix_disruption_note: "Replacing kubernetes_secret with an ExternalSecret deletes the Terraform-managed Secret and lets ESO recreate it from Vault. Pods using the secret will momentarily lose access; stage in a sidecar namespace first."
fixtures:
  - k8s_secret_plaintext_data
