id: SEC-AZURE-WEBAPP-002
title: "App Service / Function App HTTPS not enforced"
section: security
default_urgency: HIGH
blast_radius: single-resource
cis:
  - "9.2"
mitre:
  - "T1071.001"
cwe:
  - "CWE-319"
d3fend:
  - "D3-EI"
status: active
patterns:
  - kind: resource_missing_arg
    resource: azurerm_linux_web_app
    arg: https_only
    description: |
      `azurerm_linux_web_app` without `https_only = true`. HTTP requests
      are accepted alongside HTTPS, enabling cleartext credential harvest.
  - kind: hcl_attr
    resource: azurerm_linux_web_app
    path: https_only
    not_equal: true
  - kind: resource_missing_arg
    resource: azurerm_windows_web_app
    arg: https_only
  - kind: hcl_attr
    resource: azurerm_windows_web_app
    path: https_only
    not_equal: true
  - kind: resource_missing_arg
    resource: azurerm_linux_function_app
    arg: https_only
  - kind: hcl_attr
    resource: azurerm_linux_function_app
    path: https_only
    not_equal: true
  - kind: resource_missing_arg
    resource: azurerm_windows_function_app
    arg: https_only
  - kind: hcl_attr
    resource: azurerm_windows_function_app
    path: https_only
    not_equal: true
recommendation: |
  Set `https_only = true` on every App Service and Function App:

      resource "azurerm_linux_web_app" "app" {
        name            = "app"
        https_only      = true
        # ...
      }

  This causes Azure App Service to redirect all HTTP requests to HTTPS
  (301 Permanent Redirect) before they reach the application code.
  Without this flag, HTTP traffic is accepted — credentials and session
  tokens cross the network in plaintext.
verification: |
  `az webapp show --name <name> --resource-group <rg> \
    --query 'httpsOnly'`
  must return `true`.
fix_hcl: |
  resource "azurerm_linux_web_app" "example" {
    name                = "example"
    resource_group_name = azurerm_resource_group.example.name
    location            = azurerm_resource_group.example.location
    service_plan_id     = azurerm_service_plan.example.id
    https_only          = true
    site_config {}
  }
fix_disruption: none
fixtures:
  - azure_webapp_no_https
