id: SEC-AWS-RDS-002
title: "RDS instance or Aurora cluster storage not encrypted"
section: security
default_urgency: MEDIUM
blast_radius: single-resource
status: active
cis:
  - "2.3.1"
patterns:
  - kind: resource_missing_arg
    resource: aws_db_instance
    arg: storage_encrypted
    suppress_if:
      - arg: replicate_source_db
        regex: "."
      - arg: snapshot_identifier
        regex: "."
    description: |
      RDS instance missing storage_encrypted (defaults to false). Skipped
      for read replicas and snapshot restores, which take their encryption
      from the source.
  - kind: resource_arg
    resource: aws_db_instance
    arg: storage_encrypted
    regex: "^false$"
    description: RDS instance with storage_encrypted = false
  - kind: resource_missing_arg
    resource: aws_rds_cluster
    arg: storage_encrypted
    suppress_if:
      - arg: engine_mode
        equals: serverless
      - arg: snapshot_identifier
        regex: "."
      - arg: replication_source_identifier
        regex: "."
    description: |
      Aurora cluster missing storage_encrypted (defaults to false for
      provisioned clusters). Skipped for Aurora Serverless v1
      (`engine_mode = "serverless"`, always encrypted), snapshot restores
      and cross-region replicas, which take their encryption from the source.
  - kind: resource_arg
    resource: aws_rds_cluster
    arg: storage_encrypted
    regex: "^false$"
    description: Aurora cluster with storage_encrypted = false
recommendation: |
  Set `storage_encrypted = true` and provide a `kms_key_id` pointing to a
  customer-managed KMS key on every `aws_db_instance`. Encrypting storage
  at rest protects data from physical media theft and satisfies PCI-DSS,
  HIPAA, and SOC 2 controls. Note: encryption cannot be enabled on an
  existing unencrypted instance — you must snapshot, restore to a new
  encrypted instance, and redirect traffic.
pci_dss:
  - "Req-3.4"
soc2_cc:
  - "CC6.7"
nist_csf:
  - "PR.DS-1"
nist_800_53:
  - "SC-13"
  - "SC-28"
csa_ccm:
  - "CEK-03"
verification: |
  Run `aws rds describe-db-instances --db-instance-identifier <id>` and
  confirm `StorageEncrypted` is `true`. Run `terraform plan` and verify
  no diff shows `storage_encrypted = false`.
fix_hcl: |
  resource "aws_db_instance" "example" {
    # ... other arguments ...
    storage_encrypted = true
    kms_key_id        = aws_kms_key.rds.arn
  }
fix_disruption: forces_replacement
fix_disruption_note: "Storage encryption cannot be enabled on an existing RDS instance — requires snapshot + restore to a new encrypted instance and traffic cutover."
fixtures:
  - aws_rds_unencrypted
escalation:
  - condition: "is_production_environment"
    new_urgency: HIGH
