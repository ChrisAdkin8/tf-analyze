id: SEC-AWS-SECRETSMANAGER-001
title: "Secrets Manager secret has no automatic rotation configured"
section: security
default_urgency: MEDIUM
blast_radius: environment
status: active
patterns:
  - kind: resource_absent
    resource: aws_secretsmanager_secret_rotation
    when_present: aws_secretsmanager_secret
    scope: repo
    description: |
      An `aws_secretsmanager_secret` is declared but no
      `aws_secretsmanager_secret_rotation` companion resource exists.
      Without rotation the secret is static — a leaked credential
      remains valid indefinitely and blast radius grows over time.
recommendation: |
  Add an `aws_secretsmanager_secret_rotation` resource:

      resource "aws_secretsmanager_secret_rotation" "db" {
        secret_id           = aws_secretsmanager_secret.db.id
        rotation_lambda_arn = aws_lambda_function.rotator.arn

        rotation_rules {
          automatically_after_days = 30
        }
      }

  AWS provides managed rotation Lambda functions for RDS, Aurora,
  Redshift, and DocumentDB via the Serverless Application Repository —
  no custom Lambda required. For custom secrets, deploy the generic
  rotation template and adapt the `rotate_secret` handler.
verification: |
  `aws secretsmanager describe-secret --secret-id <arn> \
    --query 'RotationEnabled'`
  must return `true`.
fixtures:
  - aws_secretsmanager_no_rotation
