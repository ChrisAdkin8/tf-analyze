id: SEC-AWS-SECRETSMANAGER-001
title: "Secrets Manager secret uses AWS-managed key (no CMK)"
section: security
default_urgency: MEDIUM
blast_radius: single-resource
status: active
cis:
  - id: "3.8"
    title: "Ensure rotation for customer created symmetric CMKs is enabled"
pci_dss:
  - "Req-3.6"
soc2_cc:
  - "CC6.1"
patterns:
  - kind: resource_missing_arg
    resource: aws_secretsmanager_secret
    arg: kms_key_id
    description: |
      `aws_secretsmanager_secret` has no `kms_key_id`. The AWS-managed key
      cannot be disabled, rotated on demand, or scoped to a specific IAM
      principal. A customer-managed KMS key enables key policy enforcement
      and CloudTrail audit of every secret decryption.
owasp_iac:
  - "Develop and Distribute / Secrets Storage Management"
nist_csf:
  - "PR.DS-5"
nist_800_53:
  - "SC-12"
csa_ccm:
  - "CEK-09"
recommendation: |
  Specify a customer-managed KMS key:

      resource "aws_secretsmanager_secret" "app_db" {
        name       = "app/db/password"
        kms_key_id = aws_kms_key.secrets.arn
      }
verification: |
  `aws secretsmanager describe-secret --secret-id <name> --query 'KmsKeyId'`
  must return your CMK ARN, not null or aws/secretsmanager.
fix_hcl: |
  resource "aws_secretsmanager_secret" "example" {
    name       = "example"
    kms_key_id = aws_kms_key.secrets.arn
  }
fix_disruption: none
fixtures:
  - aws_secretsmanager_no_cmk
