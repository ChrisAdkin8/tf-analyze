id: STK-AZURE-SQL-TDE-001
title: "Azure SQL Database has transparent data encryption turned off"
section: stack
default_urgency: HIGH
blast_radius: single-resource
cis:
  - "4.1.1"
status: active
mitre:
  - "T1530"
cwe:
  - "CWE-311"
d3fend:
  - "D3-EAR"
nist_csf:
  - "PR.DS-1"
nist_800_53:
  - "SC-13"
  - "SC-28"
csa_ccm:
  - "CEK-03"
patterns:
  - kind: resource_arg
    resource: azurerm_mssql_database
    arg: transparent_data_encryption_enabled
    regex: '^false$'
    description: |
      `azurerm_mssql_database` sets `transparent_data_encryption_enabled
      = false`. TDE encrypts data files, logs and backups at rest and is
      on by default (azurerm only allows turning it off on DataWarehouse
      SKUs). The rule used to require an
      `azurerm_mssql_database_transparent_data_encryption` resource, which
      does not exist, so it fired on every database.
recommendation: |
  Remove `transparent_data_encryption_enabled = false` (the default is
  `true`) or set it to `true`. For a customer-managed key, also set
  `transparent_data_encryption_key_vault_key_id`.
verification: |
  `az sql db tde show --database <db> --server <server> \
    --resource-group <rg> --query 'status'`
  must return `"Enabled"`.
fix_hcl: |
  resource "azurerm_mssql_database" "example" {
    name                                = "example-db"
    server_id                           = azurerm_mssql_server.example.id
    transparent_data_encryption_enabled = true
  }
fix_disruption: none
fixtures:
  - azure_sql_no_tde
