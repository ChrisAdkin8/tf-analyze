id: STK-GCP-CLOUDSQL-004
title: "Cloud SQL instance does not require SSL connections"
section: stack
default_urgency: HIGH
blast_radius: single-resource
status: active
cis:
  - "6.1.2"
patterns:
  - kind: resource_missing_arg
    resource: google_sql_database_instance
    nested_path: settings.ip_configuration.require_ssl
  - kind: hcl_attr
    resource: google_sql_database_instance
    path: settings.ip_configuration.require_ssl
    not_equal: true
recommendation: |
  Set `require_ssl = true` in the `ip_configuration` block:

      settings {
        ip_configuration {
          require_ssl     = true
          ipv4_enabled    = false
          private_network = google_compute_network.vpc.id
        }
      }

  Without this flag, clients can connect over unencrypted TCP. Any
  network path between client and Cloud SQL (VPC, Cloud Interconnect,
  Cloud VPN) becomes a potential eavesdropping or MITM point.
verification: |
  `gcloud sql instances describe <name> \
    --format='value(settings.ipConfiguration.requireSsl)'`
  must return `True`.
fix_hcl: |
  resource "google_sql_database_instance" "example" {
    # ... other arguments ...
    settings {
      ip_configuration {
        ssl_mode = "ENCRYPTED_ONLY"
      }
    }
  }
fix_disruption: plan_required
fixtures:
  - cloudsql_no_require_ssl
