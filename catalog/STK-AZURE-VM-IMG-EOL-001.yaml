id: STK-AZURE-VM-IMG-EOL-001
title: "Azure virtual machine using end-of-life OS image"
section: stack
default_urgency: HIGH
blast_radius: single-resource
status: active
mitre:
  - "T1195.002"
cwe:
  - "CWE-1104"
d3fend:
  - "D3-SCA"
nist_csf:
  - "ID.SC-2"
nist_800_53:
  - "SR-4"
slsa:
  - "deps"
patterns:
  - kind: resource_body_contains
    resource: azurerm_linux_virtual_machine
    regex: 'offer\s*=\s*"(UbuntuServer|0001-com-ubuntu-server-(focal|bionic|xenial))"'
    description: |
      `azurerm_linux_virtual_machine.source_image_reference.offer`
      points at an EOL Ubuntu LTS image (Bionic 18.04, Xenial 16.04,
      or the deprecated `UbuntuServer` SKU family). Standard support
      ended; only ESM tier (paid) receives security patches.
  - kind: resource_body_contains
    resource: azurerm_windows_virtual_machine
    regex: 'sku\s*=\s*"(2012-Datacenter|2016-Datacenter|2008-R2-SP1)"'
    description: Windows Server 2008-R2 / 2012 / 2012-R2 are out of mainstream support
recommendation: |
  Upgrade to a supported image family. Current Azure-supported Linux
  LTS: Ubuntu 22.04 (Jammy), 24.04 (Noble), Debian 12, RHEL 9, SLES 15.
  Windows: Server 2019, 2022, 2025.
verification: |
  `az vm show -g <rg> -n <name> --query 'storageProfile.imageReference'`
  must reference a currently-supported image SKU.
fix_hcl: |
  resource "azurerm_linux_virtual_machine" "example" {
    name                  = "example"
    resource_group_name   = azurerm_resource_group.example.name
    location              = azurerm_resource_group.example.location
    size                  = "Standard_D2s_v3"
    admin_username        = "azureuser"
    network_interface_ids = [azurerm_network_interface.example.id]
    source_image_reference {
      publisher = "Canonical"
      offer     = "0001-com-ubuntu-server-jammy"
      sku       = "22_04-lts-gen2"
      version   = "latest"
    }
    os_disk { caching = "ReadWrite" storage_account_type = "Standard_LRS" }
  }
fix_disruption: forces_replacement
fixtures:
  - azure_vm_eol_image
