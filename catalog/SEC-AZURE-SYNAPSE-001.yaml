id: SEC-AZURE-SYNAPSE-001
title: "Azure Synapse workspace permits public network access"
section: security
default_urgency: HIGH
blast_radius: module
status: active
cis:
  - "5.4"
pci_dss:
  - "Req-1.3"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1190"
cwe:
  - "CWE-284"
d3fend:
  - "D3-NTA"
nist_csf:
  - "PR.AC-5"
nist_800_53:
  - "SC-7"
patterns:
  - kind: resource_arg
    resource: azurerm_synapse_workspace
    arg: public_network_access_enabled
    regex: '^true$'
    description: |
      `azurerm_synapse_workspace.public_network_access_enabled = true`
      exposes the workspace SQL pool, Spark pool, and pipelines over
      the public internet.
recommendation: |
  Disable public network access and reach the workspace via managed
  private endpoints:

      resource "azurerm_synapse_workspace" "main" {
        # ...
        public_network_access_enabled = false
        managed_virtual_network_enabled = true
      }
verification: |
  `az synapse workspace show -g <rg> -n <name> --query 'publicNetworkAccess'`
  must return `Disabled`.
fix_hcl: |
  resource "azurerm_synapse_workspace" "example" {
    name                                 = "example"
    resource_group_name                  = azurerm_resource_group.example.name
    location                             = azurerm_resource_group.example.location
    storage_data_lake_gen2_filesystem_id = azurerm_storage_data_lake_gen2_filesystem.example.id
    sql_administrator_login              = "synapseadmin"
    sql_administrator_login_password     = "REDACTED"
    public_network_access_enabled        = false
    managed_virtual_network_enabled      = true
    identity { type = "SystemAssigned" }
  }
fix_disruption: plan_required
fixtures:
  - azure_synapse_public
