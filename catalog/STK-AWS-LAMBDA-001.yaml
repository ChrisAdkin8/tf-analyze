id: STK-AWS-LAMBDA-001
title: "Lambda function uses end-of-life runtime"
section: stack
default_urgency: HIGH
blast_radius: single-resource
status: active
patterns:
  - kind: resource_arg
    resource: aws_lambda_function
    arg: runtime
    # AWS Lambda "Deprecated runtimes" table, checked 2026-10-26. Due next:
    # python3.10 (2026-10-31), dotnet8 (2026-11-10).
    regex: '^(?:nodejs|nodejs4\.3|nodejs4\.3\-edge|nodejs6\.10|nodejs8\.10|nodejs10\.x|nodejs12\.x|nodejs14\.x|nodejs16\.x|nodejs18\.x|nodejs20\.x|python2\.7|python3\.6|python3\.7|python3\.8|python3\.9|ruby2\.5|ruby2\.7|ruby3\.2|java8|go1\.x|provided|provided\.al2|dotnetcore1\.0|dotnetcore2\.0|dotnetcore2\.1|dotnetcore3\.1|dotnet5\.0|dotnet6|dotnet7)$'
recommendation: |
  Upgrade the `runtime` to a currently supported version. EOL runtimes
  no longer receive security patches or OS updates from AWS, meaning known
  CVEs accumulate silently. AWS may also block deployment of new functions
  using deprecated runtimes after a deprecation deadline.
  See https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html
  for the current support matrix and deprecation schedule. Common
  replacements: `nodejs14.x` → `nodejs22.x`, `python3.7` → `python3.13`,
  `dotnetcore3.1` → `dotnet8`.
verification: |
  Run `aws lambda get-function-configuration --function-name <name>` and
  confirm `Runtime` is a currently supported value. Run `terraform plan`
  and verify the runtime argument references a non-EOL identifier.
fix_hcl: |
  resource "aws_lambda_function" "example" {
    function_name = "example"
    role          = aws_iam_role.lambda.arn
    handler       = "index.handler"
    runtime       = "python3.12"
    filename      = "function.zip"
  }
fix_disruption: none
fixtures:
  - aws_lambda_eol_runtime
