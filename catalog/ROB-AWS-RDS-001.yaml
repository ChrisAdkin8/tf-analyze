id: ROB-AWS-RDS-001
title: "RDS instance or Aurora cluster backup retention disabled"
section: robustness
default_urgency: HIGH
blast_radius: single-resource
status: active
patterns:
  - kind: resource_arg
    resource: aws_db_instance
    arg: backup_retention_period
    regex: "^0$"
    description: RDS instance with backup_retention_period = 0 (backups disabled)
  - kind: resource_missing_arg
    resource: aws_db_instance
    arg: backup_retention_period
    description: RDS instance missing backup_retention_period (defaults to 0 for non-replica)
  - kind: resource_arg
    resource: aws_rds_cluster
    arg: backup_retention_period
    regex: "^0$"
    description: Aurora cluster with backup_retention_period = 0 (backups disabled)
  - kind: resource_missing_arg
    resource: aws_rds_cluster
    arg: backup_retention_period
    description: Aurora cluster missing backup_retention_period (defaults to 1 but should be explicit)
recommendation: |
  Set `backup_retention_period` to at least `7` (days) on every
  `aws_db_instance`. For production databases, use `30` or more and also
  set `delete_automated_backups = false` so that automated backups survive
  an accidental instance deletion. Without backups, a corrupted or deleted
  database cannot be recovered to a point-in-time prior to the incident.
  Also consider enabling `copy_tags_to_snapshot = true` for cost allocation.
verification: |
  Run `aws rds describe-db-instances --db-instance-identifier <id>` and
  confirm `BackupRetentionPeriod` is greater than 0. Run `terraform plan`
  and verify no diff shows `backup_retention_period = 0` or a missing value.
soc2_cc:
  - "A1.2"
mitre:
  - "T1490"
fix_hcl: |
  resource "aws_db_instance" "example" {
    # ... other arguments ...
    backup_retention_period = 7
    backup_window           = "03:00-04:00"
  }
fix_disruption: plan_required
fixtures:
  - aws_rds_no_backup
test_template: |
  run "rds_deletion_protection_{rule_id}" {
    command = plan
    assert {
      condition     = aws_db_instance.{resource}.deletion_protection == true
      error_message = "{resource} must have deletion_protection = true (ROB-AWS-RDS-001)."
    }
  }
