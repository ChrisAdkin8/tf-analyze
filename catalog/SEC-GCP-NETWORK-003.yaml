id: SEC-GCP-NETWORK-003
title: "VPC subnet missing flow logs"
section: security
default_urgency: HIGH
blast_radius: environment
status: active
cis:
  - "3.8"
mitre:
  - "T1562.008"
cwe:
  - "CWE-778"
d3fend:
  - "D3-NTA"
patterns:
  - kind: resource_missing_arg
    resource: google_compute_subnetwork
    nested_path: log_config.aggregation_interval
recommendation: |
  Enable VPC Flow Logs on every subnet:

      log_config {
        aggregation_interval = "INTERVAL_5_SEC"
        flow_sampling        = 0.5
        metadata             = "INCLUDE_ALL_METADATA"
      }

  Flow logs are required for post-incident investigation, anomaly
  detection, and meeting CIS GCP 3.8. Absent logs mean lateral
  movement within the VPC leaves no network-layer evidence.
verification: |
  `gcloud compute networks subnets list --format='value(name,enableFlowLogs)'`
  must show `True` for all subnets in scope.
fix_hcl: |
  resource "google_compute_subnetwork" "example" {
    name          = "example"
    ip_cidr_range = "10.0.0.0/24"
    region        = "us-central1"
    network       = google_compute_network.vpc.id
    log_config {
      aggregation_interval = "INTERVAL_5_SEC"
      flow_sampling        = 0.5
      metadata             = "INCLUDE_ALL_METADATA"
    }
  }
fix_disruption: none
fixtures:
  - subnet_no_flow_logs
