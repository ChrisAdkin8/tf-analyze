id: SEC-AWS-RDS-001
title: "RDS instance or Aurora cluster publicly accessible"
section: security
default_urgency: HIGH
blast_radius: single-resource
status: active
cis:
  - "2.3.3"
patterns:
  - kind: resource_arg
    resource: aws_db_instance
    arg: publicly_accessible
    regex: "^true$"
    description: RDS instance with publicly_accessible = true
  - kind: resource_arg
    resource: aws_rds_cluster_instance
    arg: publicly_accessible
    regex: "^true$"
    description: Aurora cluster instance with publicly_accessible = true
recommendation: |
  Set `publicly_accessible = false` on every `aws_db_instance`. A publicly
  accessible RDS instance receives a DNS hostname resolvable from the
  internet, exposing the database port to potential brute-force and
  exploitation. Place the instance in private subnets and access it via a
  bastion host, AWS Systems Manager Session Manager, or a VPC-peered
  connection instead.
verification: |
  Run `aws rds describe-db-instances --db-instance-identifier <id>` and
  confirm `PubliclyAccessible` is `false`. Run `terraform plan` and verify
  no diff shows `publicly_accessible = true`.
fixtures:
  - aws_rds_public
test_template: |
  run "rds_encryption_at_rest_{rule_id}" {
    command = plan
    assert {
      condition     = aws_db_instance.{resource}.storage_encrypted == true
      error_message = "{resource} must have storage_encrypted = true (SEC-AWS-RDS-001)."
    }
  }
fix_hcl: |
  resource "aws_db_instance" "example" {
    storage_encrypted = true
    kms_key_id        = aws_kms_key.rds.arn
  }
