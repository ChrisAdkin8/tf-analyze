id: STK-AZURE-DATA-FACTORY-001
title: "Azure Data Factory not using managed virtual network"
section: stack
default_urgency: MEDIUM
blast_radius: module
status: active
pci_dss:
  - "Req-1.3"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1567"
cwe:
  - "CWE-200"
d3fend:
  - "D3-NTA"
nist_csf:
  - "PR.AC-5"
nist_800_53:
  - "SC-7"
patterns:
  - kind: resource_missing_arg
    resource: azurerm_data_factory
    arg: managed_virtual_network_enabled
    description: |
      `azurerm_data_factory.managed_virtual_network_enabled` is not set
      to `true`. Pipeline activities access data sources over the
      public Internet — there's no VNet boundary to enforce.
recommendation: |
  Enable managed VNet and add managed_private_endpoints for sources:

      resource "azurerm_data_factory" "main" {
        # ...
        managed_virtual_network_enabled = true
        public_network_enabled          = false
      }
verification: |
  `az datafactory show -g <rg> -n <name> --query 'properties.publicNetworkAccess'`
  must return `Disabled`.
fix_hcl: |
  resource "azurerm_data_factory" "example" {
    name                            = "example"
    resource_group_name             = azurerm_resource_group.example.name
    location                        = azurerm_resource_group.example.location
    managed_virtual_network_enabled = true
    public_network_enabled          = false
  }
fix_disruption: forces_replacement
fixtures:
  - azure_adf_no_managed_vnet
