id: SEC-AWS-IAM-002
title: "IAM assume role policy with wildcard Principal"
section: security
default_urgency: CRITICAL
blast_radius: infrastructure-wide
cis:
  - "1.16"
status: active
patterns:
  - kind: iam_json_policy_analysis
    check: public_principal
    resources:
      - aws_iam_role
    args:
      - assume_role_policy
    description: |
      The role's trust policy (`assume_role_policy`, as `jsonencode`,
      heredoc or JSON string) has an Allow statement whose `Principal`
      is `"*"` or has a `"*"` value (`{ AWS = "*" }`).
owasp_iac:
  - "Develop and Distribute / Resource Permission Minimization"
recommendation: |
  Restrict the `Principal` in assume role policies to specific AWS account
  IDs, IAM roles, or services. A wildcard principal (`"Principal": "*"`)
  allows any entity in the world to call `sts:AssumeRole`, effectively
  making the role public unless a restrictive Condition is also present.
  Replace `"Principal": "*"` with the exact ARN(s) of the trusted entity,
  e.g. `"Principal": {"Service": "lambda.amazonaws.com"}` or
  `"Principal": {"AWS": "arn:aws:iam::123456789012:role/my-role"}`.
verification: |
  Run `aws iam get-role --role-name <name>` and inspect the
  `AssumeRolePolicyDocument`. Confirm there is no `"Principal": "*"`
  without a restrictive `Condition` block. Run `terraform plan` and
  verify the rendered policy document in the plan output has no
  wildcard principal.
pci_dss:
  - "Req-7.1"
soc2_cc:
  - "CC6.1"
mitre:
  - "T1078.004"
cwe:
  - "CWE-269"
  - "CWE-732"
d3fend:
  - "D3-PA"
  - "D3-MFA"
nist_csf:
  - "PR.AC-1"
  - "PR.AC-4"
nist_800_53:
  - "AC-3"
  - "AC-6"
csa_ccm:
  - "IAM-09"
fix_hcl: |
  resource "aws_iam_role" "example" {
    name = "example"
    assume_role_policy = jsonencode({
      Version = "2012-10-17"
      Statement = [{
        Effect    = "Allow"
        Principal = { Service = "lambda.amazonaws.com" }
        Action    = "sts:AssumeRole"
      }]
    })
  }
fix_disruption: none
fixtures:
  - aws_iam_wildcard_principal
