id: COST-AZURE-RISK-001
title: "Azure resource missing cost control"
section: ops
default_urgency: MEDIUM
blast_radius: single-resource
status: active
mitre:
  - "T1496"
patterns:
  - kind: resource_arg
    resource: azurerm_kubernetes_cluster
    arg: sku_tier
    regex: '^Premium$'
    description: AKS cluster on Premium tier — confirm uptime SLA is required (Premium ≈ 3x Standard cost)
  - kind: resource_missing_arg
    resource: azurerm_kubernetes_cluster_node_pool
    arg: enable_auto_scaling
    description: Node pool without enable_auto_scaling (fixed node count, no scale-down on low utilisation)
  - kind: resource_missing_arg
    resource: azurerm_cosmosdb_account
    arg: capabilities
    description: |
      Cosmos account without `capabilities { name = "EnableServerless" }` and
      no explicit provisioned `throughput` block on associated containers.
      Provisioned throughput defaults are expensive ($24/mo per 100 RU/s).
  - kind: resource_missing_arg
    resource: azurerm_mssql_database
    arg: max_size_gb
    description: SQL Database without max_size_gb (unbounded growth → unbounded billing)
  - kind: resource_missing_arg
    resource: azurerm_log_analytics_workspace
    arg: daily_quota_gb
    description: Log Analytics workspace without daily_quota_gb (uncapped ingestion cost on a misbehaving agent)
recommendation: |
  Add explicit cost controls so a misconfigured workload cannot run up
  the bill:

  - AKS: justify Premium tier (24x7 SLA), enable auto-scaling on
    node pools so idle hours scale down.
  - Cosmos DB: prefer `capabilities { name = "EnableServerless" }` for
    spiky workloads; pin `throughput` on provisioned containers.
  - Azure SQL: set `max_size_gb` to bound disk growth.
  - Log Analytics: set `daily_quota_gb` to cap ingestion when a runaway
    agent or noisy diagnostic pipe floods the workspace.
verification: |
  Review the next `terraform plan` to confirm each named arg is now set,
  and configure Cost Management budgets on the subscription:
  `az consumption budget create --budget-name <name> --amount <usd> ...`
fix_hcl: |
  resource "azurerm_kubernetes_cluster_node_pool" "main" {
    name                  = "default"
    kubernetes_cluster_id = azurerm_kubernetes_cluster.main.id
    vm_size               = "Standard_D2s_v3"
    enable_auto_scaling   = true
    min_count             = 1
    max_count             = 5
  }

  resource "azurerm_log_analytics_workspace" "main" {
    name                = "law-main"
    location            = azurerm_resource_group.main.location
    resource_group_name = azurerm_resource_group.main.name
    sku                 = "PerGB2018"
    daily_quota_gb      = 10
  }
fix_disruption: none
fixtures:
  - azure_expensive_no_controls
