id: SEC-AZURE-EVENTHUB-001
title: "Event Hub namespace does not use CMK encryption"
section: security
default_urgency: MEDIUM
blast_radius: single-resource
status: active
pci_dss:
  - "Req-3.4"
soc2_cc:
  - "CC6.7"
mitre:
  - "T1530"
cwe:
  - "CWE-311"
d3fend:
  - "D3-EAR"
patterns:
  - kind: resource_missing_arg
    resource: azurerm_eventhub_namespace
    arg: customer_managed_key
    description: |
      `azurerm_eventhub_namespace` has no `customer_managed_key` block.
      Without a CMK, Event Hub data is encrypted with a Microsoft-managed key
      that cannot be revoked, audited independently, or rotated on a custom
      schedule. CMK encryption is required for PCI-DSS and many enterprise
      compliance frameworks.
recommendation: |
  Enable CMK encryption on the Event Hub namespace:

      resource "azurerm_eventhub_namespace" "main" {
        # ...
        identity {
          type = "SystemAssigned"
        }

        customer_managed_key {
          key_vault_key_id       = azurerm_key_vault_key.evhub.id
          infrastructure_encryption_enabled = true
        }
      }
verification: |
  `az eventhubs namespace show --name <name> --resource-group <rg> \
    --query 'encryption.keySource'`
  must return `"Microsoft.KeyVault"`.
fix_hcl: |
  resource "azurerm_eventhub_namespace" "example" {
    name                = "example"
    resource_group_name = azurerm_resource_group.example.name
    location            = azurerm_resource_group.example.location
    sku                 = "Premium"
    identity {
      type = "SystemAssigned"
    }
    customer_managed_key {
      key_vault_key_id = azurerm_key_vault_key.example.id
      infrastructure_encryption_enabled = true
    }
  }
fix_disruption: plan_required
fixtures:
  - azure_eventhub_no_cmk
