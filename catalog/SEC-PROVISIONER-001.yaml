id: SEC-PROVISIONER-001
title: "Provisioner block used for shell execution"
section: security
default_urgency: HIGH
blast_radius: single-resource
status: active
mitre:
  - "T1059"
cwe:
  - "CWE-78"
nist_csf:
  - "PR.PT-3"
nist_800_53:
  - "SI-10"
csa_ccm:
  - "CCC-05"
slsa:
  - "build"
patterns:
  - kind: grep
    text_scan: "Terraform structure outside resource attributes (module source, version constraints, lifecycle, data / provisioner blocks) - no structured kind for it yet"
    code_only: true  # ignore comments and heredoc text
    file_glob: "**/*.tf"
    regex: 'provisioner\s+"local-exec"'
    description: local-exec provisioner runs arbitrary shell commands
  - kind: grep
    text_scan: "Terraform structure outside resource attributes (module source, version constraints, lifecycle, data / provisioner blocks) - no structured kind for it yet"
    code_only: true  # ignore comments and heredoc text
    file_glob: "**/*.tf"
    regex: 'provisioner\s+"remote-exec"'
    description: remote-exec provisioner runs commands on remote hosts
recommendation: |
  Provisioners are a last resort. Replace with provider-native resources
  where possible:
  - `local-exec` for scripts → `terraform_data` with `provisioner` only
    when no provider resource exists, or use `null_resource` with explicit
    `triggers` to control re-execution.
  - `remote-exec` → cloud-init (`user_data`), Packer images, or
    configuration management (Ansible, Chef, Puppet).
  If a provisioner is genuinely needed, document the justification with
  an inline `# tf-analyze:ignore SEC-PROVISIONER-001` comment.
verification: |
  Search for `provisioner` blocks in the codebase. Confirm each remaining
  provisioner is documented with a justification comment or suppression.
fix_hcl: |
  # Replace remote-exec with user_data / cloud-init
  resource "aws_instance" "app" {
    ami           = data.aws_ami.ubuntu.id
    instance_type = "t3.micro"

    user_data = templatefile("${path.module}/cloud-init.sh.tpl", {
      environment = var.environment
    })
  }

  # Move local-exec work out of Terraform: a CI step after `apply`, or a
  # native resource (aws_ssm_association, aws_lambda_invocation) for
  # post-create actions. Where a provisioner is truly unavoidable, keep
  # it and record why with `# tf-analyze:ignore SEC-PROVISIONER-001`.
fix_disruption: none
fixtures:
  - provisioner_usage
