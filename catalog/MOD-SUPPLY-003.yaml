id: MOD-SUPPLY-003
title: "Registry module missing version constraint"
section: module
default_urgency: HIGH
blast_radius: module
status: active
patterns:
  - kind: module_block_missing_arg
    file_glob: "**/*.tf"
    # Registry address: [HOST/]NAMESPACE/NAME/PROVIDER[//SUBDIR]. A grep on
    # the source line could not see the block's `version`, so it fired on
    # every registry module, pinned or not.
    source_regex: '^(?:[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?::[0-9]+)?/)?[A-Za-z0-9][A-Za-z0-9_-]*/[A-Za-z0-9][A-Za-z0-9_-]*/[A-Za-z0-9][A-Za-z0-9_-]*(?://[^?]*)?$'
    arg: version
    description: Registry module block without a version = "..." argument
owasp_iac:
  - "Develop and Distribute / Open Source Dependency Scanning"
recommendation: |
  Add `version = "~> X.Y"` to every registry module block. Without a
  version constraint, `terraform init` resolves the latest available
  version making builds non-reproducible.
verification: |
  Confirm every module block referencing a registry source has a `version`
  argument.
soc2_cc:
  - "CC9.2"
mitre:
  - "T1195.002"
cwe:
  - "CWE-1357"
d3fend:
  - "D3-SCA"
nist_csf:
  - "ID.SC-2"
nist_800_53:
  - "SR-3"
csa_ccm:
  - "STA-04"
slsa:
  - "L2"
  - "deps"
fix_hcl: |
  module "example" {
    source  = "hashicorp/consul/aws"
    version = ">= 0.11.0, < 0.12.0"
  }
fix_disruption: none
fixtures:
  - mod_supply_no_version
