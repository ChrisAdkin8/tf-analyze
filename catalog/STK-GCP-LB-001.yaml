id: STK-GCP-LB-001
title: "GCP load balancer backend service has logging disabled"
section: stack
default_urgency: MEDIUM
blast_radius: single-resource
status: active
cis:
  - "2.13"
pci_dss:
  - "Req-10.2"
soc2_cc:
  - "CC7.2"
mitre:
  - "T1530"
  - "T1190"
cwe:
  - "CWE-778"
d3fend:
  - "D3-IAA"
nist_csf:
  - "DE.CM-1"
  - "PR.PT-1"
nist_800_53:
  - "AU-2"
  - "AU-12"
csa_ccm:
  - "LOG-08"
patterns:
  - kind: resource_missing_arg
    resource: google_compute_backend_service
    arg: log_config
    description: |
      `google_compute_backend_service` has no `log_config` block. Cloud
      Load Balancer access logs (path, status, latency, source IP, user
      agent) are not exported to Cloud Logging, blinding incident
      response and DDoS forensics. The AWS equivalent is the ALB access
      log gap (SEC-AWS-ALB-001).
  - kind: resource_body_contains
    resource: google_compute_backend_service
    regex: 'log_config\s*\{[^}]*enable\s*=\s*false'
    description: log_config block has enable = false (explicitly disabled)
recommendation: |
  Enable backend service logging:

      resource "google_compute_backend_service" "main" {
        # ...
        log_config {
          enable      = true
          sample_rate = 1.0
        }
      }

  For very high-volume services, lower `sample_rate` to control cost,
  but never set `enable = false`.
verification: |
  `gcloud compute backend-services describe <name> --global \
    --format='value(logConfig.enable)'` must return `True`.
fix_hcl: |
  resource "google_compute_backend_service" "example" {
    name                  = "example"
    protocol              = "HTTPS"
    port_name             = "https"
    load_balancing_scheme = "EXTERNAL_MANAGED"
    log_config {
      enable      = true
      sample_rate = 1.0
    }
  }
fix_disruption: none
fixtures:
  - gcp_lb_no_logging
