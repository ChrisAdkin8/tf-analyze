app = "tf-analyze"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm so GitHub's camo image proxy never serves a
  # broken-badge placeholder while the machine cold-starts. The cost
  # delta versus min_machines_running = 0 is small on a shared-cpu-1x
  # (~$2/mo) and badges are the load-bearing virality surface.
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpus = 1

# Per-SHA scan cache. A stranger linking
# `tfanalyze.com/scan/<owner>/<repo>` hits this volume before we re-clone.
# Survives machine restarts, scales horizontally with one volume per
# machine (Fly auto-mounts the right one).
[[mounts]]
  source = "tfanalyze_scan_cache"
  destination = "/var/cache/tf-analyze"
  initial_size = "1gb"
