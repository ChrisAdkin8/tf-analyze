app = "tf-analyze"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpus = 1

# Per-SHA scan cache. A stranger linking
# `tfanalyze.com/scan/<owner>/<repo>` hits this volume before we re-clone.
# Survives machine restarts, scales horizontally with one volume per
# machine (Fly auto-mounts the right one).
[[mounts]]
  source = "tfanalyze_scan_cache"
  destination = "/var/cache/tf-analyze"
  initial_size = "1gb"
