<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tf-analyze — Live Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #16213e; padding: 10px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #0f3460; flex-shrink: 0; }
  header h1 { font-size: 18px; color: #e94560; letter-spacing: 0.5px; }
  header span { color: #888; font-size: 13px; }
  #main { display: flex; flex: 1; min-height: 0; }
  .panel { display: flex; flex-direction: column; border-right: 1px solid #0f3460; min-width: 0; }
  #editor-panel { flex: 0 0 380px; }
  #findings-panel { flex: 0 0 380px; }
  #graph-panel { flex: 1; }
  .panel-header { background: #16213e; padding: 8px 12px; font-size: 12px; font-weight: 600; color: #a0a0c0; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .panel-body { flex: 1; overflow: auto; }
  #editor-container { height: 100%; }
  .CodeMirror { height: 100% !important; font-size: 12px; background: #1e1e2e; color: #cdd6f4; }
  .CodeMirror-scroll { height: 100%; }
  #controls { padding: 8px 12px; background: #16213e; border-top: 1px solid #0f3460; flex-shrink: 0; display: flex; gap: 8px; align-items: center; }
  #repo-input { flex: 1; background: #1e1e2e; border: 1px solid #0f3460; color: #cdd6f4; padding: 5px 8px; border-radius: 4px; font-size: 12px; }
  button { background: #e94560; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; }
  button:hover { background: #c73652; }
  button.secondary { background: #0f3460; }
  button.secondary:hover { background: #1a4a7a; }
  #findings-list { padding: 8px; }
  .finding-row { background: #16213e; border-radius: 6px; margin-bottom: 6px; overflow: hidden; cursor: pointer; border: 1px solid transparent; }
  .finding-row:hover { border-color: #0f3460; }
  .finding-header { display: flex; align-items: center; gap: 8px; padding: 7px 10px; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 700; flex-shrink: 0; }
  .CRITICAL { background: #7f1d1d; color: #fca5a5; }
  .HIGH { background: #78350f; color: #fcd34d; }
  .MEDIUM { background: #1e3a5f; color: #93c5fd; }
  .LOW { background: #1e3a1e; color: #86efac; }
  .finding-title { font-size: 12px; color: #e0e0e0; flex: 1; }
  .finding-location { font-size: 11px; color: #888; flex-shrink: 0; }
  .finding-fix { display: none; padding: 8px 10px; background: #0d1b2a; border-top: 1px solid #0f3460; font-family: monospace; font-size: 11px; white-space: pre; color: #a8cc8c; overflow-x: auto; }
  .finding-row.expanded .finding-fix { display: block; }
  #empty-state { padding: 40px; text-align: center; color: #555; font-size: 13px; }
  #status { font-size: 12px; color: #888; }
  #status.loading { color: #e94560; }
  #status.success { color: #86efac; }
  #status.error { color: #f87171; }
  #graph-svg { width: 100%; height: 100%; }
  .node circle { cursor: pointer; }
  .node text { font-size: 9px; fill: #aaa; pointer-events: none; }
  .link { fill: none; stroke: #2a2a4a; stroke-width: 1.2; marker-end: url(#arrow); }
  .link.critical { stroke: #e94560; stroke-width: 2.5; marker-end: url(#arrow-red); }
  @keyframes pulse { 0%,100%{stroke-opacity:0.8} 50%{stroke-opacity:0.2} }
  .inet-ring { animation: pulse 2s ease-in-out infinite; }

  /* Score banner above the findings list. The number is the load-bearing
     viewer-attention anchor in screenshots / demo videos. */
  #score-banner { padding: 14px 14px 12px; background: linear-gradient(180deg, #16213e 0%, #0f1a2e 100%); border-bottom: 1px solid #0f3460; }
  #score-banner .score-row { display: flex; align-items: baseline; gap: 6px; }
  #score-banner .score-num { font-size: 36px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
  #score-banner .score-grade { font-size: 16px; font-weight: 600; opacity: 0.85; }
  #score-banner .score-counts { font-size: 11px; color: #a0a0c0; margin-top: 6px; letter-spacing: 0.3px; }
  #score-banner .score-counts b { color: #e0e0e0; }
  .grade-A  { color: #4ade80; }
  .grade-B  { color: #86efac; }
  .grade-B- { color: #bef264; }
  .grade-C  { color: #fcd34d; }
  .grade-D  { color: #fb923c; }
  .grade-F  { color: #f87171; }
  .grade-unknown { color: #9f9f9f; }

  /* Top fixes panel — "fix this, score rises to Y" */
  #top-fixes-section { padding: 10px 14px; border-bottom: 1px solid #0f3460; background: #0f1a2e; }
  #top-fixes-section .section-title { font-size: 11px; font-weight: 600; color: #a0a0c0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .top-fix-row { font-size: 11px; padding: 3px 0; color: #c0c0d0; display: flex; gap: 8px; }
  .top-fix-rank { color: #888; min-width: 16px; }
  .top-fix-id { font-family: monospace; flex: 1; color: #e0e0e0; }
  .top-fix-delta { color: #86efac; font-weight: 600; }

  /* Module reuse — INFO-tier finding rendered as a dedicated panel. */
  #module-reuse-section { padding: 10px 14px; border-bottom: 1px solid #0f3460; background: #0f1a2e; }
  #module-reuse-section .section-title { font-size: 11px; font-weight: 600; color: #a0a0c0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .mod-reuse-row { background: #1a2a4e; border-left: 3px solid #6bbf84; border-radius: 4px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px; }
  .mod-reuse-row .mod-reuse-id { font-family: monospace; font-size: 10px; color: #6bbf84; }
  .mod-reuse-row .mod-reuse-title { margin-top: 3px; color: #e0e0e0; }
  .mod-reuse-row .mod-reuse-suggestion { margin-top: 4px; font-size: 11px; color: #a0a0c0; }
  .mod-reuse-row .mod-reuse-recommendation { display: none; margin-top: 6px; padding: 6px 8px; background: #0d1b2a; border-radius: 3px; font-family: monospace; font-size: 10.5px; white-space: pre-wrap; color: #a8cc8c; }
  .mod-reuse-row.expanded .mod-reuse-recommendation { display: block; }

  /* Blast radius — answers "what would a single terraform apply destroy?".
     SRE/oncall view; uses the same DAG as the attack graph. */
  #blast-radius-section { padding: 10px 14px; border-bottom: 1px solid #0f3460; background: #0f1a2e; }
  #blast-radius-section .section-title { font-size: 11px; font-weight: 600; color: #a0a0c0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .blast-row { display: flex; gap: 8px; font-size: 11px; padding: 3px 0; align-items: center; }
  .blast-radius-bar { background: #1a2a4e; height: 14px; border-radius: 2px; flex: 1; position: relative; overflow: hidden; }
  .blast-radius-fill { background: linear-gradient(90deg, #fef3c7, #fb923c, #ef4444); height: 100%; border-radius: 2px; transition: width 0.3s ease; }
  .blast-radius-count { font-family: monospace; font-size: 11px; color: #fbbf24; font-weight: 600; min-width: 28px; text-align: right; }
  .blast-row .blast-resource { font-family: monospace; font-size: 10.5px; color: #e0e0e0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Collapsed group for non-MOD-REUSE INFO findings (style/format/etc). */
  #info-group-section { padding: 10px 14px; border-top: 1px solid #0f3460; background: #0f1a2e; cursor: pointer; }
  #info-group-section .section-title { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  #info-group-list { display: none; padding: 6px 14px 8px; background: #0d1626; }
  #info-group-section.expanded + #info-group-list { display: block; }
  .info-row { font-size: 11px; padding: 4px 0; color: #888; font-family: monospace; }

  .INFO { background: #1a2e1a; color: #6bbf84; }
</style>
</head>
<body>
<header>
  <h1>tf-analyze</h1>
  <span>Terraform security scanner — live demo</span>
</header>
<div id="main">
  <div class="panel" id="editor-panel">
    <div class="panel-header">
      <span>HCL Editor</span>
      <button class="secondary" onclick="loadExample()">Load example</button>
    </div>
    <div class="panel-body">
      <div id="editor-container"><textarea id="editor"></textarea></div>
    </div>
    <div id="controls">
      <input id="repo-input" type="text" placeholder="…or enter a GitHub/GitLab repo URL">
      <button onclick="scanHcl()">Scan HCL</button>
      <button class="secondary" onclick="scanRepo()">Scan Repo</button>
    </div>
  </div>
  <div class="panel" id="findings-panel">
    <div class="panel-header">
      <span>Findings</span>
      <span id="status">paste HCL or enter a repo URL</span>
    </div>
    <div class="panel-body">
      <div id="score-banner" style="display:none"></div>
      <div id="top-fixes-section" style="display:none"></div>
      <div id="blast-radius-section" style="display:none"></div>
      <div id="module-reuse-section" style="display:none"></div>
      <div id="findings-list"><div id="empty-state">Run a scan to see findings</div></div>
      <div id="info-group-section" style="display:none" onclick="this.classList.toggle('expanded')">
        <span class="section-title">▸ <span id="info-count">0</span> INFO findings (style / format)</span>
      </div>
      <div id="info-group-list" style="display:none"></div>
    </div>
  </div>
  <div class="panel" id="graph-panel">
    <div class="panel-header"><span>Attack Graph</span></div>
    <div class="panel-body" style="position:relative">
      <svg id="graph-svg">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="14" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2a2a4a"/>
          </marker>
          <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="14" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#e94560"/>
          </marker>
        </defs>
        <g id="graph-root"></g>
      </svg>
    </div>
  </div>
</div>
<script>
// Default example exercises all four panels in one scan:
//   • Score banner + top-fixes — populated from --explain-score
//   • Module-reuse advisor     — 5 supporting types match terraform-aws-modules/vpc/aws
//   • Attack graph             — internet → SG → EC2 → S3 kill chain
//   • Findings list            — SSH 0.0.0.0/0, public EC2, unencrypted S3
const EXAMPLE_HCL = `resource "aws_vpc" "main" {
  cidr_block = "10.0.0.0/16"
}

resource "aws_subnet" "public" {
  vpc_id                  = aws_vpc.main.id
  cidr_block              = "10.0.1.0/24"
  map_public_ip_on_launch = true
}

resource "aws_subnet" "private" {
  vpc_id     = aws_vpc.main.id
  cidr_block = "10.0.2.0/24"
}

resource "aws_internet_gateway" "main" {
  vpc_id = aws_vpc.main.id
}

resource "aws_route_table" "public" {
  vpc_id = aws_vpc.main.id
  route {
    cidr_block = "0.0.0.0/0"
    gateway_id = aws_internet_gateway.main.id
  }
}

resource "aws_route_table_association" "public" {
  subnet_id      = aws_subnet.public.id
  route_table_id = aws_route_table.public.id
}

resource "aws_security_group" "web" {
  name   = "web"
  vpc_id = aws_vpc.main.id
  ingress {
    from_port   = 22
    to_port     = 22
    protocol    = "tcp"
    cidr_blocks = ["0.0.0.0/0"]
  }
}

resource "aws_instance" "web" {
  ami                         = "ami-0c55b159cbfafe1f0"
  instance_type               = "t3.micro"
  subnet_id                   = aws_subnet.public.id
  vpc_security_group_ids      = [aws_security_group.web.id]
  associate_public_ip_address = true
}

resource "aws_s3_bucket" "data" {
  bucket        = "demo-data"
  force_destroy = true
}`;

const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
  mode: 'null', lineNumbers: true, theme: 'default', lineWrapping: true,
});
editor.setValue(EXAMPLE_HCL);

function loadExample() { editor.setValue(EXAMPLE_HCL); }

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = cls || '';
}

async function scanHcl() {
  setStatus('Scanning…', 'loading');
  try {
    const resp = await fetch('/scan/hcl', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ hcl: editor.getValue() }),
    });
    if (!resp.ok) { const e = await resp.json(); setStatus('Error: ' + e.detail, 'error'); return; }
    const data = await resp.json();
    renderScanResult(data);
    setStatus((data.findings?.length ?? 0) + ' finding(s)', 'success');
  } catch(e) { setStatus('Request failed: ' + e.message, 'error'); }
}

async function scanRepo() {
  const url = document.getElementById('repo-input').value.trim();
  if (!url) { setStatus('Enter a repo URL first', 'error'); return; }
  setStatus('Cloning & scanning…', 'loading');
  try {
    const resp = await fetch('/scan/repo', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ repo: url }),
    });
    if (!resp.ok) { const e = await resp.json(); setStatus('Error: ' + e.detail, 'error'); return; }
    const data = await resp.json();
    renderScanResult(data);
    setStatus((data.findings?.length ?? 0) + ' finding(s)', 'success');
  } catch(e) { setStatus('Request failed: ' + e.message, 'error'); }
}

// Top-level renderer: route the engine's JSON to four sections that read
// the same scan output — score banner, top-fixes, module-reuse, and the
// regular findings list. INFO findings that aren't MOD-REUSE collapse
// into the bottom group so they don't drown out the actionable items.
function renderScanResult(data) {
  renderGraph(data.graph ?? {nodes:[], edges:[]});
  const findings = data.findings ?? [];
  const summary = data.summary ?? {};
  const explanation = data.score_explanation ?? {};
  renderScoreBanner(summary);
  renderTopFixes(explanation.top ?? []);
  renderBlastRadius(data.blast_radius ?? []);
  // Module-reuse findings carry urgency=LOW but live in their own section.
  // INFO is reserved for style/format hints; collapse those so they don't
  // crowd the actionable security findings.
  const isModuleReuse = f => (f.id||'').startsWith('MOD-REUSE-');
  const moduleReuse = findings.filter(isModuleReuse);
  const otherInfo = findings.filter(f => f.urgency === 'INFO' && !isModuleReuse(f));
  const regular = findings.filter(f => f.urgency !== 'INFO' && !isModuleReuse(f));
  renderModuleReuse(moduleReuse);
  renderRegularFindings(regular);
  renderInfoGroup(otherInfo);
}

function renderScoreBanner(summary) {
  const el = document.getElementById('score-banner');
  if (typeof summary.score !== 'number' || !summary.grade) { el.style.display = 'none'; return; }
  const gradeClass = 'grade-' + (summary.grade || 'unknown');
  const counts = summary.counts || {};
  const countParts = ['CRITICAL','HIGH','MEDIUM','LOW'].filter(t => counts[t]).map(t => `<b>${counts[t]}</b> ${t}`);
  const countLine = countParts.length ? countParts.join(' · ') : 'no findings at default tiers';
  el.style.display = 'block';
  el.innerHTML = `
    <div class="score-row">
      <span class="score-num ${gradeClass}">${summary.score}</span>
      <span class="score-grade ${gradeClass}">(${summary.grade})</span>
    </div>
    <div class="score-counts">${countLine}</div>`;
}

function renderTopFixes(top) {
  const el = document.getElementById('top-fixes-section');
  if (!top.length) { el.style.display = 'none'; return; }
  const rows = top.slice(0, 5).map(t => `
    <div class="top-fix-row">
      <span class="top-fix-rank">#${t.rank}</span>
      <span class="top-fix-id">${t.id}</span>
      <span class="top-fix-delta">→ ${t.projected_score} (${t.projected_grade})</span>
    </div>`).join('');
  el.style.display = 'block';
  el.innerHTML = `<div class="section-title">Top fixes by score impact</div>${rows}`;
}

function renderBlastRadius(top) {
  const el = document.getElementById('blast-radius-section');
  if (!top.length) { el.style.display = 'none'; return; }
  const max = Math.max(...top.map(r => r.blast_radius), 1);
  el.style.display = 'block';
  el.innerHTML = `<div class="section-title">🌊 Blast radius — what one apply could touch</div>` +
    top.slice(0, 5).map(r => {
      const pct = Math.round((r.blast_radius / max) * 100);
      const flag = r.is_crown_jewel ? ' 💎' : r.internet_reachable ? ' 🌐' : '';
      return `
      <div class="blast-row" title="${r.resource} affects ${r.blast_radius} downstream resource(s)">
        <span class="blast-resource">${r.resource.split('.').slice(-1)[0]}${flag}</span>
        <span class="blast-radius-bar"><span class="blast-radius-fill" style="width:${pct}%"></span></span>
        <span class="blast-radius-count">${r.blast_radius}</span>
      </div>`;
    }).join('');
}

function renderModuleReuse(findings) {
  const el = document.getElementById('module-reuse-section');
  if (!findings.length) { el.style.display = 'none'; return; }
  const esc = s => String(s||'').replace(/</g,'&lt;');
  el.style.display = 'block';
  el.innerHTML = `<div class="section-title">📦 Module reuse — ${findings.length} suggestion(s)</div>` +
    findings.map(f => {
      const roi = f.roi || {};
      const roiLine = roi.lines_saved
        ? `Save ${roi.lines_saved} lines (${roi.pct_saved}% reduction) by replacing ${roi.bespoke_lines}-line bespoke stack with ${roi.replacement_lines}-line module call.`
        : '';
      const link = f.registry_url
        ? `<a href="${esc(f.registry_url)}" target="_blank" rel="noopener" style="color:#6bbf84">Open module on registry ↗</a>`
        : '';
      return `
      <div class="mod-reuse-row" onclick="this.classList.toggle('expanded')">
        <div class="mod-reuse-id">${esc(f.id)} · confidence: ${esc(f.confidence||'?')}</div>
        <div class="mod-reuse-title">${esc(f.title||'')}</div>
        ${roiLine ? `<div class="mod-reuse-suggestion"><b>${esc(roiLine)}</b></div>` : ''}
        ${link ? `<div class="mod-reuse-suggestion">${link}</div>` : ''}
        ${f.recommendation ? `<div class="mod-reuse-recommendation">${esc(f.recommendation)}</div>` : ''}
      </div>`;
    }).join('');
}

function renderRegularFindings(findings) {
  const list = document.getElementById('findings-list');
  if (!findings.length) {
    list.innerHTML = '<div id="empty-state" style="color:#86efac">✓ No findings at default tiers — configuration looks good!</div>';
    return;
  }
  list.innerHTML = findings.map(f => `
    <div class="finding-row" onclick="this.classList.toggle('expanded')">
      <div class="finding-header">
        <span class="badge ${f.urgency}">${f.urgency}</span>
        <span class="finding-title">${f.id} — ${f.title || ''}</span>
        <span class="finding-location">${(f.file||'').split('/').pop()}:${f.line||''}</span>
      </div>
      ${f.fix_hcl ? `<div class="finding-fix">${f.fix_hcl.replace(/</g,'&lt;')}</div>` : ''}
    </div>
  `).join('');
}

function renderInfoGroup(findings) {
  const sec = document.getElementById('info-group-section');
  const list = document.getElementById('info-group-list');
  if (!findings.length) { sec.style.display = 'none'; list.style.display = 'none'; return; }
  sec.style.display = 'block';
  list.style.display = '';  // controlled via .expanded sibling rule
  document.getElementById('info-count').textContent = findings.length;
  list.innerHTML = findings.map(f =>
    `<div class="info-row">${f.id} — ${(f.title||'').slice(0,60)}</div>`
  ).join('');
}

const COLOR = {compute:'#4A90D9',storage:'#E8A838',iam:'#D4A017',network:'#7B9EA6',key:'#6BBF84',secret:'#6BBF84',internet:'#e94560',unknown:'#888'};

function renderGraph(graph) {
  const svgEl = document.getElementById('graph-svg');
  const W = svgEl.clientWidth || 600, H = svgEl.clientHeight || 500;
  const root = d3.select('#graph-root');
  root.selectAll('*').remove();

  if (!graph.nodes?.length) return;

  const nodes = graph.nodes.map(n => ({...n}));
  // Engine emits {from,to,label}; d3.forceLink resolves {source,target}.id
  const edges = graph.edges.map(e => ({...e, source: e.from, target: e.to}));

  const svg = d3.select('#graph-svg');
  const zoom = d3.zoom().scaleExtent([0.1,4]).on('zoom', e => root.attr('transform', e.transform));
  svg.call(zoom);

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id).distance(100))
    .force('charge', d3.forceManyBody().strength(-250))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collide', d3.forceCollide(28));

  const link = root.append('g').selectAll('line').data(edges).join('line')
    .attr('class', d => 'link' + (d.label === 'critical' ? ' critical' : ''));

  const node = root.append('g').selectAll('g').data(nodes).join('g').attr('class','node')
    .call(d3.drag()
      .on('start',(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',(e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on('end',(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  // Scale node radius by blast radius so the SRE eye lands on the
  // resources whose destruction would cascade furthest. Capped so a
  // single mega-blast doesn't dwarf everything else.
  const maxBlast = Math.max(1, ...nodes.map(n => n.blast_radius || 0));
  node.each(function(d) {
    const g = d3.select(this);
    const base = d.is_crown_jewel ? 14 : 9;
    const blastBonus = Math.round(((d.blast_radius || 0) / maxBlast) * 6);
    const r = base + blastBonus;
    const c = COLOR[d.type]||COLOR.unknown;
    if (d.internet_reachable) g.append('circle').attr('r',r+5).attr('fill','none').attr('stroke',c).attr('stroke-width',1.5).attr('stroke-dasharray','4,3').attr('class','inet-ring');
    if (d.is_crown_jewel) g.append('circle').attr('r',r+3).attr('fill','none').attr('stroke','#b8860b').attr('stroke-width',1.5);
    g.append('circle').attr('r',r).attr('fill',c).attr('stroke',d.on_critical_path?'#e94560':'#1a1a2e').attr('stroke-width',d.on_critical_path?2:1);
    g.append('text').text(d.label.split('.').pop()).attr('dy',r+11).attr('text-anchor','middle');
  });

  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
}
</script>
</body>
</html>
