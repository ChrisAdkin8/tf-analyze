  <!-- ══════════════════════════════════════════════════════════
       FOREGROUND — full-width layout: x=40 … x=1240
       Title + tagline left-aligned; icon right of title.
       ══════════════════════════════════════════════════════════ -->

  <!-- ── HCL magnifying glass — right of title ──
       Positioned at x=830 so the icon sits alongside the title text.
       viewBox="65 40 280 280" crops the 400×400 icon to lens+handle.
       At 260×260 the lens centre lands at ≈(955, 148) in banner coords. -->
  <svg x="830" y="18" width="260" height="260"
       viewBox="65 40 280 280" overflow="visible">
    <defs>
      <linearGradient id="v2-rim" x1="15%" y1="10%" x2="85%" y2="90%">
        <stop offset="0%" stop-color="#C4A0F5"/>
        <stop offset="50%" stop-color="#7B42BC"/>
        <stop offset="100%" stop-color="#3D1F6E"/>
      </linearGradient>
      <linearGradient id="v2-handle" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#9B5DE5"/>
        <stop offset="100%" stop-color="#2E1260"/>
      </linearGradient>
      <radialGradient id="v2-lens" cx="38%" cy="33%" r="65%">
        <stop offset="0%" stop-color="#0F0C1E"/>
        <stop offset="100%" stop-color="#080812"/>
      </radialGradient>
      <filter id="v2-bloom" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="22"/>
      </filter>
      <filter id="v2-glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="v2-txt" x="-18%" y="-55%" width="136%" height="210%">
        <feGaussianBlur stdDeviation="3.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <clipPath id="v2-clip">
        <circle cx="200" cy="178" r="113"/>
      </clipPath>
    </defs>

    <!-- Handle -->
    <line x1="292" y1="270" x2="378" y2="356"
          stroke="url(#v2-handle)" stroke-width="24" stroke-linecap="round"/>
    <line x1="289" y1="267" x2="371" y2="349"
          stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.16"/>

    <!-- Rim bloom + body -->
    <circle cx="200" cy="178" r="134" fill="#9B5DE5" opacity="0.20" filter="url(#v2-bloom)"/>
    <circle cx="200" cy="178" r="130" fill="url(#v2-rim)"/>
    <circle cx="200" cy="178" r="120" fill="none"
            stroke="rgba(220,196,255,0.20)" stroke-width="2"/>

    <!-- Lens interior -->
    <circle cx="200" cy="178" r="112" fill="url(#v2-lens)"/>

