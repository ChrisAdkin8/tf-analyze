<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shield-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Subtle background grid lines -->
  <line x1="0" y1="43" x2="128" y2="43" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="85" x2="128" y2="85" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="43" y1="0" x2="43" y2="128" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="85" y1="0" x2="85" y2="128" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Shield body -->
  <path d="M64 14 L97 29 L97 63 Q97 91 64 111 Q31 91 31 63 L31 29 Z"
        fill="url(#shield-fill)"/>

  <!-- Shield inner edge highlight -->
  <path d="M64 18 L93 31.5 L93 63 Q93 88.5 64 107 Q35 88.5 35 63 L35 31.5 Z"
        fill="none" stroke="rgba(167,139,250,0.35)" stroke-width="1.5"/>

  <!-- Magnifying glass — circle -->
  <circle cx="57" cy="56" r="17" fill="none" stroke="white" stroke-width="5"
          opacity="0.95" filter="url(#glow)"/>

  <!-- Magnifying glass — handle -->
  <line x1="69" y1="68" x2="84" y2="83" stroke="white" stroke-width="5.5"
        stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>

  <!-- Code analysis lines inside magnifying glass -->
  <line x1="48" y1="51" x2="61" y2="51" stroke="rgba(196,181,253,0.85)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="57" x2="65" y2="57" stroke="rgba(196,181,253,0.85)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="63" x2="57" y2="63" stroke="rgba(196,181,253,0.85)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Small check badge bottom-right of shield — indicates "pass/fail" analysis -->
  <circle cx="87" cy="92" r="11" fill="#059669"/>
  <polyline points="82,92 86,97 93,87" fill="none" stroke="white" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
