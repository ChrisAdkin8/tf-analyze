<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="1380" viewBox="0 0 900 1380">
  <style>
    .h     { font: 700 26px Helvetica, Arial, sans-serif; fill: #18181b; }
    .sub   { font: 400 14px Helvetica, Arial, sans-serif; fill: #71717a; }
    .badge { font: 700 11px Helvetica, Arial, sans-serif; fill: #71717a; letter-spacing: 1.2px; }
    .badge.cur { fill: #d97706; }
    .lbl   { font: 700 16px Helvetica, Arial, sans-serif; fill: #18181b; }
    .desc  { font: 400 12px Helvetica, Arial, sans-serif; fill: #52525b; }
  </style>

  <rect width="900" height="1380" fill="#f4f4f5"/>

  <text x="40" y="40" class="h">tf-analyze · icon mockups</text>
  <text x="40" y="62" class="sub">9 directions; magnifying glass preserved in all. Top-left shows the current icon for comparison.</text>

  <!-- Row 0: Current icon (full width, centred) -->
  <g transform="translate(40, 90)">
    <rect width="820" height="220" rx="12" fill="#fafafa" stroke="#a1a1aa" stroke-width="2"/>
    <text x="20" y="28" class="badge cur">CURRENT</text>
    <image x="20" y="40" width="160" height="160" xlink:href="current.png"/>
    <text x="200" y="80" class="lbl">Shield + magnifying glass + green check</text>
    <text x="200" y="104" class="desc">Three competing elements on a dark navy tile. At 16px in the activity bar,</text>
    <text x="200" y="120" class="desc">the shield silhouette wins — the magnifier and check both disappear.</text>
    <text x="200" y="148" class="desc">Strengths: recognisable purple, signals "security".</text>
    <text x="200" y="164" class="desc">Weaknesses: busy; not obviously Terraform-related; check badge implies a passing scan</text>
    <text x="200" y="180" class="desc">(actually we want to advertise that we *find* issues).</text>
  </g>

  <!-- Mockup grid: 3 cols × 3 rows starting at y=340. Cell 280w × 320h, padding 10 -->

  <!-- Row 1 -->
  <g transform="translate(40, 340)">
    <rect width="260" height="300" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="16" y="24" class="badge">OPTION 1</text>
    <image x="2" y="36" width="256" height="180" xlink:href="01-t-handle.png"/>
    <text x="130" y="244" class="lbl" text-anchor="middle">T-shaped handle</text>
    <text x="130" y="266" class="desc" text-anchor="middle">Handle is a T-form.</text>
    <text x="130" y="282" class="desc" text-anchor="middle">Instant Terraform recognition.</text>
  </g>
  <g transform="translate(320, 340)">
    <rect width="260" height="300" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="16" y="24" class="badge">OPTION 2</text>
    <image x="2" y="36" width="256" height="180" xlink:href="02-braces.png"/>
    <text x="130" y="244" class="lbl" text-anchor="middle">HCL braces in lens</text>
    <text x="130" y="266" class="desc" text-anchor="middle">"We analyse HCL."</text>
    <text x="130" y="282" class="desc" text-anchor="middle">Reads at every size.</text>
  </g>
  <g transform="translate(600, 340)">
    <rect width="260" height="300" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="16" y="24" class="badge">OPTION 3</text>
    <image x="2" y="36" width="256" height="180" xlink:href="03-warning.png"/>
    <text x="130" y="244" class="lbl" text-anchor="middle">Warning revealed</text>
    <text x="130" y="266" class="desc" text-anchor="middle">"We surface what's hidden."</text>
    <text x="130" y="282" class="desc" text-anchor="middle">Strongest value-prop.</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40, 660)">
    <rect width="260" height="300" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="16" y="24" class="badge">OPTION 4</text>
    <image x="2" y="36" width="256" height="180" xlink:href="04-grade.png"/>
    <text x="130" y="244" class="lbl" text-anchor="middle">Letter grade A</text>
    <text x="130" y="266" class="desc" text-anchor="middle">Shows the risk-grade output.</text>
    <text x="130" y="282" class="desc" text-anchor="middle">Maps directly to product.</text>
  </g>
  <g transform="translate(320, 660)">
    <rect width="260" height="300" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="16" y="24" class="badge">OPTION 5</text>
    <image x="2" y="36" width="256" height="180" xlink:href="05-iceberg.png"/>
    <text x="130" y="244" class="lbl" text-anchor="middle">Iceberg under lens</text>
    <text x="130" y="266" class="desc" text-anchor="middle">"Hidden risks beneath plan."</text>
    <text x="130" y="282" class="desc" text-anchor="middle">Most evocative; busiest at 16px.</text>
  </g>
  <g transform="translate(600, 660)">
    <rect width="260" height="300" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="16" y="24" class="badge">OPTION 6</text>
    <image x="2" y="36" width="256" height="180" xlink:href="06-graph.png"/>
    <text x="130" y="244" class="lbl" text-anchor="middle">Attack graph</text>
    <text x="130" y="266" class="desc" text-anchor="middle">3 nodes + a compromised one.</text>
    <text x="130" y="282" class="desc" text-anchor="middle">Leans on a differentiator.</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(40, 980)">
    <rect width="260" height="300" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="16" y="24" class="badge">OPTION 7</text>
    <image x="2" y="36" width="256" height="180" xlink:href="07-cube.png"/>
    <text x="130" y="244" class="lbl" text-anchor="middle">Iso cube + finding</text>
    <text x="130" y="266" class="desc" text-anchor="middle">Cube = infrastructure;</text>
    <text x="130" y="282" class="desc" text-anchor="middle">red dot = finding.</text>
  </g>
  <g transform="translate(320, 980)">
    <rect width="260" height="300" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="16" y="24" class="badge">OPTION 8</text>
    <image x="2" y="36" width="256" height="180" xlink:href="08-radar.png"/>
    <text x="130" y="244" class="lbl" text-anchor="middle">Radar rings</text>
    <text x="130" y="266" class="desc" text-anchor="middle">Concentric scan + red blip.</text>
    <text x="130" y="282" class="desc" text-anchor="middle">Abstract; ages well.</text>
  </g>
  <g transform="translate(600, 980)">
    <rect width="260" height="300" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="16" y="24" class="badge">OPTION 9</text>
    <image x="2" y="36" width="256" height="180" xlink:href="09-tf-wordmark.png"/>
    <text x="130" y="244" class="lbl" text-anchor="middle">"tf" wordmark + lens</text>
    <text x="130" y="266" class="desc" text-anchor="middle">Lens scans the wordmark.</text>
    <text x="130" y="282" class="desc" text-anchor="middle">Most distinctive at 128px.</text>
  </g>

  <text x="450" y="1340" class="sub" text-anchor="middle">Recommendation: Option 1 (T-handle) or Option 4 (grade A) — both keep clean silhouettes at 16px.</text>
</svg>
