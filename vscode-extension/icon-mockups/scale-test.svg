<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="620" viewBox="0 0 900 620">
  <style>
    .h    { font: 700 24px Helvetica, Arial, sans-serif; fill: #18181b; }
    .sub  { font: 400 13px Helvetica, Arial, sans-serif; fill: #71717a; }
    .row  { font: 700 14px Helvetica, Arial, sans-serif; fill: #18181b; }
    .px   { font: 400 11px Helvetica, Arial, sans-serif; fill: #a1a1aa; }
    .px-d { font: 400 11px Helvetica, Arial, sans-serif; fill: #71717a; }
    .hdr  { font: 700 11px Helvetica, Arial, sans-serif; fill: #52525b; letter-spacing: 1px; }
  </style>

  <rect width="900" height="620" fill="#f4f4f5"/>

  <text x="40" y="36" class="h">Scale-stress test</text>
  <text x="40" y="58" class="sub">Each row: 128px (marketplace) · 64px · 32px (sidebar) · 16px (activity bar) on VS Code dark.</text>

  <!-- Column headers -->
  <text x="270" y="92" class="hdr" text-anchor="middle">128 PX</text>
  <text x="420" y="92" class="hdr" text-anchor="middle">64 PX</text>
  <text x="540" y="92" class="hdr" text-anchor="middle">32 PX</text>
  <text x="640" y="92" class="hdr" text-anchor="middle">16 PX</text>

  <!-- Dark strip for all sizes (full row) -->
  <!-- Each row: y_base, dark strip from x=180 to x=720, height 130 -->

  <!-- ROW: Current -->
  <g transform="translate(0, 110)">
    <text x="40" y="68" class="row">Current</text>
    <text x="40" y="86" class="sub">shield+glass+check</text>
    <rect x="180" y="0" width="560" height="130" rx="8" fill="#1e1e1e"/>
    <image x="200" y="1" width="128" height="128" xlink:href="current.png"/>
    <image x="388" y="33" width="64"  height="64"  xlink:href="current.png"/>
    <image x="524" y="49" width="32"  height="32"  xlink:href="current.png"/>
    <image x="632" y="57" width="16"  height="16"  xlink:href="current.png"/>
  </g>

  <!-- ROW: Option 1 T-handle -->
  <g transform="translate(0, 250)">
    <text x="40" y="68" class="row">Option 1</text>
    <text x="40" y="86" class="sub">T-shaped handle</text>
    <rect x="180" y="0" width="560" height="130" rx="8" fill="#1e1e1e"/>
    <image x="200" y="1" width="128" height="128" xlink:href="01-t-handle.png"/>
    <image x="388" y="33" width="64"  height="64"  xlink:href="01-t-handle.png"/>
    <image x="524" y="49" width="32"  height="32"  xlink:href="01-t-handle.png"/>
    <image x="632" y="57" width="16"  height="16"  xlink:href="01-t-handle.png"/>
  </g>

  <!-- ROW: Option 3 Warning -->
  <g transform="translate(0, 390)">
    <text x="40" y="68" class="row">Option 3</text>
    <text x="40" y="86" class="sub">warning revealed</text>
    <rect x="180" y="0" width="560" height="130" rx="8" fill="#1e1e1e"/>
    <image x="200" y="1" width="128" height="128" xlink:href="03-warning.png"/>
    <image x="388" y="33" width="64"  height="64"  xlink:href="03-warning.png"/>
    <image x="524" y="49" width="32"  height="32"  xlink:href="03-warning.png"/>
    <image x="632" y="57" width="16"  height="16"  xlink:href="03-warning.png"/>
  </g>

  <!-- ROW: Option 4 Grade A -->
  <g transform="translate(0, 530)">
    <text x="40" y="48" class="row">Option 4</text>
    <text x="40" y="66" class="sub">letter grade A</text>
    <rect x="180" y="-20" width="560" height="80" rx="8" fill="#1e1e1e"/>
    <image x="200" y="-20" width="80" height="80" xlink:href="04-grade.png"/>
    <image x="388" y="-4"  width="48" height="48" xlink:href="04-grade.png"/>
    <image x="524" y="14"  width="24" height="24" xlink:href="04-grade.png"/>
    <image x="632" y="22"  width="16" height="16" xlink:href="04-grade.png"/>
  </g>
</svg>
