# Fly.io app config for the tf-analyze badge service.
# Operator deploys with:
#   cd integrations/badge-service
#   flyctl launch --copy-config --no-deploy
#   flyctl secrets set TFA_BADGE_INGEST_SECRET=<32+ random bytes>
#   flyctl deploy

app = "tf-analyze-badge"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
