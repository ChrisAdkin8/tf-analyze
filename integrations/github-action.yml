name: tf-analyze

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
  push:
    branches: [main, master]
    paths:
      - "**/*.tf"

  workflow_dispatch:
    inputs:
      post-pr-comment:
        description: "Post findings as a PR comment (for manual trigger on a PR branch)"
        required: false
        default: "true"

inputs:
  fail-on:
    description: 'Minimum urgency level to fail CI (CRITICAL, HIGH, MEDIUM, LOW)'
    default: 'HIGH'
  section:
    description: 'Restrict findings to a catalogue section (security, robustness, ops, …). Empty = all.'
    default: ''
  post-pr-comment:
    description: 'Post PR suggestion comments on pull_request events'
    default: 'true'

permissions:
  contents: read
  security-events: write  # for SARIF upload
  pull-requests: write    # for PR comment

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff-mode base detection

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch tf-analyze
        run: |
          git clone --depth 1 https://github.com/anthropics/claude-code-skills \
            /tmp/tf-analyze-skill
          ln -s /tmp/tf-analyze-skill/tf-analyze ~/.tf-analyze

      - name: Run tf-analyze
        id: analyze
        run: |
          MODE=static
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE=diff
          fi
          SECTION_ARG=""
          if [ -n "${{ inputs.section }}" ]; then
            SECTION_ARG="--section ${{ inputs.section }}"
          fi
          FAIL_ON="${{ inputs.fail-on || 'HIGH' }}"
          # Write JSON for suggestion-block step and exit-code evaluation
          python3 ~/.tf-analyze/scripts/detect.py \
            --target . \
            --mode "$MODE" \
            --format json \
            $SECTION_ARG \
            > tf-analyze-findings.json 2>tf-analyze-stderr.txt || true
          # Write SARIF for Code Scanning (enterprise/paid orgs)
          python3 ~/.tf-analyze/scripts/detect.py \
            --target . \
            --mode "$MODE" \
            --format sarif \
            $SECTION_ARG \
            > tf-analyze.sarif 2>/dev/null || true
          # Determine exit code based on fail-on threshold
          python3 -c "
          import json, sys
          d = json.load(open('tf-analyze-findings.json'))
          findings = d.get('findings', d if isinstance(d, list) else [])
          rank = {'CRITICAL': 4, 'HIGH': 3, 'MEDIUM': 2, 'LOW': 1, 'INFO': 0}
          threshold = rank.get('${FAIL_ON}', 3)
          breach = [f for f in findings if rank.get(f.get('urgency',''), 0) >= threshold]
          print(f'finding_count={len(findings)}')
          sys.exit(1 if breach else 0)
          " | tee -a \$GITHUB_OUTPUT

      - name: Upload SARIF to Code Scanning
        if: always()
        continue-on-error: true   # free-tier repos lack Code Scanning; don't fail the job
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tf-analyze.sarif
          category: tf-analyze

      - name: Post PR suggestion comments
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          (inputs.post-pr-comment != 'false')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            try {
              const raw = JSON.parse(fs.readFileSync('tf-analyze-findings.json', 'utf8'));
              findings = raw.findings ?? (Array.isArray(raw) ? raw : []);
            } catch(e) {
              core.warning('Could not read tf-analyze-findings.json: ' + e.message);
            }

            const changedFiles = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const changedPaths = new Set(changedFiles.data.map(f => f.filename));

            function urgencyRank(u) {
              return { CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1, INFO: 0 }[u] ?? 0;
            }
            const URGENCY_EMOJI = { CRITICAL: '🚨', HIGH: '⚠️', MEDIUM: '💡', LOW: 'ℹ️' };

            // Deduplicate: one comment per (file, line) using highest-urgency finding
            const byLocation = new Map();
            for (const f of findings) {
              if (!f.fix_hcl) continue;
              const key = `${f.file}:${f.line}`;
              const existing = byLocation.get(key);
              if (!existing || urgencyRank(f.urgency) > urgencyRank(existing.urgency)) {
                byLocation.set(key, f);
              }
            }

            let suggestionsPosted = 0;
            for (const [, finding] of byLocation) {
              if (!changedPaths.has(finding.file)) continue;
              const emoji = URGENCY_EMOJI[finding.urgency] ?? '•';
              const disruption = finding.fix_disruption ? ` · Disruption: \`${finding.fix_disruption}\`` : '';
              const body = [
                `${emoji} **[${finding.id}]** — ${finding.title}`,
                '',
                `> Urgency: \`${finding.urgency}\`${disruption}`,
                '',
                '```suggestion',
                finding.fix_hcl.trimEnd(),
                '```',
              ].join('\n');
              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  body,
                  path: finding.file,
                  line: finding.line,
                  side: 'RIGHT',
                });
                suggestionsPosted++;
              } catch (e) {
                core.warning(`Could not post suggestion for ${finding.id} at ${finding.file}:${finding.line}: ${e.message}`);
              }
            }

            // Summary comment (upserted)
            const critical = findings.filter(f => f.urgency === 'CRITICAL').length;
            const high = findings.filter(f => f.urgency === 'HIGH').length;
            const medium = findings.filter(f => f.urgency === 'MEDIUM').length;
            const summaryBody = findings.length === 0
              ? '✅ **tf-analyze**: no findings above threshold'
              : [
                  '## tf-analyze findings',
                  '',
                  '| Urgency | Count |',
                  '|---------|-------|',
                  `| 🚨 CRITICAL | ${critical} |`,
                  `| ⚠️ HIGH | ${high} |`,
                  `| 💡 MEDIUM | ${medium} |`,
                  '',
                  suggestionsPosted > 0
                    ? `${suggestionsPosted} finding(s) have inline suggestion fixes — click **Apply suggestion** to fix in one click.`
                    : '_No inline suggestions available for changed files._',
                ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const prior = comments.data.find(c =>
              c.body.startsWith('## tf-analyze findings') || c.body.startsWith('✅ **tf-analyze**')
            );
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: prior.id, body: summaryBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body: summaryBody,
              });
            }

      - name: Generate HTML report
        if: always()
        run: |
          python3 ~/.tf-analyze/scripts/detect.py \
            --target . \
            --format html > tf-analyze-report.html

      - name: Upload HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-analyze-report
          path: tf-analyze-report.html
          retention-days: 30
