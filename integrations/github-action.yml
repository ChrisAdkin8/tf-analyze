name: tf-analyze

on:
  pull_request:
    # `edited` re-runs the scan when the PR's base branch changes: the
    # config below comes from the base, so a pass against one base must not
    # stand once the PR targets another.
    types: [opened, synchronize, reopened, edited]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
  push:
    branches: [main, master]
    paths:
      - "**/*.tf"

  # A workflow has no top-level `inputs:`; these only take effect on a
  # manual run. On push / pull_request every `inputs.*` is empty, so each
  # use below falls back to the same default with `||`.
  workflow_dispatch:
    inputs:
      fail-on:
        description: 'Minimum urgency level to fail CI (CRITICAL, HIGH, MEDIUM, LOW)'
        default: 'HIGH'
      section:
        description: 'Restrict findings to a catalogue section (security, robustness, ops, …). Empty = all.'
        default: ''
      compliance-framework:
        description: 'Optional. cis | pci_dss | soc2 | owasp_iac | all. When set, the engine also runs a compliance gap report and the PR comment gains a collapsible compliance section.'
        default: ''
      attack-graph:
        description: 'Build the internet → crown-jewels attack graph; promotes critical-path findings and embeds the Mermaid graph in the PR summary.'
        default: 'false'
      show-info:
        description: 'Include INFO-tier advisories (Module Reuse, etc.) in findings. Default false.'
        default: 'false'
      ref:
        description: 'Git ref of tf-analyze to install (tag, branch, or SHA). Defaults to a release tag so CI is reproducible.'
        default: 'v0.2.6'
      post-pr-comment:
        description: 'Post PR suggestion comments on pull_request events'
        default: 'true'

permissions:
  contents: read
  security-events: write  # for SARIF upload
  pull-requests: write    # for PR comment

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history for diff-mode base detection

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # A pull request could otherwise switch off its own scan: the engine
      # reads `.tf-analyze.yaml` (rules_dir, ignore_paths) and
      # `.tf-analyze-ignore.yaml` from the checkout, i.e. from the PR. Put
      # the base branch's copies (and its rules_dir) in their place. The
      # scan below also honours an inline `# tf-analyze:ignore` only if the
      # base branch has it (`--inline-ignores-from`, on engines that support
      # it). Works with any engine `ref`, old releases included.
      - name: Use the base branch's tf-analyze config
        if: github.event_name == 'pull_request'
        env:
          TFA_BASE_REF: ${{ github.base_ref }}
        run: |
          # Fetch into a ref of our own: a short name like `origin/main` would
          # resolve to a tag of that name first, and tags can come from a PR.
          BASE=refs/tf-analyze/base
          rm -f .tf-analyze.yaml .tf-analyze-ignore.yaml
          # No stale copy from an earlier run may stand in for a failed fetch.
          git update-ref -d "$BASE" >/dev/null 2>&1 || true
          if ! git fetch --no-tags --depth=1 origin "+refs/heads/${TFA_BASE_REF}:${BASE}"; then
            echo "::warning::tf-analyze: cannot read base branch '${TFA_BASE_REF}'; scanning with no project config and no ignore file"
            exit 0
          fi
          for f in .tf-analyze.yaml .tf-analyze-ignore.yaml; do
            git show "${BASE}:$f" > "$f" 2>/dev/null || rm -f "$f"
          done
          if [ -f .tf-analyze.yaml ]; then
            RULES_DIR="$(sed -n 's/^rules_dir:[[:space:]]*//p' .tf-analyze.yaml \
              | sed 's/[[:space:]]#.*//; s/^["'"'"']//; s/["'"'"'][[:space:]]*$//; s/[[:space:]]*$//' | head -1)"
            RULES_DIR="${RULES_DIR%/}"
            case "$RULES_DIR" in
              ""|/*|..|../*|*/..|*/../*) ;;
              *)
                # The PR controls the checkout: a symlink anywhere on this path
                # would point the rm and the extract outside it.
                P=""
                IFS=/ read -ra PARTS <<< "$RULES_DIR"
                for C in "${PARTS[@]}"; do
                  P="${P:+$P/}$C"
                  if [ -L "$P" ]; then
                    echo "::error::tf-analyze: '$P' in rules_dir is a symlink in this PR; refusing to scan"
                    exit 1
                  fi
                done
                rm -rf -- "$RULES_DIR"
                git archive "$BASE" -- "$RULES_DIR" 2>/dev/null | tar -x 2>/dev/null || true
                ;;
            esac
          fi
          echo "::notice::tf-analyze: using .tf-analyze.yaml and .tf-analyze-ignore.yaml from '${TFA_BASE_REF}', not from this PR"

      # Inputs reach the shell through `env:`, never a template expression
      # in `run:`, so an input value can't inject shell.
      - name: Fetch tf-analyze
        env:
          TFA_REF: ${{ inputs.ref || 'v0.2.6' }}
        run: |
          # Clone the engine itself; pin to a tag/SHA via the `ref` input
          # for reproducible CI. `--depth 1 --branch <ref>` works for
          # branches and tags; SHAs require a full clone.
          REF="$TFA_REF"
          if [[ "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
            git clone https://github.com/ChrisAdkin8/tf-analyze.git ~/.tf-analyze
            git -C ~/.tf-analyze checkout "$REF"
          else
            git clone --depth 1 --branch "$REF" \
              https://github.com/ChrisAdkin8/tf-analyze.git ~/.tf-analyze
          fi

      - name: Run tf-analyze
        id: analyze
        env:
          TFA_EVENT: ${{ github.event_name }}
          TFA_SECTION: ${{ inputs.section }}
          TFA_COMPLIANCE: ${{ inputs.compliance-framework }}
          TFA_ATTACK_GRAPH: ${{ inputs.attack-graph }}
          TFA_SHOW_INFO: ${{ inputs.show-info }}
          FAIL_ON: ${{ inputs.fail-on || 'HIGH' }}
        run: |
          # Without pipefail the gate's exit code is lost in `| tee` below.
          set -o pipefail
          # Pin git to the checkout's own repository. The engine runs git in
          # the scan target, and git would otherwise use a bare repository a
          # PR planted there (its own "base" files, and config that can run
          # commands).
          export GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE="$GITHUB_WORKSPACE"
          MODE=static
          if [ "$TFA_EVENT" = "pull_request" ]; then
            MODE=diff
          fi
          # Collect optional engine flags into a bash array so empty
          # inputs don't leak as bare shell tokens.
          EXTRA_ARGS=()
          if [ -n "$TFA_SECTION" ]; then
            EXTRA_ARGS+=(--focus "$TFA_SECTION")
          fi
          if [ -n "$TFA_COMPLIANCE" ]; then
            EXTRA_ARGS+=(--compliance-framework "$TFA_COMPLIANCE")
          fi
          if [ "$TFA_ATTACK_GRAPH" = "true" ]; then
            EXTRA_ARGS+=(--attack-graph)
          fi
          if [ "$TFA_SHOW_INFO" = "true" ]; then
            EXTRA_ARGS+=(--show-info)
          fi
          # On a PR, honour an inline `# tf-analyze:ignore` only if the base
          # branch (fetched above) has it too, so the PR can't silence its
          # own findings. If that fetch failed, the engine honours none.
          if [ "$TFA_EVENT" = "pull_request" ]; then
            # Not `--help | grep -q`: under pipefail, grep closing the pipe
            # early can fail the pipeline.
            HELP="$(python3 ~/.tf-analyze/scripts/detect.py --help 2>/dev/null || true)"
            case "$HELP" in
              *--inline-ignores-from*)
                EXTRA_ARGS+=(--inline-ignores-from refs/tf-analyze/base) ;;
              *)
                echo "::warning::tf-analyze: this engine ref predates --inline-ignores-from, so inline tf-analyze:ignore comments this PR adds are honoured" ;;
            esac
          fi

          # Reports go to a fresh folder under $RUNNER_TEMP, never the
          # checkout: on a PR the checkout is the PR's, and a symlink it
          # commits as e.g. `tf-analyze.sarif` would send the `>` write
          # wherever it points. Later steps find them via `out-dir`.
          OUT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/tf-analyze-out.XXXXXX")"
          export OUT
          echo "out-dir=$OUT" >> "$GITHUB_OUTPUT"

          # JSON for suggestion-block step + exit-code evaluation.
          python3 ~/.tf-analyze/scripts/detect.py \
            --target . \
            --mode "$MODE" \
            --format json \
            "${EXTRA_ARGS[@]}" \
            > "$OUT/tf-analyze-findings.json" 2>"$OUT/tf-analyze-stderr.txt" \
            || JSON_RC=$?
          # Exit 2+ is a crash: fail on it below, whatever the JSON holds.
          export JSON_RC="${JSON_RC:-0}"

          # Engine-rendered PR summary (R28.1) — score+grade emoji,
          # top-3 findings, top fix, attack-graph block when --attack-graph
          # is set. Becomes the body of the upserted PR comment.
          python3 ~/.tf-analyze/scripts/detect.py \
            --target . \
            --mode "$MODE" \
            --format pr-summary \
            "${EXTRA_ARGS[@]}" \
            > "$OUT/tf-analyze-summary.md" 2>/dev/null || true

          # SARIF for Code Scanning (enterprise/paid orgs).
          python3 ~/.tf-analyze/scripts/detect.py \
            --target . \
            --mode "$MODE" \
            --format sarif \
            "${EXTRA_ARGS[@]}" \
            > "$OUT/tf-analyze.sarif" 2>/dev/null || true

          # Optional compliance gap report — appended to the PR comment
          # as a collapsible section so reviewers see framework posture
          # without leaving the diff.
          if [ -n "$TFA_COMPLIANCE" ]; then
            python3 ~/.tf-analyze/scripts/detect.py \
              --target . \
              --mode "$MODE" \
              --format compliance \
              --compliance-framework "$TFA_COMPLIANCE" \
              > "$OUT/tf-analyze-compliance.txt" 2>/dev/null || true
          fi

          # Determine exit code based on fail-on threshold.
          python3 -c "
          import json, os, sys
          if int(os.environ.get('JSON_RC') or 0) >= 2:
              print('::error::tf-analyze: the JSON scan crashed (exit ' + os.environ['JSON_RC'] + '); see tf-analyze-stderr.txt', file=sys.stderr)
              sys.exit(1)
          d = json.load(open(os.path.join(os.environ['OUT'], 'tf-analyze-findings.json')))
          findings = d.get('findings', d if isinstance(d, list) else [])
          rank = {'CRITICAL': 4, 'HIGH': 3, 'MEDIUM': 2, 'LOW': 1, 'INFO': 0}
          threshold = rank.get(os.environ['FAIL_ON'].upper(), 3)
          breach = [f for f in findings if rank.get(f.get('urgency',''), 0) >= threshold]
          print(f'finding_count={len(findings)}')
          # Unchecked input fails like --fail-on does: an empty target, a
          # rule check that ran out of time, a file that couldn't be read.
          summary = d.get('summary', {}) if isinstance(d, dict) else {}
          unchecked = summary.get('nothing_scanned') or summary.get('rule_timeouts') or summary.get('unreadable_files')
          if unchecked:
              print('::error::tf-analyze: part of the target was not checked (see summary.nothing_scanned / rule_timeouts / unreadable_files)', file=sys.stderr)
          sys.exit(1 if breach or unchecked else 0)
          " | tee -a "$GITHUB_OUTPUT"

      - name: Upload SARIF to Code Scanning
        if: always() && steps.analyze.outputs.out-dir != ''
        continue-on-error: true   # free-tier repos lack Code Scanning; don't fail the job
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.analyze.outputs.out-dir }}/tf-analyze.sarif
          category: tf-analyze

      - name: Post PR suggestion comments
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          (inputs.post-pr-comment != 'false')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          TFA_COMPLIANCE: ${{ inputs.compliance-framework }}
          TFA_OUT: ${{ steps.analyze.outputs.out-dir }}
        with:
          script: |
            const fs = require('fs');
            const out = (name) => `${process.env.TFA_OUT}/${name}`;
            let findings = [];
            try {
              const raw = JSON.parse(fs.readFileSync(out('tf-analyze-findings.json'), 'utf8'));
              findings = raw.findings ?? (Array.isArray(raw) ? raw : []);
            } catch(e) {
              core.warning('Could not read tf-analyze-findings.json: ' + e.message);
            }

            const changedFiles = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const changedPaths = new Set(changedFiles.data.map(f => f.filename));

            function urgencyRank(u) {
              return { CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1, INFO: 0 }[u] ?? 0;
            }
            const URGENCY_EMOJI = { CRITICAL: '🚨', HIGH: '⚠️', MEDIUM: '💡', LOW: 'ℹ️' };

            // Catalogue text into a comment the bot posts, made inert: escape
            // link / HTML / character-reference syntax and break @mentions and
            // autolinks outside code spans (same as the engine's _md_text).
            // A suggestion fence is one backtick longer than any run in the fix.
            const mdText = (s) => {
              const t = String(s ?? '').replace(/[\r\n]+/g, ' ');
              const esc = (x) => x.replace(/[\\\[\]<>&]/g, '\\$&').replace(/@/g, '@\u200b')
                .replace(/(https?):(?=\/\/)/gi, '$1:\u200b').replace(/\bwww\./gi, (m) => m.slice(0, 3) + '\u200b.');
              let out = '', last = 0;
              for (const m of t.matchAll(/(?<!`)(`+)(?!`)[\s\S]+?(?<!`)\1(?!`)/g)) {
                out += esc(t.slice(last, m.index)) + m[0];
                last = m.index + m[0].length;
              }
              return (out + esc(t.slice(last))).replace(/^(\s*)#/, '$1\\#');
            };
            const fence = (body) => '`'.repeat(Math.max(3, ...[...String(body).matchAll(/`+/g)].map((m) => m[0].length + 1)));

            // Deduplicate: one comment per (file, line) using highest-urgency finding
            const byLocation = new Map();
            for (const f of findings) {
              // `fix_suggestion` is text that fits this very line; a suggestion
              // overwrites the line, and `fix_hcl` is a whole block.
              if (!f.fix_suggestion) continue;
              const key = `${f.file}:${f.line}`;
              const existing = byLocation.get(key);
              if (!existing || urgencyRank(f.urgency) > urgencyRank(existing.urgency)) {
                byLocation.set(key, f);
              }
            }

            let suggestionsPosted = 0;
            for (const [, finding] of byLocation) {
              if (!changedPaths.has(finding.file)) continue;
              const emoji = URGENCY_EMOJI[finding.urgency] ?? '•';
              const disruption = finding.fix_disruption ? ` · Disruption: \`${finding.fix_disruption}\`` : '';
              const body = [
                `${emoji} **[${finding.id}]** — ${mdText(finding.title)}`,
                '',
                `> Urgency: \`${finding.urgency}\`${disruption}`,
                '',
                `${fence(finding.fix_suggestion)}suggestion`,
                finding.fix_suggestion.trimEnd(),
                fence(finding.fix_suggestion),
              ].join('\n');
              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  body,
                  path: finding.file,
                  line: finding.line,
                  side: 'RIGHT',
                });
                suggestionsPosted++;
              } catch (e) {
                core.warning(`Could not post suggestion for ${finding.id} at ${finding.file}:${finding.line}: ${e.message}`);
              }
            }

            // Summary comment — engine-rendered pr-summary (R28.1) is
            // the source of truth; we only fall back to a hand-rolled
            // table if the file is somehow missing/empty.
            let summaryBody;
            try {
              const rendered = fs.readFileSync(out('tf-analyze-summary.md'), 'utf8').trim();
              if (rendered) {
                summaryBody = rendered;
              }
            } catch (e) {
              core.warning('pr-summary file unreadable, falling back: ' + e.message);
            }
            if (!summaryBody) {
              const critical = findings.filter(f => f.urgency === 'CRITICAL').length;
              const high = findings.filter(f => f.urgency === 'HIGH').length;
              const medium = findings.filter(f => f.urgency === 'MEDIUM').length;
              summaryBody = findings.length === 0
                ? '✅ **tf-analyze**: no findings above threshold'
                : [
                    '## tf-analyze findings',
                    '',
                    '| Urgency | Count |',
                    '|---------|-------|',
                    `| 🚨 CRITICAL | ${critical} |`,
                    `| ⚠️ HIGH | ${high} |`,
                    `| 💡 MEDIUM | ${medium} |`,
                  ].join('\n');
            }

            // Append the inline-suggestion footer so reviewers know
            // whether to expect Apply-suggestion buttons in the diff.
            if (findings.length > 0) {
              summaryBody += '\n\n' + (
                suggestionsPosted > 0
                  ? `${suggestionsPosted} finding(s) have inline suggestion fixes — click **Apply suggestion** to fix in one click.`
                  : '_No inline suggestions available for changed files._'
              );
            }

            // Optional compliance appendix when --compliance-framework
            // was set. The engine writes the rendered text; we wrap it
            // in <details> so the headline summary stays scannable.
            const fw = process.env.TFA_COMPLIANCE || '';
            if (fw) {
              try {
                const compliance = fs.readFileSync(out('tf-analyze-compliance.txt'), 'utf8').trim();
                if (compliance) {
                  summaryBody += [
                    '',
                    '',
                    `<details><summary>📋 Compliance: ${fw}</summary>`,
                    '',
                    '```',
                    compliance,
                    '```',
                    '',
                    '</details>',
                  ].join('\n');
                }
              } catch (e) {
                core.warning('compliance file unreadable: ' + e.message);
              }
            }

            // Upsert the summary comment so repeated CI runs replace
            // the prior summary instead of stacking N comments per PR.
            // Match on author as well as prefix, so a comment anyone posts
            // starting `## tf-analyze` can't capture the summary. Paginate
            // so PRs with more than 30 comments still find it.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, per_page: 100,
            });
            const prior = comments.find(c =>
              c.user && c.user.type === 'Bot' && c.user.login === 'github-actions[bot]' &&
              (c.body.startsWith('## tf-analyze') || c.body.startsWith('✅ **tf-analyze**'))
            );
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: prior.id, body: summaryBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body: summaryBody,
              });
            }

      - name: Generate HTML report
        if: always() && steps.analyze.outputs.out-dir != ''
        env:
          TFA_OUT: ${{ steps.analyze.outputs.out-dir }}
        run: |
          python3 ~/.tf-analyze/scripts/detect.py \
            --target . \
            --format html > "$TFA_OUT/tf-analyze-report.html"

      - name: Upload HTML artifact
        if: always() && steps.analyze.outputs.out-dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tf-analyze-report
          path: ${{ steps.analyze.outputs.out-dir }}/tf-analyze-report.html
          retention-days: 30
